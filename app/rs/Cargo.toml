[package]
name = "twoyi"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Build as cdylib which will be converted to PIE executable via linker flags
crate-type = ["cdylib"]

[build-dependencies]
cc = "1.0"

[dependencies]

libc = "0.2.112"

once_cell = "1.9.0"

# for log
log = "0.4.14"
android_logger = "0.10"

ndk = "0.6.0"
ndk-sys = "0.3.0"
jni = { version = "0.19.0", default-features = false }

# for input system
uinput-sys = "0.1.7"
unix_socket = "0.5.0"


[patch.crates-io]
uinput-sys = { git = 'https://github.com/tiann/rust-uinput-sys' }
# ── 6-Z267: loader codegen tuning (same rationale as kr64) ──────────
# The loader (rootfs staging, APEX extraction, guest init exec) is the
# 0→+10.7 s boot phase the 6-Z260 instrumentation identified as the
# biggest server-hidden contributor on phones. Whole-crate LTO and a
# single codegen unit inline the copy/extraction hot loops fully.
# Dev/test profiles are untouched.
[profile.release]
lto = "fat"
codegen-units = 1
# 6-Z268: the tracer/loader never unwind (no catch_unwind anywhere in
# the crate; a panic in the tracer thread is fatal for the guest
# anyway) — dropping the unwind tables shrinks the hot text (better
# I-cache) and speeds the link. `strip = "symbols"` removes the
# symbol table (libkr64.so observed 951 KB with symbols shipped;
# rustc >= 1.77 only strips debuginfo by default). Dev/test profiles
# are untouched, so panic-based test asserts keep working.
panic = "abort"
strip = "symbols"
