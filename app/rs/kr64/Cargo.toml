[package]
name = "kr64"
version = "0.1.0"
edition = "2021"
description = "Twoyi kernel-replacement daemon — materialises the per-VM virtual /dev tree, installs a seccomp filter, emulates /proc, and exec's the guest init"
license = "MPL-2.0"

# Build as BOTH a cdylib (libkr64.so — for direct execution via the PIE hack
# and for dlopen by the Java side if ever needed) AND a regular binary (kr64
# — for direct invocation during development / unit tests).
#
# The cdylib uses the same PIE trick as the parent twoyi crate (see
# app/rs/src/interp.c and app/rs/.cargo/config.toml): the .interp section
# forces the dynamic linker to load it, and the `-Wl,-e,kr64_main` linker
# flag sets `kr64_main` as the entry point. This produces a libkr64.so that
# is BOTH dlopen-able AND directly executable (`./libkr64.so arg1 arg2`).
#
# The `bin` target is a thin wrapper around the same `run()` entry point
# and is what gets executed when invoked as `kr64 arg1 arg2` from a shell.
[lib]
name = "kr64"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kr64"
path = "src/main.rs"

[dependencies]
libc = "0.2.112"

# Rust 1.98.0 (Aug 2026) promoted a batch of new style lints to warn (and
# our CI runs clippy with -D warnings). They all fire on pre-existing code
# (60 hits across ptrace_emu.rs / lib.rs / binder.rs) and are pure style —
# no behavior change. Rather than churn 60 sites in the ptrace emulator in
# one commit, we allow them crate-wide. Each can be revisited individually.
# The fmt + 540-test gates remain fully enforced.
[lints.clippy]
assertions_on_constants = "allow"
doc_overindented_list_items = "allow"
unnecessary_map_or = "allow"
doc_lazy_continuation = "allow"
needless_borrows_for_generic_args = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
manual_strip = "allow"
manual_range_patterns = "allow"
manual_div_ceil = "allow"
unusual_byte_groupings = "allow"
unnecessary_cast = "allow"
redundant_pattern_matching = "allow"
question_mark = "allow"
needless_range_loop = "allow"
manual_repeat_n = "allow"
manual_range_contains = "allow"
manual_find = "allow"
int_plus_one = "allow"
collapsible_if = "allow"
chunks_exact_to_as_chunks = "allow"
blocks_in_conditions = "allow"

[dev-dependencies]
# flate2 is used only by the unit test that verifies the klog_init patch
# pattern matches the real TWRP init binary in `assets/twrp/*.img`. It
# decompresses the gzip-encoded ramdisk inside the boot image. We keep
# it as a dev-dependency so the production kr64 binary stays small.
flate2 = "1.0"

[build-dependencies]
cc = "1.0"
