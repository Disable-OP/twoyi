plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    def buildSerial = new SimpleDateFormat("MMddHHmm").format(new Date())

    defaultConfig {
        applicationId "io.twoyi"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        multiDexEnabled true
        versionCode 30505
        versionName "3.5.5-${buildSerial}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // AppCenter analytics key — moved out of TwoyiApplication.java so the
        // source tree contains no secrets and downstream forks can override the
        // key via gradle.properties (APPCENTER_API_KEY=...) or a CI secret
        // without patching Java. The default value below matches the upstream
        // twoyi project; replace it for your own fork.
        buildConfigField "String", "APPCENTER_API_KEY",
                "\"${project.findProperty('APPCENTER_API_KEY') ?: '6223c2b1-30ab-4293-8456-ac575420774e'}\""

        ndk {
            // Both ABIs are now 100% open source (task AOSP-VENDOR-1):
            //   arm64-v8a  — real Android devices
            //   x86_64     — emulators / redroid containers (CI testing)
            // Every native library shipped in the APK is built from source:
            //   libOpenglRender.so  — app/cpp/emugl  (AOSP emugl, CMake)
            //   libloader.so        — app/rs/loader  (Rust, open source)
            //   libtwoyi.so         — app/rs         (Rust, open source)
            abiFilters "arm64-v8a", "x86_64"
        }
        archivesBaseName = "twoyi_${versionName}"
    }

    signingConfigs {
        release {
            // A self-signed test keystore committed to the repo for
            // convenience. This lets CI and codespace builds produce
            // installable APKs without requiring the user to manage
            // a separate keystore. Replace with your own production
            // key before publishing.
            storeFile file('twoyi-release.keystore')
            storePassword 'twoyi-release'
            keyAlias 'twoyi-release'
            keyPassword 'twoyi-release'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // A debuggable variant of the release build — used for on-device
        // diagnostics (task 3-A Part 3, 1-A section E #3). Inherits all
        // of release's config (release keystore signing, no minification,
        // the same native libs and ABIs) EXCEPT:
        //   * `debuggable true`  — enables `adb shell run-as io.twoyi.debug`.
        //   * `applicationIdSuffix ".debug"` — installable alongside the
        //     release build (so the user can keep the production app
        //     installed while debugging).
        //
        // Usage:
        //   ./gradlew assembleDebuggable
        //   adb install -r app/build/outputs/apk/debuggable/*.apk
        //   adb shell run-as io.twoyi.debug cat \
        //     /data/user/0/io.twoyi.debug/rootfs/twrp-init.log
        //
        // The kr64 log mirror (lib.rs post-ptrace-loop) writes to
        // /sdcard/Download/twoyi-logs/ on BOTH the `release` and
        // `debuggable` variants — adb pull works on either. The
        // run-as path is the canonical fallback for poking around
        // the guest rootfs, but requires the `debuggable` variant
        // (release builds reject run-as).
        debuggable {
            initWith release
            debuggable true
            applicationIdSuffix ".debug"
            // The debug keystore is intentionally NOT used — `initWith
            // release` already inherits the release signingConfig, so
            // the debuggable APK is signed with the same key as the
            // release APK. This means an installed `io.twoyi.debug`
            // can be UPGRADED to `io.twoyi` (the release appId) by
            // uninstalling first — but the two CANNOT coexist with the
            // SAME signing identity on the SAME applicationId (which
            // is exactly the point of the `.debug` suffix).
        }
    }
    // extractNativeLibs="true" is set in AndroidManifest.xml, so we must
    // opt into the legacy packaging behavior explicitly. Without this,
    // AGP 7.x emits a build warning on every assembleRelease invocation:
    //   "PackagingOptions.jniLibs.useLegacyPackaging should be set to true
    //    because android:extractNativeLibs is set to "true" in AndroidManifest.xml."
    // Setting it here also future-proofs the build against AGP 8.x where
    // the default flips to false (which would silently break native lib
    // loading at runtime on the legacy extractNativeLibs=true path).
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ============================================================================
// Native build tasks (task AOSP-VENDOR-1 — 100% open source)
// ============================================================================
//
// Build order:  cmakeBuild  ->  cargoBuild  ->  javaPreCompile
//
//   cmakeBuild  : builds libOpenglRender.so from the vendored AOSP emugl
//                 source under app/cpp/emugl/ (CMake + NDK toolchain).
//   cargoBuild  : builds libtwoyi.so (the JNI renderer glue) from
//                 app/rs/. Its build.rs links against libOpenglRender.so,
//                 so it MUST run after cmakeBuild.
//
// Both tasks accept -Pabis=arm64-v8a,x86_64 (or -Pabis=all) to restrict
// which ABIs are built. The default is "all".

task cmakeBuild {
    doLast {
        exec {
            def abis = project.hasProperty('abis') ? project.getProperty('abis').split(',') : ['all']
            workingDir new File(project.projectDir, "cpp")
            commandLine "bash", "build.sh", *abis
            ignoreExitValue = false
        }
    }
}

task loaderBuild {
    doLast {
        exec {
            def abis = project.hasProperty('abis') ? project.getProperty('abis').split(',') : ['all']
            workingDir new File(project.projectDir, "rs/loader")
            commandLine "bash", "build.sh", *abis
            ignoreExitValue = false
        }
    }
}

task kr64Build {
    doLast {
        exec {
            def abis = project.hasProperty('abis') ? project.getProperty('abis').split(',') : ['all']
            workingDir new File(project.projectDir, "rs/kr64")
            commandLine "bash", "build.sh", *abis
            ignoreExitValue = false
        }
    }
}

task cargoBuild {
    dependsOn 'cmakeBuild'
    doLast {
        exec {
            // Build libtwoyi.so for both arm64-v8a and x86_64.
            // arm64-v8a  -> real devices
            // x86_64     -> emulators / redroid containers (CI testing)
            //
            // The "all" arg tells build_rs.sh to build every supported ABI.
            // Override by setting project property -Pabis=arm64-v8a if you
            // only want one (faster local iteration).
            def abis = project.hasProperty('abis') ? project.getProperty('abis').split(',') : ['all']
            workingDir new File(project.projectDir, "rs")
            commandLine "sh", "build_rs.sh", "--release", *abis
            ignoreExitValue = false
        }
    }
}

tasks.whenTaskAdded { task ->
    // Match any javaPreCompile* task (Debug, Release, and the new
    // Debuggable buildType added in task 3-A Part 3) so the native
    // build dependencies are wired for every variant without having
    // to enumerate them.
    if (task.name.startsWith('javaPreCompile')) {
        task.dependsOn 'cargoBuild'
        task.dependsOn 'loaderBuild'
        task.dependsOn 'kr64Build'
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'

    def libsuVersion = '3.2.1'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"

    // AboutPage
    implementation 'com.github.medyo:android-about-page:1.2.4'
    implementation 'de.psdev.licensesdialog:licensesdialog:1.9.0'
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    
    implementation 'org.jdeferred:jdeferred-android-aar:1.2.4'
    implementation 'com.github.clans:fab:1.6.4'

    //noinspection GradleDependency
    implementation ('com.github.bumptech.glide:glide:4.9.0')
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    annotationProcessor 'androidx.annotation:annotation:1.3.0'

    implementation 'com.cleveroad:androidmanimation:0.9.1'

    def appCenterSdkVersion = '4.3.1'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"

    // Apache Commons Compress — pure Java LZMA/XZ decompression for ramdisk import.
    // Used by RamdiskImporter to handle LZMA-compressed TWRP ramdisks (arm64 images).
    implementation 'org.apache.commons:commons-compress:1.21'

    // 6-Z209c: org.tukaani:xz — REQUIRED at runtime for XZCompressorInputStream
    // to actually decode XZ streams. commons-compress declares xz as a
    // 'compile' (transitive) dependency, but Android Gradle Plugin's
    // 'useAndroidAnnotations' + proguard pruning strips the tukaani
    // classes from the final APK when no direct reference exists in the
    // app's own Java code (the app only directly references commons-
    // compress classes like XZCompressorInputStream + LZMACompressorInputStream;
    // XZCompressorInputStream's <init> calls `new org.tukaani.xz.SingleXZInputStream(...)`
    // reflectively via Class.forName, so the AGP bytecode shrinker can't
    // see the dependency).
    //
    // Without this direct dependency, run 33208876095 (lineage-22.2-sailfish
    // on 559b9ca) crashed with:
    //   java.lang.NoClassDefFoundError: Failed resolution of:
    //     Lorg/tukaani/xz/SingleXZInputStream;
    //   Caused by: java.lang.ClassNotFoundException: Didn't find class
    //     "org.tukaani.xz.SingleXZInputStream" on path: DexPathList[...]
    // The 6-Z209a diagnostic surfaced this — the previous code silently
    // swallowed the NoClassDefFoundError as a hung import thread.
    //
    // Pin to 1.10 (latest stable as of 2024; commons-compress 1.21
    // declares 1.9 transitively — 1.10 is API-compatible).
    implementation 'org.tukaani:xz:1.10'

    // Multidex — required because commons-compress adds many methods
    implementation 'androidx.multidex:multidex:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
