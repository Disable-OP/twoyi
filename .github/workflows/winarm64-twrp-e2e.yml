# ARM64 TWRP E2E Test on Windows 11 ARM runner.
#
# Uses the windows-11-arm runner (native ARM64 hardware). The Android
# emulator runs in software mode (no Hyper-V/KVM — slow but works).
#
# The Windows ARM runner has:
#   - Visual Studio 2022 with Android SDK (MAUI) pre-installed
#   - WSLv1 (not WSLv2 — no Hyper-V nested virtualization)
#   - JDK 17 (via Visual Studio)
#
# We install the Android SDK command-line tools + arm64-v8a system image
# + emulator, then boot the emulator in software rendering mode.
---
name: WinARM64 TWRP E2E Test

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for TWRP to boot (seconds)'
        required: false
        default: '180'
      twrp:
        description: 'Boot TWRP recovery image'
        type: boolean
        required: false
        default: true

concurrency:
  group: winarm64-twrp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winarm64-twrp-e2e:
    name: Boot TWRP on Windows ARM64 emulator
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ARM64 architecture
        shell: pwsh
        run: |
          Write-Host "=== Architecture ==="
          Write-Host $env:PROCESSOR_ARCHITECTURE
          Write-Host "=== OS Architecture ==="
          (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          Write-Host "=== CPU info ==="
          (Get-CimInstance Win32_Processor).Name

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK command-line tools
        shell: pwsh
        run: |
          $ANDROID_HOME = "$env:LOCALAPPDATA\Android\Sdk"
          $cmdlineToolsDir = "$ANDROID_HOME\cmdline-tools"
          if (-not (Test-Path "$cmdlineToolsDir\latest\bin")) {
            New-Item -ItemType Directory -Force -Path $cmdlineToolsDir
            $url = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
            $zip = "$env:TEMP\cmdline-tools.zip"
            Write-Host "Downloading command-line tools..."
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $cmdlineToolsDir -Force
            Rename-Item "$cmdlineToolsDir\cmdline-tools" "latest"
            Remove-Item $zip
          }
          echo "ANDROID_HOME=$ANDROID_HOME" >> $env:GITHUB_ENV
          echo "$ANDROID_HOME\cmdline-tools\latest\bin" >> $env:GITHUB_PATH
          echo "$ANDROID_HOME\platform-tools" >> $env:GITHUB_PATH
          echo "$ANDROID_HOME\emulator" >> $env:GITHUB_PATH
          Write-Host "Android SDK installed at $ANDROID_HOME"

      - name: Install Android SDK packages
        shell: cmd
        run: |
          set ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk
          set PATH=%ANDROID_HOME%\cmdline-tools\latest\bin;%ANDROID_HOME%\platform-tools;%ANDROID_HOME%\emulator;%PATH%
          echo Accepting licenses...
          call sdkmanager --licenses
          echo Installing packages...
          call sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "emulator" "system-images;android-30;default;arm64-v8a"
          echo === Emulator version ===
          call emulator -version

      - name: Create ARM64 AVD
        shell: cmd
        run: |
          set ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk
          set ANDROID_AVD_HOME=%USERPROFILE%\.android\avd
          mkdir "%ANDROID_AVD_HOME%" 2>nul
          echo no | "%ANDROID_HOME%\cmdline-tools\latest\bin\avdmanager.bat" create avd -n twoyi_arm64 -k "system-images;android-30;default;arm64-v8a" --force
          set AVD_CONFIG=%ANDROID_AVD_HOME%\twoyi_arm64.avd\config.ini
          echo hw.keyboard=yes >> "%AVD_CONFIG%"
          echo hw.gpu.enabled=yes >> "%AVD_CONFIG%"
          echo hw.gpu.mode=swiftshader_indirect >> "%AVD_CONFIG%"
          echo hw.ramSize=2048 >> "%AVD_CONFIG%"
          echo disk.dataPartition.size=4096 >> "%AVD_CONFIG%"
          echo vm.heapSize=256 >> "%AVD_CONFIG%"
          type "%AVD_CONFIG%"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-winarm64-cargo-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-winarm64-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-winarm64-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build APK (arm64-v8a only)
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true
          ./gradlew assembleRelease -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Run TWRP E2E test
        shell: bash
        run: |
          # Convert Windows paths to Unix-style for the bash script
          export ANDROID_HOME=$(cygpath -u "$ANDROID_HOME" 2>/dev/null || echo "$LOCALAPPDATA/Android/Sdk")
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          chmod +x scripts/kvm-e2e-test.sh
          chmod +x scripts/extract-twrp-ramdisk.py 2>/dev/null || true
          chmod +x scripts/pack-logs.sh

          timeout --signal=KILL 1800 bash scripts/kvm-e2e-test.sh \
              --rootfs-source emulator \
              --boot-wait "${{ github.event.inputs.boot_wait_seconds || '180' }}" \
              --artifact-dir /tmp/ci-artifacts \
              --twrp \
              || true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          TWOYI_TWRP: ${{ github.event.inputs.twrp == 'true' && '1' || '' }}
          TWOYI_NO_ROOT: '1'
          TWOYI_ARM64_TCG: '1'

      - name: Print boot verdict
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ci-artifacts/boot-verdict.txt ]; then
              cat /tmp/ci-artifacts/boot-verdict.txt
          else
              echo "(no verdict file)"
          fi

      - name: Pack logs
        if: always()
        shell: bash
        run: |
          chmod +x scripts/pack-logs.sh
          ./scripts/pack-logs.sh /tmp/twoyi-logs.tar.xz \
            /tmp/ci-artifacts/logcat.txt \
            /tmp/ci-artifacts/kr64-stderr.log \
            /tmp/ci-artifacts/boot-verdict.txt \
            /tmp/ci-artifacts/emulator-stdout.log \
            /tmp/ci-artifacts/emulator-stderr.log \
            /tmp/ci-artifacts/twrp-strace.log \
            /tmp/ci-artifacts/twrp-guest-tree.log \
            /tmp/ci-artifacts/twrp-fb-rgba.bin \
            /tmp/ci-artifacts/twrp-fb.png \
            /tmp/ci-artifacts/dmesg.log \
            || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winarm64-twrp-logs
          path: /tmp/twoyi-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
