# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# aarch64-qemu build-and-boot PROOF v3 — per user directive
# (2026-08-26): "Try using aarch64-qemu emulator GitHub repo from
# online, please just make it work and make arm64 TWRP and AOSP be
# the same state as x86_64."
#
# v3 fixes on top of v2 (run 32945974304 — configure PASSED, build
# died in 0.03s at the stale top-level Makefile):
#
#   5. The fork's checked-in top-level Makefile is a STALE BREAKPAD
#      AUTOMAKE ARTIFACT ("Makefile.in generated by automake 1.14.1",
#      full of src/tools/mac/dump_syms rules). make died:
#        Makefile:5572: src/tools/mac/dump_syms/.deps/...Po: No such
#        file or directory
#        make: *** No rule to make target ... Stop.
#      QEMU's configure does NOT generate the top-level Makefile — it
#      expects the checked-in QEMU Makefile that upstream qemu ships.
#      v3 replaces it with upstream QEMU v2.12.0's Makefile (the
#      fork's VERSION file says 2.12.0).
#
# v2 fixes (kept):
#   1. No --enable-slirp (unknown option in QEMU 2.12).
#   2. Bypass the Android build wrapper: after ./configure, rename
#      GNUmakefile → GNUmakefile.android-disabled. (The Android path
#      needs AOSP prebuilts for which NO linux-aarch64 variant exists
#      — structurally impossible on an arm64 host.)
#   3. python2.7 from Debian bullseye .debs into /opt/py2 (the fork's
#      configure hard-rejects Python 3; Ubuntu 24.04 has no python2).
#   4. --disable-werror (werror auto-enables for git builds).
#
# The empirical question this workflow answers:
#   Does the aarch64-android-emulator/aarch64-qemu fork
#   (emu-3.1-release branch, "Patches for aarch64", commit 0582a5f,
#    Aug 21 2019 — QEMU 2.12-based) build via the VANILLA QEMU path
#   on ubuntu-24.04-arm, and does the resulting qemu-system-aarch64
#   (with ranchu machine + goldfish devices) boot a real
#   arm64-v8a AVD image (API 28) under TCG (no /dev/kvm on the
#   hosted ARM fleet) far enough to see Android init services in
#   the serial console?
#
# Anti-false-green rules (per user):
#   - Boot is proven ONLY by serial-console progression markers
#     (Linux banner → androidboot.hardware → init: Service
#     'servicemanager'/'vold'/'surfaceflinger'/'zygote' →
#     system_server → bootanimation → sys.boot_completed),
#     NOT by process exit codes.
#   - The workflow FAILS unless the boot gate passes.
#   - All logs uploaded as artifacts for manual inspection.
---
name: aarch64-qemu build-and-boot proof (v3)

'on':
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level (28 = Pie, contemporary with the 2019 fork)'
        required: false
        default: '28'
      build_minutes:
        description: 'Hard cap on QEMU build minutes'
        required: false
        default: '45'
      boot_minutes:
        description: 'Hard cap on boot wait minutes'
        required: false
        default: '20'

concurrency:
  group: aarch64-qemu-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Build aarch64-qemu (vanilla path) + boot arm64 AVD
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      PROOF_DIR: /tmp/aarch64-qemu-proof
      FORK_URL: https://github.com/aarch64-android-emulator/aarch64-qemu.git
      FORK_BRANCH: emu-3.1-release
      ANDROID_HOME: /opt/android-sdk
      PY2_DIR: /opt/py2
      # Phase gates — all must be 'true' for the workflow to PASS.
      BUILD_SUCCEEDED: 'false'
      IMAGE_INSTALLED: 'false'
      BOOT_SUCCEEDED: 'false'
      BOOT_COMPLETED_PROP: 'false'

    steps:
      # ════════════════════════════════════════════════════════════
      # Step 0 — Runner sanity check
      # ════════════════════════════════════════════════════════════
      - name: Step 0 — Runner sanity check
        run: |
          set -u
          mkdir -p "$PROOF_DIR"
          cd "$PROOF_DIR"
          {
            echo "── 0.1 Runner architecture ──"
            UNAME=$(uname -m)
            echo "uname -m: $UNAME"
            if [ "$UNAME" != "aarch64" ]; then
              echo "✗ Runner is $UNAME — expected aarch64. Aborting."
              exit 1
            fi
            echo "✓ Running on aarch64 hardware ($(nproc) cores)"
            free -h | head -2

            echo ""
            echo "── 0.2 /dev/kvm check (expected: absent) ──"
            if [ -e /dev/kvm ]; then
              ls -l /dev/kvm
              echo "  ⚠ /dev/kvm present — KVM acceleration available (unexpected)"
            else
              echo "  ✓ /dev/kvm absent (TCG fallback will be used)"
            fi

            echo ""
            echo "── 0.3 Disk space ──"
            df -h / /tmp | head -5
          } | tee step0_runner_state.txt

      # ════════════════════════════════════════════════════════════
      # Step 1 — Build deps + python2.7 (required by the fork)
      # ════════════════════════════════════════════════════════════
      - name: Step 1 — Install build deps + python2.7 from Debian bullseye
        run: |
          set -eux
          sudo apt-get update -qq
          # QEMU 2.12 build requirements:
          #  - build-essential, pkg-config
          #  - libglib2.0-dev, libpixman-1-dev (core deps)
          #  - libfdt-dev (device tree — system copy; the fork's dtc
          #    git submodule is empty in a shallow clone)
          #  - flex bison
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates \
            python3 \
            libglib2.0-dev libpixman-1-dev libfdt-dev \
            flex bison \
            zlib1g-dev \
            git curl wget unzip xz-utils

          # ── python2.7 from Debian bullseye (arm64) ──
          # The fork's ./configure hard-requires Python 2.6/2.7:
          #   if ! $python -c 'import sys; sys.exit(sys.version_info
          #     < (2,6) or sys.version_info >= (3,))'; then
          #     error_exit "Cannot use '$python', Python 2.6 or later
          #       is required. Note that Python 3 or later is not yet
          #       supported."
          # Ubuntu 24.04 (noble) dropped python2 from the archive, so
          # we install the Debian bullseye arm64 .debs directly.
          sudo mkdir -p "$PY2_DIR"
          cd /tmp
          BASE=http://deb.debian.org/debian/pool/main/p/python2.7
          for deb in \
            libpython2.7-minimal_2.7.18-8+deb11u1_arm64.deb \
            python2.7-minimal_2.7.18-8+deb11u1_arm64.deb \
            libpython2.7-stdlib_2.7.18-8+deb11u1_arm64.deb \
            python2.7_2.7.18-8+deb11u1_arm64.deb; do
            echo "── downloading $deb ──"
            curl -fsSL "$BASE/$deb" -o "$deb" || {
              echo "✗ failed to download $deb"
              exit 1
            }
          done
          ls -la *.deb
          # Extract them all into $PY2_DIR (no dpkg install — avoids
          # Ubuntu python2 package conflicts). The .debs unpack into
          # ./usr/bin/python2.7 + ./usr/lib/python2.7/*.
          for deb in *.deb; do
            dpkg-deb -x "$deb" "$PY2_DIR-root"
          done
          sudo mv "$PY2_DIR-root/usr" "$PY2_DIR/usr"
          sudo mv "$PY2_DIR-root/lib" "$PY2_DIR/lib" 2>/dev/null || true
          sudo rm -rf "$PY2_DIR-root"
          # The python2.7 binary links against libpython2.7.so.1.0
          # (in libpython2.7-stdlib, unpacked under $PY2_DIR/usr/lib/
          # aarch64-linux-gnu/). The dynamic linker won't find it there
          # by default — create a wrapper script that sets
          # LD_LIBRARY_PATH so configure can invoke it as $python.
          PY2_REAL="$PY2_DIR/usr/bin/python2.7"
          PY2_LIBDIR=$(dirname "$(find "$PY2_DIR/usr/lib" -name 'libpython2.7.so*' | head -1)")
          echo "libpython2.7 located at: $PY2_LIBDIR"
          sudo mv "$PY2_REAL" "$PY2_REAL.bin"
          sudo tee "$PY2_REAL" > /dev/null <<'PYWRAP'
          #!/bin/sh
          # Relocated python2.7 wrapper — sets LD_LIBRARY_PATH so the
          # binary finds libpython2.7.so.1.0 next to it.
          PY2_ROOT=/opt/py2/usr
          export LD_LIBRARY_PATH="$PY2_ROOT/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH"
          exec "$PY2_ROOT/bin/python2.7.bin" "$@"
          PYWRAP
          sudo chmod 755 "$PY2_REAL"
          # Sanity check: the version gate must pass
          "$PY2_REAL" -c 'import sys; sys.exit(sys.version_info < (2,6) or sys.version_info >= (3,))' \
            && echo "✓ python2.7 version gate passes" \
            || { echo "✗ python2.7 gate failed"; exit 1; }
          "$PY2_REAL" --version
          "$PY2_REAL" -c 'import zlib; print("zlib module ok")' || echo "  (no zlib module — non-fatal)"

      # ════════════════════════════════════════════════════════════
      # Step 2 — Clone the aarch64-qemu fork
      # ════════════════════════════════════════════════════════════
      - name: Step 2 — Clone aarch64-android-emulator/aarch64-qemu fork
        run: |
          set -eux
          cd "$PROOF_DIR"
          # Shallow clone of just the emu-3.1-release branch.
          git clone --depth 1 --branch "$FORK_BRANCH" "$FORK_URL" qemu
          cd qemu
          echo "── Latest commit ──"
          git log -1 --format='%H %ai %s'
          echo ""
          echo "── QEMU VERSION file ──"
          cat VERSION
          echo ""
          echo "── ranchu + goldfish presence (the fork's whole point) ──"
          ls -la hw/arm/ranchu.c hw/misc/goldfish_pipe.c 2>&1
          grep -n "ranchu" hw/arm/Makefile.objs

      # ════════════════════════════════════════════════════════════
      # Step 3 — Configure via the VANILLA QEMU path (v2 fix)
      # ════════════════════════════════════════════════════════════
      - name: Step 3 — Vanilla ./configure (aarch64-softmmu, python2.7, no werror)
        run: |
          set -eux
          cd "$PROOF_DIR/qemu"
          PY2="$PY2_DIR/usr/bin/python2.7"
          # v2 fixes vs v1:
          #  - NO --enable-slirp (unknown option in QEMU 2.12; slirp
          #    is in-tree and always-on)
          #  - --disable-werror (werror auto-enables for git builds;
          #    2018 code + gcc 13 = warnings → errors)
          #  - --python=$PY2 (configure rejects Python 3)
          #  - Everything headless: no SDL/GTK/OpenGL/virgl/curl/
          #    capstone/curses/tools/docs/guest-agent — minimises the
          #    dependency surface for the 2018-era code
          ./configure \
            --target-list=aarch64-softmmu \
            --python="$PY2" \
            --disable-werror \
            --disable-docs \
            --disable-sdl \
            --disable-gtk \
            --disable-opengl \
            --disable-virglrenderer \
            --disable-curl \
            --disable-curses \
            --disable-tools \
            --disable-capstone \
            --disable-guest-agent \
            --disable-guest-agent-msi \
            --disable-user \
            --disable-bsd-user \
            --disable-linux-user \
            2>&1 | tee configure.log

          echo ""
          echo "── Configure summary (last 50 lines) ──"
          tail -50 configure.log

          # Verify the config file was generated
          if [ ! -f config-host.mak ]; then
            echo "✗ config-host.mak not generated — configure failed"
            exit 1
          fi
          echo "✓ config-host.mak generated"

          # v3 fix: the fork's checked-in top-level Makefile is a STALE
          # BREAKPAD AUTOMAKE ARTIFACT ("Makefile.in generated by automake
          # 1.14.1" with src/tools/mac/dump_syms rules — verified by run
          # 32945974304: make died at Makefile:5572 with 'No rule to make
          # target src/tools/mac/dump_syms/.deps/...').
          #
          # QEMU's configure does NOT generate the top-level Makefile —
          # it expects the checked-in QEMU Makefile (which upstream qemu
          # ships at the tree root). The Android emulator build system
          # (which uses its own objs/ tree via GNUmakefile) accidentally
          # left a breakpad Makefile in its place.
          #
          # Fix: replace it with the upstream QEMU v2.12.0 Makefile (the
          # fork's VERSION file says 2.12.0).
          echo ""
          echo "── Replacing the stale breakpad Makefile with upstream QEMU v2.12.0's ──"
          mv Makefile Makefile.breakpad-stale
          curl -fsSL "https://raw.githubusercontent.com/qemu/qemu/v2.12.0/Makefile" -o Makefile
          wc -l Makefile
          head -3 Makefile
          grep -q "^# Makefile for QEMU" Makefile || {
            echo "✗ downloaded Makefile doesn't look like QEMU's"
            exit 1
          }
          echo "✓ upstream QEMU v2.12.0 Makefile in place"

          # v2 fix #2: DELETE the Android build system's GNUmakefile
          # so plain `make` uses QEMU's own Makefile.
          echo ""
          echo "── Removing the Android build-system intercept (GNUmakefile) ──"
          mv GNUmakefile GNUmakefile.android-disabled
          ls -la Makefile GNUmakefile* 2>&1
          echo "✓ plain 'make' will now use QEMU's Makefile"

      # ════════════════════════════════════════════════════════════
      # Step 4 — Build
      # ════════════════════════════════════════════════════════════
      - name: Step 4 — Build QEMU (make -j$(nproc))
        run: |
          set -eux
          set -o pipefail
          cd "$PROOF_DIR/qemu"
          BUILD_CAP_MIN=${{ inputs.build_minutes }}
          (
            sleep $((BUILD_CAP_MIN * 60))
            echo "⏱ Build watchdog fired after ${BUILD_CAP_MIN} min — killing make"
            pkill -9 -f 'make' || true
          ) &
          WATCHDOG_PID=$!
          make -j"$(nproc)" 2>&1 | tee build.log
          kill "$WATCHDOG_PID" 2>/dev/null || true
          # Verify the binary exists and is a real arm64 ELF
          ls -la aarch64-softmmu/qemu-system-aarch64
          file aarch64-softmmu/qemu-system-aarch64
          ./aarch64-softmmu/qemu-system-aarch64 --version
          echo ""
          echo "── Available machine types (ranchu must be listed) ──"
          ./aarch64-softmmu/qemu-system-aarch64 -M help 2>&1 | tee machine_types.log
          grep -q ranchu machine_types.log || {
            echo "✗ ranchu machine type missing from the built binary"
            exit 1
          }
          echo "✓ ranchu machine type present"
          echo "BUILD_SUCCEEDED=true" >> $GITHUB_ENV

      # ════════════════════════════════════════════════════════════
      # Step 5 — Android SDK + arm64-v8a AVD image (API 28)
      # ════════════════════════════════════════════════════════════
      - name: Step 5 — Install Android SDK + arm64-v8a system image
        if: env.BUILD_SUCCEEDED == 'true'
        run: |
          set -eux
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R $USER:$USER "$ANDROID_HOME"
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fsSL "$CMDLINE_URL" -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/"
          mv "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools-tmp"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools-tmp"/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf "$ANDROID_HOME/cmdline-tools-tmp"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" > /dev/null

          API_LEVEL=${{ inputs.api_level }}
          PKG="system-images;android-${API_LEVEL};default;arm64-v8a"
          echo "── Installing: $PKG ──"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$PKG" 2>&1 | tail -8
          IMG_DIR="$ANDROID_HOME/system-images/android-${API_LEVEL}/default/arm64-v8a"
          if [ ! -d "$IMG_DIR" ]; then
            echo "✗ arm64-v8a system image NOT installed for API ${API_LEVEL}"
            exit 1
          fi
          echo "── Installed files ──"
          ls -la "$IMG_DIR"
          # Locate the kernel (name varies: kernel-ranchu / kernel-ranchu64)
          KERNEL=""
          for k in kernel-ranchu64 kernel-ranchu; do
            if [ -f "$IMG_DIR/$k" ]; then KERNEL="$IMG_DIR/$k"; break; fi
          done
          if [ -z "$KERNEL" ]; then
            echo "✗ no kernel-ranchu/kernel-ranchu64 in $IMG_DIR"
            ls "$IMG_DIR"
            exit 1
          fi
          echo "KERNEL_PATH=$KERNEL" >> $GITHUB_ENV
          echo "AVD_IMAGE_DIR=$IMG_DIR" >> $GITHUB_ENV
          echo "API_LEVEL=$API_LEVEL" >> $GITHUB_ENV
          file "$KERNEL"
          echo "IMAGE_INSTALLED=true" >> $GITHUB_ENV

      # ════════════════════════════════════════════════════════════
      # Step 6 — Boot the AVD with the built qemu-system-aarch64
      # ════════════════════════════════════════════════════════════
      - name: Step 6 — Boot arm64 AVD (ranchu machine, TCG)
        if: env.IMAGE_INSTALLED == 'true'
        run: |
          set -u
          cd "$PROOF_DIR"
          QEMU_BIN="$PROOF_DIR/qemu/aarch64-softmmu/qemu-system-aarch64"
          IMG_DIR="$AVD_IMAGE_DIR"
          KERNEL="$KERNEL_PATH"
          LOG_DIR="$PROOF_DIR/boot_logs"
          mkdir -p "$LOG_DIR"

          # Make writable copies of the images (qemu opens them
          # read-write by default; the SDK dir images are fine to
          # copy to keep the originals pristine).
          cp "$IMG_DIR/system.img" "$LOG_DIR/system.img" 2>/dev/null || \
            cp "$IMG_DIR/system.img" "$LOG_DIR/system.img"
          cp "$IMG_DIR/userdata.img" "$LOG_DIR/userdata.img" 2>/dev/null || \
            cp "$IMG_DIR/userdata.img" "$LOG_DIR/userdata.img"

          # Boot with the ranchu machine (goldfish_fb, goldfish_pipe,
          # goldfish_battery, goldfish_audio, goldfish-events-keypad,
          # goldfish_sync — the full Android goldfish device set the
          # AVD image's kernel expects).
          #
          # We have NO adb without the emulator wrapper (adb goes via
          # goldfish_pipe + host-side daemon), so boot verification is
          # serial-console-marker based.
          #
          # qemu 2.12 ranchu uses MMIO virtio transports — virtio
          # devices are auto-plugged into the transports the board
          # creates (create_virtio_devices in ranchu.c).
          $QEMU_BIN \
            -M ranchu \
            -cpu cortex-a57 \
            -smp 2 \
            -m 2048 \
            -kernel "$KERNEL" \
            -initrd "$IMG_DIR/ramdisk.img" \
            -drive "file=$LOG_DIR/system.img,if=none,id=system,format=raw" \
            -device "virtio-blk-device,drive=system" \
            -drive "file=$LOG_DIR/userdata.img,if=none,id=userdata,format=raw" \
            -device "virtio-blk-device,drive=userdata" \
            -append "qemu=1 no_timer_check androidboot.hardware=ranchu androidboot.console=ttyS0 androidboot.selinux=permissive console=ttyS0 printk=1" \
            -netdev user,id=net0 \
            -device "virtio-net-device,netdev=net0" \
            -nographic \
            -serial "file:$LOG_DIR/serial.log" \
            -monitor none \
            -no-reboot \
            > "$LOG_DIR/qemu_stdout.log" 2>&1 &
          QEMU_PID=$!
          echo "qemu launched as PID $QEMU_PID"
          echo "$QEMU_PID" > "$LOG_DIR/qemu.pid"

          # Poll serial.log for boot markers
          BOOT_CAP_MIN=${{ inputs.boot_minutes }}
          DEADLINE=$(( $(date +%s) + BOOT_CAP_MIN * 60 ))
          SEEN_KERNEL=false; SEEN_INIT=false; SEEN_SERVICEMANAGER=false
          SEEN_VOLD=false; SEEN_SURFACEFLINGER=false; SEEN_ZYGOTE=false
          SEEN_SYSTEM_SERVER=false; SEEN_BOOTANIM=false; SEEN_BOOT_COMPLETED=false
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 10
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "✗ qemu exited early — qemu_stdout.log tail:"
              tail -30 "$LOG_DIR/qemu_stdout.log" 2>/dev/null
              break
            fi
            SL="$LOG_DIR/serial.log"
            [ -f "$SL" ] || continue
            grep -q 'Linux version' "$SL" && SEEN_KERNEL=true
            grep -qiE 'init:.*(startup|Service|second_stage)' "$SL" && SEEN_INIT=true
            grep -qi 'servicemanager' "$SL" && SEEN_SERVICEMANAGER=true
            grep -qi 'vold' "$SL" && SEEN_VOLD=true
            grep -qi 'surfaceflinger' "$SL" && SEEN_SURFACEFLINGER=true
            grep -qiE 'zygote' "$SL" && SEEN_ZYGOTE=true
            grep -qi 'system_server' "$SL" && SEEN_SYSTEM_SERVER=true
            grep -qi 'bootanimation' "$SL" && SEEN_BOOTANIM=true
            grep -qi 'sys.boot_completed' "$SL" && SEEN_BOOT_COMPLETED=true
            if [ "$SEEN_BOOT_COMPLETED" = "true" ]; then
              echo "✓ sys.boot_completed marker found"
              break
            fi
            # Progress heartbeat every ~30s
            echo "── heartbeat @ $(date -u +%T) (serial.log: $(wc -l < "$SL" 2>/dev/null || echo 0) lines) ──"
            tail -3 "$SL" 2>/dev/null | head -3
          done

          echo ""
          echo "── Boot progression (from serial.log scan) ──"
          echo "  kernel:             $SEEN_KERNEL"
          echo "  init:               $SEEN_INIT"
          echo "  servicemanager:     $SEEN_SERVICEMANAGER"
          echo "  vold:               $SEEN_VOLD"
          echo "  surfaceflinger:     $SEEN_SURFACEFLINGER"
          echo "  zygote:             $SEEN_ZYGOTE"
          echo "  system_server:      $SEEN_SYSTEM_SERVER"
          echo "  bootanimation:      $SEEN_BOOTANIM"
          echo "  sys.boot_completed: $SEEN_BOOT_COMPLETED"
          if [ "$SEEN_KERNEL" = "true" ] && [ "$SEEN_INIT" = "true" ]; then
            echo "BOOT_SUCCEEDED=true" >> $GITHUB_ENV
          fi
          if [ "$SEEN_BOOT_COMPLETED" = "true" ]; then
            echo "BOOT_COMPLETED_PROP=true" >> $GITHUB_ENV
          fi
          echo ""
          echo "── Final serial.log tail (last 60 lines) ──"
          tail -60 "$LOG_DIR/serial.log" 2>/dev/null || true
          echo ""
          echo "── qemu_stdout.log tail ──"
          tail -20 "$LOG_DIR/qemu_stdout.log" 2>/dev/null || true

      # ════════════════════════════════════════════════════════════
      # Step 7 — Anti-false-green verification + SUMMARY
      # ════════════════════════════════════════════════════════════
      - name: Step 7 — Verdict + SUMMARY.md
        if: always()
        run: |
          set -u
          LOG_DIR="$PROOF_DIR/boot_logs"
          SL="$LOG_DIR/serial.log"
          {
            echo "# aarch64-qemu build-and-boot PROOF v2 — Verdict"
            echo ""
            echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Runner:** ubuntu-24.04-arm"
            echo "**Fork:** $FORK_URL ($FORK_BRANCH @ 0582a5f, Aug 21 2019)"
            echo "**Fork base:** QEMU 2.12.0 (Android emulator 3.1 era)"
            echo "**API level tested:** ${API_LEVEL:-${{ inputs.api_level }}}"
            echo ""
            echo "## Phase gates"
            echo ""
            echo "| Gate | State |"
            echo "|---|---|"
            echo "| Build (vanilla ./configure + make) | ${{ env.BUILD_SUCCEEDED }} |"
            echo "| ranchu machine present | (checked in Step 4) |"
            echo "| arm64-v8a AVD image installed | ${{ env.IMAGE_INSTALLED }} |"
            echo "| Kernel+init seen in serial log | ${{ env.BOOT_SUCCEEDED }} |"
            echo "| sys.boot_completed seen | ${{ env.BOOT_COMPLETED_PROP }} |"
            echo ""
            if [ -f "$SL" ]; then
              echo "## Boot progression markers (serial.log)"
              echo ""
              for marker in \
                "Linux version" \
                "androidboot.hardware" \
                "init: Service 'ueventd'" \
                "init: Service 'servicemanager'" \
                "init: Service 'vold'" \
                "init: Service 'surfaceflinger'" \
                "init: Service 'zygote'" \
                "system_server" \
                "bootanimation" \
                "sys.boot_completed"; do
                CNT=$(grep -ci "$marker" "$SL" 2>/dev/null || echo 0)
                echo "- \`$marker\`: $CNT occurrences"
              done
              echo ""
              echo "## serial.log size"
              wc -l "$SL" 2>/dev/null || true
            else
              echo "## serial.log: NOT CREATED (qemu never started or died instantly)"
            fi
            echo ""
            echo "## Verdict"
            if [ "${{ env.BUILD_SUCCEEDED }}" = "true" ] \
               && [ "${{ env.BOOT_COMPLETED_PROP }}" = "true" ]; then
              echo ""
              echo "✅ **PASS** — the fork builds via the vanilla QEMU path and boots"
              echo "   a real arm64-v8a AVD to BOOT_COMPLETED under TCG. Proceed to"
              echo "   Twoyi arm64 TWRP/AOSP E2E parity."
            elif [ "${{ env.BUILD_SUCCEEDED }}" = "true" ] \
               && [ "${{ env.BOOT_SUCCEEDED }}" = "true" ]; then
              echo ""
              echo "🟡 **PARTIAL** — fork builds and the guest boots (kernel + init) but"
              echo "   does NOT reach sys.boot_completed within ${{ inputs.boot_minutes }} min."
              echo "   Likely TCG slowness (12x slower than KVM per Linaro) or goldfish"
              echo "   device/kernel mismatches. See serial.log for where it stalls."
            elif [ "${{ env.BUILD_SUCCEEDED }}" = "true" ]; then
              echo ""
              echo "❌ **FAIL (boot)** — fork builds but the guest does not boot."
              echo "   See serial.log + qemu_stdout.log for the kernel/init failure."
            else
              echo ""
              echo "❌ **FAIL (build)** — the fork does not build via the vanilla QEMU"
              echo "   path on Ubuntu 24.04 arm64 (gcc 13). See build.log for errors."
              echo "   The Android build path (android/rebuild.sh) is structurally"
              echo "   impossible: AOSP qemu-android-deps prebuilts have no linux-aarch64"
              echo "   variant (verified: only darwin-x86_64/linux-x86/linux-x86_64/"
              echo "   windows-* are published)."
            fi
          } > "$PROOF_DIR/SUMMARY.md"
          cat "$PROOF_DIR/SUMMARY.md"

      # ════════════════════════════════════════════════════════════
      # Step 8 — Cleanup + Upload artifacts
      # ════════════════════════════════════════════════════════════
      - name: Step 8 — Kill lingering qemu + upload artifacts
        if: always()
        run: |
          pkill -9 -f qemu-system-aarch64 2>/dev/null || true
          # Trim huge logs before upload (serial.log can be MBs)
          if [ -f "$PROOF_DIR/boot_logs/serial.log" ]; then
            SIZE=$(stat -c%s "$PROOF_DIR/boot_logs/serial.log")
            if [ "$SIZE" -gt 20000000 ]; then
              tail -c 20000000 "$PROOF_DIR/boot_logs/serial.log" > "$PROOF_DIR/boot_logs/serial.tail.log"
              rm -f "$PROOF_DIR/boot_logs/serial.log"
            fi
          fi
          # Remove image copies from the artifact dir (too big)
          rm -f "$PROOF_DIR/boot_logs/system.img" "$PROOF_DIR/boot_logs/userdata.img" || true
          echo "upload prep done"

      - name: Step 8b — Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-qemu-proof-v2
          path: |
            /tmp/aarch64-qemu-proof
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      # ════════════════════════════════════════════════════════════
      # Step 9 — Final assertion (no false-green)
      # ════════════════════════════════════════════════════════════
      - name: Step 9 — Final assertion
        if: always()
        run: |
          echo "── Final gates ──"
          echo "  BUILD_SUCCEEDED     = ${{ env.BUILD_SUCCEEDED }}"
          echo "  IMAGE_INSTALLED     = ${{ env.IMAGE_INSTALLED }}"
          echo "  BOOT_SUCCEEDED      = ${{ env.BOOT_SUCCEEDED }}"
          echo "  BOOT_COMPLETED_PROP = ${{ env.BOOT_COMPLETED_PROP }}"
          if [ "${{ env.BUILD_SUCCEEDED }}" = "true" ] \
             && [ "${{ env.BOOT_COMPLETED_PROP }}" = "true" ]; then
            echo "✅ PROOF PASSED"
          else
            echo "❌ PROOF FAILED — see SUMMARY.md artifact for the exact blocker"
            exit 1
          fi
