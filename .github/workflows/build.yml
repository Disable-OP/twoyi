# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# NOTE: Placeholder assets are included to allow CI builds.
# For a functional APK, replace app/src/main/assets/rootfs.tar.gz with:
#   https://github.com/cyanmint/twoyi/releases/download/original/rootfs.tar.gz
#
# NOTE: Artifact uploads are logs-only, xz-compressed, 7-day retention.
# No APK artifact bloat — the APK is attached to a GitHub RELEASE instead
# (releases don't count against the Actions artifact storage that this
# repo previously exhausted at 4.61 GB). See scripts/pack-logs.sh.
#
# TRIGGER POLICY: workflow_dispatch ONLY (6-Z185). Every push used to
# kick off a ~15 min APK build; pushes are now gated by
# kr64-tests.yml (fmt/clippy/test, ~2 min) and the E2E workflows, and
# the APK is built exactly when a human asks for one.
#
# RELEASE NOTES: generated by GitHub's automatic release notes
# (`gh release create --generate-notes`). When GitHub Copilot is
# enabled on the repo, the per-PR Copilot summaries are already part of
# those notes (each merged PR's summary flows into the auto-notes);
# there is no separate Actions API to invoke Copilot directly, so no
# extra step pretends to.
---
name: Build APK

'on':
  workflow_dispatch:
    inputs:
      abis:
        description: 'Comma-separated ABIs to build (arm64-v8a, x86_64, or all)'
        required: false
        default: 'all'
      include_rootfs:
        description: 'Download and bundle the real rootfs.tar.gz (otherwise APK has placeholder assets)'
        required: false
        type: boolean
        default: false
      upload_release:
        description: 'Create a GitHub release with the APK attached (auto-generated notes)'
        required: false
        type: boolean
        default: true
      tag:
        description: 'Release tag (default: build-<short-sha>)'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

# `gh release create` needs write access to contents.
permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ github.event.inputs.abis || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        # The toolchain (channel, components, targets) is pinned in
        # `rust-toolchain.toml` at the repo root; this action reads it
        # automatically. The explicit `toolchain`/`target` below is a
        # belt-and-braces fallback for forks that haven't pulled the
        # toolchain file yet.
        #
        # `cache: false` disables the Swatinem/rust-cache integration
        # that setup-rust-toolchain@v1 calls by default. rust-cache
        # runs `cargo metadata` from the repo root, which fails with
        # exit code 101 ("could not find Cargo.toml") because this
        # repo's Cargo workspace lives at app/rs/, not at the root.
        # The failure is non-fatal (the Setup Rust step still
        # succeeds) but prints a noisy stack trace in the log. The
        # explicit Cache cargo registry step below uses actions/cache@v4
        # with a path/key that covers app/rs/target and the cargo
        # registry, so caching still works correctly without rust-cache.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Both Android targets — matches abiFilters in app/build.gradle
          target: aarch64-linux-android,x86_64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          # Only hash the Cargo manifests of crates this workflow actually
          # builds (twoyi + loader). The kr64 crate is covered by its own
          # workflow (kr64-tests.yml) and its own cache, so changes to
          # app/rs/kr64/Cargo.toml must NOT invalidate the APK build cache.
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        # nttld/setup-ndk is the actively-maintained fork of the old
        # android-actions/setup-ndk action; it supports newer NDK releases
        # (r27c+) and exposes the `ndk-path` output used below. As of
        # 2026-08 the latest stable tag is v1.6.0 — there is NO `v2` tag.
        # Pinning to the v1 major line tracks patch releases without
        # breaking on a hypothetical future v2 that changes the input
        # schema.
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Optionally fetch the real rootfs
        if: ${{ github.event.inputs.include_rootfs == 'true' }}
        run: |
          mkdir -p app/src/main/assets
          # The rootfs is hosted in the cyanmint/twoyi 'original' release as
          # rootfs.tar.gz (~275 MB). The app's import flow accepts .tar files.
          curl -L -o app/src/main/assets/rootfs.tar.gz \
            https://github.com/cyanmint/twoyi/releases/download/original/rootfs.tar.gz
          ls -lh app/src/main/assets/rootfs.tar.gz

      - name: Determine ABIs to build
        id: abis
        run: |
          # workflow_dispatch lets the user override; otherwise default to 'all'
          ABIS="${{ github.event.inputs.abis }}"
          if [ -z "$ABIS" ]; then ABIS="all"; fi
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "Building ABIs: $ABIS"

      - name: Run Android Lint
        # Run lint BEFORE assembleRelease so lint errors fail the build before
        # we spend ~10 min packaging the APK. AGP's default `lint` task
        # analyzes every variant; default lintOptions (abortOnError=true)
        # turns error-severity issues into a non-zero exit code. Warnings do
        # not fail the build. All previously-known 62 lint warnings were
        # resolved across rounds 23-52; the gate now treats any warning as
        # build-breaking. MissingTranslation errors are also fatal —
        # scripts/find_missing_translations.py can be run locally to catch
        # those before pushing.
        # The task transitively depends on javaPreCompileRelease, which in
        # turn triggers the cargoBuild/cmakeBuild/loaderBuild tasks wired in
        # app/build.gradle — so this also serves as a native-compile smoke
        # test for the chosen ABIs before assembleRelease runs.
        run: ./gradlew lint -Pabis=${{ steps.abis.outputs.abis }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build with Gradle
        run: ./gradlew assembleRelease -Pabis=${{ steps.abis.outputs.abis }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # ───────────────────────────────────────────────────────────────
      # Release upload (6-Z185): attach the APK to a GitHub release.
      # Releases bypass the Actions artifact quota this repo exhausted.
      # `--generate-notes` produces GitHub's automatic release notes,
      # which include the Copilot PR summaries when Copilot is enabled
      # on the repository.
      # ───────────────────────────────────────────────────────────────
      - name: Create release with APK
        if: success() && github.event.inputs.upload_release != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease == 'true' }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="build-${SHA::7}"; fi
          APK_NAME="twoyi-${TAG}-$(date -u +%Y%m%d).apk"
          mkdir -p /tmp/release
          cp app/build/outputs/apk/release/*.apk "/tmp/release/${APK_NAME}"
          ls -lh /tmp/release/
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-dispatch of the same tag: replace the APK on the
            # existing release (upload --clobber IS supported).
            gh release upload "$TAG" "/tmp/release/${APK_NAME}" --clobber
          else
            gh release create "$TAG" "/tmp/release/${APK_NAME}" \
              --title "Twoyi ${TAG}" \
              --target "$SHA" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
          echo "Release created:"
          gh release view "$TAG" --json url -q .url || true

      # ───────────────────────────────────────────────────────────────
      # Log-only artifact upload (xz-compressed), on failure only.
      # ───────────────────────────────────────────────────────────────
      - name: Pack build logs
        if: failure()
        run: |
          ./scripts/pack-logs.sh /tmp/build-logs.tar.xz \
            app/build/reports/ \
            app/rs/target/*/release/build.log \
            /tmp/cargo-xdk*.log

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      # APK artifact as a fallback when upload_release is unchecked —
      # short retention so it cannot recreate the storage problem.
      - name: Upload APK artifact (fallback)
        if: success() && github.event.inputs.upload_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-apk-${{ github.event.inputs.abis || 'all' }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
