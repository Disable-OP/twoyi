# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# NOTE: Placeholder assets are included to allow CI builds.
# For a functional APK, replace app/src/main/assets/rootfs.7z with:
#   https://github.com/cyanmint/twoyi/releases/download/original/rootfs.7z
---
name: Build APK

'on':
  push:
    branches: [main, develop, 'improvements/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      abis:
        description: 'Comma-separated ABIs to build (arm64-v8a, x86_64, or all)'
        required: false
        default: 'all'
      include_rootfs:
        description: 'Download and bundle the real rootfs.7z (otherwise APK has placeholder assets)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build APK (${{ github.event.inputs.abis || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Both Android targets — matches abiFilters in app/build.gradle
          target: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
            app/rs/openglrenderer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/rs/**/Cargo.lock', 'app/rs/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true
          chmod +x app/rs/openglrenderer/build.sh || true

      - name: Optionally fetch the real rootfs.7z
        if: ${{ github.event.inputs.include_rootfs == 'true' }}
        run: |
          mkdir -p app/src/main/assets
          # The rootfs is hosted in the original cyanmint release. Fetching it
          # makes the APK immediately functional (~50 MB) instead of a stub.
          curl -L -o app/src/main/assets/rootfs.7z \
            https://github.com/cyanmint/twoyi/releases/download/original/rootfs.7z
          ls -lh app/src/main/assets/rootfs.7z

      - name: Determine ABIs to build
        id: abis
        run: |
          # workflow_dispatch lets the user override; otherwise default to 'all'
          ABIS="${{ github.event.inputs.abis }}"
          if [ -z "$ABIS" ]; then ABIS="all"; fi
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "Building ABIs: $ABIS"

      - name: Build with Gradle
        run: ./gradlew assembleRelease -Pabis=${{ steps.abis.outputs.abis }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload arm64-v8a APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-apk-arm64-v8a
          # assembleRelease produces a single fat APK containing both ABIs,
          # but if you want per-ABI splits you can enable splits in build.gradle.
          # For now we upload the fat APK.
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/rs/target/*/release/build.log
            /tmp/cargo-xdk*.log
          retention-days: 7
          if-no-files-found: ignore
