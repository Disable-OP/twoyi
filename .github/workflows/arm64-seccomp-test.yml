# AArch64 seccomp/SIGSYS validation via native ARM64 GitHub runner
#
# Uses the FREE ubuntu-24.04-arm GitHub-hosted runner (native ARM64).
# No QEMU needed — the test binary runs natively on real ARM64 hardware.
#
# This validates:
#   - seccomp BPF filter installs on AArch64 (real hardware, not emulation)
#   - SIGSYS handler receives si_syscall correctly
#   - ucontext->regs[0] (x0) sets the return value
#   - Non-trapped syscalls pass through
#
# Sources:
#   - GitHub blog: https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories-public-preview
#   - Runner labels: ubuntu-24.04-arm, ubuntu-22.04-arm

name: AArch64 Seccomp Validation (Native ARM64)

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/cpp/twoyi_loader/**'
      - '.github/workflows/arm64-seccomp-test.yml'

concurrency:
  group: arm64-seccomp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Native ARM64 seccomp test (no QEMU, no emulator)
  arm64-native-seccomp:
    name: Native ARM64 seccomp/SIGSYS test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ARM64 architecture
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== /dev/kvm check ==="
          ls -la /dev/kvm 2>/dev/null || echo "No /dev/kvm (expected on GH arm64 runners)"
          echo "=== CPU info ==="
          cat /proc/cpuinfo | head -20

      - name: Build test binary natively
        run: |
          set -e
          cd app/cpp/twoyi_loader

          # Create the minimal self-contained test
          cat > /tmp/test_arm64_native.c << 'TESTEOF'
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <errno.h>
          #include <signal.h>
          #include <linux/seccomp.h>
          #include <linux/filter.h>
          #include <sys/prctl.h>
          #include <stdint.h>
          #include <ucontext.h>
          #include <fcntl.h>

          static void write_str(int fd, const char *s) {
              int len = 0; while (s[len]) len++;
              syscall(SYS_write, fd, s, len);
          }
          static void write_hex(int fd, unsigned long val) {
              char buf[20]; char *p = buf;
              *p++ = '0'; *p++ = 'x';
              for (int i = 60; i >= 0; i -= 4)
                  *p++ = "0123456789abcdef"[(val >> i) & 0xf];
              *p++ = '\n';
              syscall(SYS_write, fd, buf, p - buf);
          }

          #define ARM64_NR_mount 40
          #define ARM64_NR_getpid 172
          #define ARM64_NR_chroot 51
          #define ARM64_NR_sched_yield 124

          static volatile int sigsys_fired = 0;
          static volatile long sigsys_nr = -1;

          static void sigsys_handler(int sig, siginfo_t *info, void *ctx) {
              (void)sig;
              ucontext_t *uc = (ucontext_t *)ctx;
              if (info->si_code != 1) return;
              sigsys_fired++;
              sigsys_nr = info->si_syscall;
              if (info->si_syscall == ARM64_NR_mount || info->si_syscall == ARM64_NR_chroot) {
                  uc->uc_mcontext.regs[0] = 0;
              } else {
                  uc->uc_mcontext.regs[0] = -ENOSYS;
              }
          }

          void _start(void) {
              write_str(1, "=== AArch64 Native Seccomp Test ===\n");

              struct sigaction sa = {0};
              sa.sa_sigaction = sigsys_handler;
              sa.sa_flags = SA_SIGINFO | SA_NODEFER;
              sigemptyset(&sa.sa_mask);
              if (sigaction(SIGSYS, &sa, NULL) != 0) {
                  write_str(1, "FAIL: sigaction failed\n");
                  syscall(SYS_exit, 1);
              }
              write_str(1, "OK: SIGSYS handler installed\n");

              sigset_t mask;
              sigemptyset(&mask);
              sigaddset(&mask, SIGSYS);
              sigprocmask(SIG_UNBLOCK, &mask, NULL);

              if (prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0) {
                  write_str(1, "FAIL: prctl failed\n");
                  syscall(SYS_exit, 1);
              }
              write_str(1, "OK: PR_SET_NO_NEW_PRIVS\n");

              struct sock_filter filter[] = {
                  {0x20, 0, 0, 4},            // LD arch
                  {0x15, 1, 0, 0xC00000B7},   // JEQ AARCH64
                  {0x06, 0, 0, 0x80000000},   // RET KILL_PROCESS
                  {0x20, 0, 0, 0},            // LD nr
                  {0x15, 3, 0, 40},           // JEQ mount(40)
                  {0x15, 2, 0, 51},           // JEQ chroot(51)
                  {0x06, 0, 0, 0x7fff0000},   // RET ALLOW
                  {0x06, 0, 0, 0x00030000},   // RET TRAP (mount)
                  {0x06, 0, 0, 0x00030000},   // RET TRAP (chroot)
              };
              struct sock_fprog prog = {
                  .len = sizeof(filter)/sizeof(filter[0]),
                  .filter = filter,
              };

              long sec_ret = syscall(SYS_seccomp, SECCOMP_SET_MODE_FILTER, 0, &prog);
              if (sec_ret != 0) {
                  write_str(1, "FAIL: seccomp install failed\n");
                  syscall(SYS_exit, 1);
              }
              write_str(1, "OK: seccomp filter installed\n");

              write_str(1, "Calling mount()...\n");
              long mount_ret = syscall(ARM64_NR_mount, "tmpfs", "/test", "tmpfs", 0, NULL);
              write_str(1, "mount returned: ");
              write_hex(1, (unsigned long)mount_ret);
              write_str(1, "sigsys_fired: ");
              write_hex(1, (unsigned long)sigsys_fired);
              write_str(1, "sigsys_nr: ");
              write_hex(1, (unsigned long)sigsys_nr);

              if (mount_ret == 0 && sigsys_fired > 0) {
                  write_str(1, "PASS: mount trapped and emulated\n");
              } else {
                  write_str(1, "FAIL: mount not trapped\n");
              }

              long pid = syscall(ARM64_NR_getpid);
              write_str(1, "getpid returned: ");
              write_hex(1, (unsigned long)pid);
              if (pid > 0) {
                  write_str(1, "PASS: getpid not trapped\n");
              } else {
                  write_str(1, "FAIL: getpid failed\n");
              }

              write_str(1, "=== DONE ===\n");
              syscall(SYS_exit, 0);
          }
          TESTEOF

          # Stub symbols for static linking
          cat > /tmp/arm64_stub.c << 'STUBEOF'
          __attribute__((weak)) const char _DYNAMIC[] = {0};
          __attribute__((weak)) void _dl_relocate_static_pie(void) {}
          __attribute__((weak)) void _init(void) {}
          __attribute__((weak)) void _fini(void) {}
          STUBEOF

          gcc -fno-stack-protector -O0 -g -nostartfiles -static \
            -Wl,--no-dynamic-linker -Wl,-e,_start \
            -o /tmp/test_arm64_native /tmp/test_arm64_native.c /tmp/arm64_stub.c \
            -lc -lgcc -lgcc_eh 2>&1

          file /tmp/test_arm64_native

      - name: Run test natively on ARM64
        run: |
          set -e
          echo "=== Running test ==="
          /tmp/test_arm64_native
          echo "=== Exit code: $? ==="

      - name: Verify results
        run: |
          OUTPUT=$(/tmp/test_arm64_native 2>&1)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "PASS: mount trapped and emulated" && \
             echo "$OUTPUT" | grep -q "PASS: getpid not trapped"; then
            echo "✓ ALL AArch64 NATIVE TESTS PASSED"
            exit 0
          else
            echo "✗ AArch64 NATIVE TESTS FAILED"
            exit 1
          fi

  # Job 2: Android ARM64 emulator test (TCG, may be slow)
  arm64-android-emulator:
    name: Android ARM64 emulator test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ARM64 architecture and TRY KVM
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== /dev/kvm check ==="
          ls -la /dev/kvm 2>/dev/null && echo "KVM EXISTS!" || echo "No /dev/kvm yet"
          echo "=== Try modprobe kvm ==="
          sudo modprobe kvm 2>/dev/null || echo "modprobe kvm failed"
          sudo modprobe kvm_arm64 2>/dev/null || echo "modprobe kvm_arm64 failed"
          ls -la /dev/kvm 2>/dev/null && echo "KVM NOW EXISTS!" || echo "Still no /dev/kvm"
          # Check if we can access kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            echo "KVM IS AVAILABLE — will use -accel kvm"
            echo "KVM_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "KVM NOT available — will use TCG (slow)"
            echo "KVM_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install cmdline-tools (sdkmanager not pre-installed on arm64)
        run: |
          set -e
          # Use home directory since /usr/local/lib/android may not be writable
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          # Download cmdline-tools
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            echo "Installing cmdline-tools..."
            cd /tmp
            CMDLINE_TOOLS_URL='https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            curl -sL -o cmdline-tools.zip "$CMDLINE_TOOLS_URL"
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm cmdline-tools.zip
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          echo "=== sdkmanager version ==="
          sdkmanager --version

          echo "=== Installing SDK components ==="
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --update

          # Install the arm64 system image and SDK components
          # The 'emulator' package is NOT available for arm64 Linux hosts via sdkmanager.
          # We download it manually from the Android repository.
          sdkmanager \
              "platform-tools" \
              "platforms;android-30" \
              "build-tools;30.0.3" \
              "system-images;android-30;default;arm64-v8a" || true

          # Download emulator package manually
          # The emulator zip from the Android repository works on arm64 hosts
          # (it's a 64-bit Linux binary + Qt + Python wrapper)
          echo "=== Downloading emulator package manually ==="
          # Try multiple URLs — the repository structure changes over time
          EMULATOR_URLS=(
            "https://dl.google.com/android/repository/emulator-linux-13477706.zip"
            "https://dl.google.com/android/repository/emulator-linux-13114558.zip"
            "https://dl.google.com/android/repository/emulator-linux-11591348.zip"
          )
          for URL in "${EMULATOR_URLS[@]}"; do
            echo "Trying: $URL"
            if curl -sL --fail -o /tmp/emulator.zip "$URL"; then
              echo "Downloaded from: $URL"
              break
            fi
          done

          if [ -f /tmp/emulator.zip ] && unzip -t /tmp/emulator.zip >/dev/null 2>&1; then
            unzip -q -o /tmp/emulator.zip -d "$ANDROID_HOME/"
            rm /tmp/emulator.zip
            chmod +x "$ANDROID_HOME/emulator/emulator" 2>/dev/null || true
            echo "=== Emulator installed ==="
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -3 || true
          else
            echo "⚠ Could not download emulator package — skipping Android emulator test"
            echo "SKIP_EMULATOR=true" >> $GITHUB_ENV
          fi

          echo "=== Verify system image installed ==="
          ls -la "$ANDROID_HOME/system-images/android-30/default/arm64-v8a/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Create arm64 AVD
        if: env.SKIP_EMULATOR != 'true'
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p $ANDROID_AVD_HOME

          echo "no" | avdmanager create avd \
              -n twoyi_arm64 \
              -k "system-images;android-30;default;arm64-v8a" \
              --force

          # Configure AVD for headless + software rendering
          AVD_CONFIG=/home/runner/.android/avd/twoyi_arm64.avd/config.ini
          {
              echo "hw.keyboard=yes"
              echo "hw.gpu.enabled=yes"
              echo "hw.gpu.mode=swiftshader_indirect"
              echo "hw.ramSize=2048"
              echo "disk.dataPartition.size=4096"
              echo "vm.heapSize=256"
          } >> "$AVD_CONFIG"

          echo "=== AVD config ==="
          cat "$AVD_CONFIG"

      - name: Boot Android arm64 emulator (KVM if available, else TCG)
        if: env.SKIP_EMULATOR != 'true'
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          # Choose acceleration based on KVM availability
          if [ "$KVM_AVAILABLE" = "true" ]; then
            ACCEL="-accel kvm"
            echo "=== Using KVM acceleration ==="
          else
            ACCEL="-accel tcg"
            echo "=== Using TCG software emulation (slow) ==="
          fi

          # Start emulator in background
          nohup emulator -avd twoyi_arm64 \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -gpu swiftshader_indirect \
              -no-snapshot \
              -netfast \
              $ACCEL \
              > /tmp/emulator.log 2>&1 &

          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"

          # Wait for boot (up to 15 minutes)
          echo "Waiting for boot (up to 15 minutes)..."
          adb wait-for-device
          echo "Device detected, waiting for boot_completed..."
          timeout 900 bash -c 'while [[ -z $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") ]]; do sleep 5; echo "  still booting..."; done' || true

          BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")
          echo "Boot status: '$BOOT_STATUS'"

          if [ "$BOOT_STATUS" != "1" ]; then
              echo "⚠ Emulator did not fully boot within 20 minutes"
              echo "=== Emulator log (last 50 lines) ==="
              tail -50 /tmp/emulator.log
              exit 1
          fi

          echo "✓ Android arm64 emulator booted!"

      - name: Build and push test binary to Android
        if: env.SKIP_EMULATOR != 'true'
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          cd app/cpp/twoyi_loader

          # Build a test binary that runs as shell user (not untrusted_app)
          # NOTE: This does NOT test the zygote seccomp filter.
          # It tests whether our seccomp code works on real Android arm64.
          cat > /tmp/test_android_arm64.c << 'TESTEOF'
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <errno.h>
          #include <signal.h>
          #include <linux/seccomp.h>
          #include <linux/filter.h>
          #include <sys/prctl.h>
          #include <ucontext.h>

          static volatile int sigsys_fired = 0;

          static void sigsys_handler(int sig, siginfo_t *info, void *ctx) {
              (void)sig;
              ucontext_t *uc = (ucontext_t *)ctx;
              if (info->si_code != 1) return;
              sigsys_fired++;
              // Return 0 for any trapped syscall
              uc->uc_mcontext.regs[0] = 0;
          }

          int main(void) {
              printf("=== Android ARM64 Seccomp Test ===\n");
              printf("PID: %d\n", getpid());

              // Install SIGSYS handler
              struct sigaction sa = {0};
              sa.sa_sigaction = sigsys_handler;
              sa.sa_flags = SA_SIGINFO | SA_NODEFER;
              sigemptyset(&sa.sa_mask);
              if (sigaction(SIGSYS, &sa, NULL) != 0) {
                  printf("FAIL: sigaction: %s\n", strerror(errno));
                  return 1;
              }
              printf("OK: SIGSYS handler installed\n");

              // Unblock SIGSYS
              sigset_t mask;
              sigemptyset(&mask);
              sigaddset(&mask, SIGSYS);
              sigprocmask(SIG_UNBLOCK, &mask, NULL);

              // Set NO_NEW_PRIVS
              if (prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0) {
                  printf("FAIL: prctl: %s\n", strerror(errno));
                  return 1;
              }
              printf("OK: PR_SET_NO_NEW_PRIVS\n");

              // Install seccomp filter that traps mount(40)
              struct sock_filter filter[] = {
                  {0x20, 0, 0, 4},
                  {0x15, 1, 0, 0xC00000B7},
                  {0x06, 0, 0, 0x80000000},
                  {0x20, 0, 0, 0},
                  {0x15, 1, 0, 40},
                  {0x06, 0, 0, 0x00030000},
                  {0x06, 0, 0, 0x7fff0000},
                  {0x06, 0, 0, 0x00030000},
              };
              struct sock_fprog prog = {
                  .len = sizeof(filter)/sizeof(filter[0]),
                  .filter = filter,
              };

              long ret = syscall(SYS_seccomp, SECCOMP_SET_MODE_FILTER, 0, &prog);
              if (ret != 0) {
                  printf("FAIL: seccomp: %s\n", strerror(errno));
                  return 1;
              }
              printf("OK: seccomp filter installed\n");

              // Call mount() — should be trapped
              long mount_ret = syscall(40, "tmpfs", "/test", "tmpfs", 0, NULL);
              printf("mount returned: %ld\n", mount_ret);
              printf("sigsys_fired: %d\n", sigsys_fired);

              if (mount_ret == 0 && sigsys_fired > 0) {
                  printf("PASS: mount trapped and emulated on Android ARM64\n");
              } else {
                  printf("FAIL: mount not trapped\n");
              }

              // Call getpid() — should NOT be trapped
              long pid = syscall(172);
              printf("getpid returned: %ld\n", pid);
              if (pid > 0) {
                  printf("PASS: getpid not trapped\n");
              }

              printf("=== DONE ===\n");
              return 0;
          }
          TESTEOF

          # Build with Android NDK (if available) or system gcc
          if command -v aarch64-linux-android-gcc >/dev/null 2>&1; then
              aarch64-linux-android-gcc -static -o /tmp/test_android_arm64 /tmp/test_android_arm64.c
          else
              # Use the system gcc on the arm64 runner (native compile)
              gcc -static -o /tmp/test_android_arm64 /tmp/test_android_arm64.c
          fi

          file /tmp/test_android_arm64

          # Push to device and run
          adb push /tmp/test_android_arm64 /data/local/tmp/
          adb shell chmod +x /data/local/tmp/test_android_arm64
          echo "=== Running test on Android arm64 ==="
          adb shell /data/local/tmp/test_android_arm64

      - name: Upload emulator logs to 0x0.st
        # Replaces actions/upload-artifact — see build.yml for the rationale
        # (GHA storage was at 0.01 GB of the 0.5 GB free tier). URLs are
        # printed in the run log and added to the step summary.
        if: always()
        run: |
          ./scripts/upload-to-0x0.sh "arm64-android-emulator-logs" \
            /tmp/emulator.log

      - name: Render all 0x0.st links as a summary table
        if: always()
        run: |
          if [ -f /tmp/0x0-uploads.txt ] && [ -s /tmp/0x0-uploads.txt ]; then
            {
              echo "## 📦 Artifact downloads (0x0.st)"
              echo ""
              echo "| Label | File | URL |"
              echo "|---|---|---|"
              while IFS=$'\t' read -r label name url; do
                echo "| ${label} | \`${name}\` | ${url} |"
              done < /tmp/0x0-uploads.txt
              echo ""
              echo "_Links expire after 30–365 days depending on size. Re-run the workflow to refresh._"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no artifacts uploaded this run)" >> "$GITHUB_STEP_SUMMARY"
          fi
