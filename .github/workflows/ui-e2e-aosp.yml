#
# UI-only end-to-end test for twoyi's NORMAL (AOSP) boot path.
#
# This is the sibling of ui-e2e-test.yml (which boots TWRP). Here the
# guest is a full Android 8.1 x86 system (the original twoyi use case):
# zygote, system_server, SurfaceFlinger — rendering through the emugl
# OpenGL renderer, boot completion reported by the GUEST.
#
# Key differences from the TWRP E2E:
#   - Installs the DEBUGGABLE variant (io.twoyi.debug) — run-as works,
#     which we need to (a) preload the guest rootfs and (b) pull the
#     app's FileLogger logs (the TWRP E2E's app-logs were always empty
#     because the release build rejects run-as).
#   - The guest rootfs is TARRTED OUT OF THE RUNNING EMULATOR
#     (API-30 google_apis x86_64 — NATIVE arch, no translation; the
#     KVM E2E's proven 'emulator' source: system/ vendor/ init
#     default.prop apex/ — apex is REQUIRED, linker64 is a symlink
#     into it) → preloaded into profiles/default/rootfs via run-as.
#     The app's first launch auto-creates the rootfs symlink
#     (ProfileManager.initializeProfiles → updateRootfsSymlink) and
#     romExist() sees rootfs/init.
#   - The container boots in NORMAL mode (Boot to Recovery stays OFF).
#
# Like the TWRP E2E this is the unrooted-user simulation: no adb root,
# no manual /data/data copying outside run-as (which any debuggable
# build allows), no pre-launched processes.
---
name: UI E2E Test (AOSP)

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for the guest Android to boot (seconds)'
        required: false
        default: '600'

concurrency:
  group: ui-e2e-aosp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e-aosp:
    name: UI-only AOSP E2E on x86_64 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          set -u
          echo "── KVM availability ──"
          if [ -e /dev/kvm ]; then
              echo "  /dev/kvm exists"
          else
              echo "  /dev/kvm does NOT exist — trying modprobe + mknod"
              sudo modprobe kvm 2>/dev/null || true
              sudo modprobe kvm_intel 2>/dev/null || true
              sudo modprobe kvm_amd 2>/dev/null || true
              sudo mknod /dev/kvm c 10 232 2>/dev/null || true
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: ${{ runner.os }}-sdk-android30-google_apis-x86_64-v2

      - name: Install Android SDK + emulator + system image
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd /tmp
              CMDLINE_TOOLS_URL='https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
              curl -sL -o cmdline-tools.zip "$CMDLINE_TOOLS_URL"
              unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --update
          sdkmanager \
              "platform-tools" \
              "platforms;android-30" \
              "build-tools;30.0.3" \
              "emulator" \
              "system-images;android-30;google_apis;x86_64"
          echo "✓ SDK + emulator + system image installed"

      - name: Create x86_64 AVD
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          set -ex
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME=/home/runner/.android/avd
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMGR="$(command -v avdmanager 2>/dev/null || true)"
          if [ -z "$AVDMGR" ] || [ ! -x "$AVDMGR" ]; then
            for d in "$ANDROID_HOME"/cmdline-tools/*/; do
              if [ -x "${d}bin/avdmanager" ]; then
                AVDMGR="${d}bin/avdmanager"
                break
              fi
            done
          fi
          echo "" | "$AVDMGR" create avd \
              -n twoyi_test \
              -k "system-images;android-30;google_apis;x86_64" \
              --force
          AVD_CONFIG="$ANDROID_AVD_HOME/twoyi_test.avd/config.ini"
          {
              echo "hw.keyboard=yes"
              echo "hw.gpu.enabled=yes"
              echo "hw.gpu.mode=swiftshader_indirect"
              echo "hw.ramSize=3072"
              echo "disk.dataPartition.size=8192"
              echo "vm.heapSize=256"
          } >> "$AVD_CONFIG"
          echo "✓ AVD created"

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (debuggable variant, x86_64 only)
        run: ./gradlew assembleDebuggable -Pabis=x86_64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Boot emulator (headless, KVM)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p /tmp/ui-e2e-artifacts
          "$ANDROID_HOME/emulator/emulator" -avd twoyi_test \
              -no-window -no-audio -no-snapshot -no-boot-anim \
              -gpu swiftshader_indirect \
              -partition-size 4096 \
              -ports 5554,5555 \
              -qemu -enable-kvm \
              > /tmp/ui-e2e-artifacts/emulator-stdout.log \
              2> /tmp/ui-e2e-artifacts/emulator-stderr.log &
          EMULATOR_PID=$!
          echo $EMULATOR_PID > /tmp/emulator.pid
          echo "  emulator PID: $EMULATOR_PID"

          BOOT_TIMEOUT=300
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
                  echo "  ✗ emulator died"
                  tail -30 /tmp/ui-e2e-artifacts/emulator-stderr.log >&2 || true
                  exit 1
              fi
              BOOTED=$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                  echo "  ✓ boot_completed after ${WAITED}s"
                  break
              fi
              sleep 2
              WAITED=$((WAITED + 2))
              printf '.'
          done
          if [ "$WAITED" -ge "$BOOT_TIMEOUT" ]; then
              echo "  ✗ emulator did not boot in ${BOOT_TIMEOUT}s"
              exit 1
          fi

      - name: Install APK + preload AOSP rootfs from the AVD system image
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -x
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ADB="adb -s emulator-5554"

          # Install the DEBUGGABLE variant (package io.twoyi.debug) —
          # run-as works, enabling rootfs preload + log pulling.
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "── Installing APK: $APK ──"
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"

          # ── Extract the x86_64 rootfs FROM THE RUNNING EMULATOR ───────
          # NATIVE ARCHITECTURE: the API-30 google_apis x86_64 guest IS
          # the same arch as the emulator — no translation. This is the
          # KVM E2E's proven 'emulator' rootfs source
          # (X86_64_BREAKTHROUGH.md): tar system/ vendor/ init* default.prop
          # apex/ straight out of the booted emulator. All those paths are
          # world-readable — plain `adb shell` works, NO adb root needed
          # (staying the unrooted-user simulation).
          # NOTE: apex/ is REQUIRED — API-30's linker64/libc.so are
          # symlinks into /apex/com.android.runtime/; without it the
          # linker SIGSEGVs (0x86 NULL deref).
          # exec-out is binary-safe; gzip on the runner (-1: speed).
          adb -s emulator-5554 wait-for-device
          echo "── Tarring the rootfs out of the booted emulator (system+vendor+init+apex) ──"
          adb -s emulator-5554 exec-out \
              "cd / && tar cf - system/ vendor/ init default.prop apex/ 2>/dev/null" \
              | gzip -1 > /tmp/profile_rootfs.tar.gz
          ls -la /tmp/profile_rootfs.tar.gz
          [ -s /tmp/profile_rootfs.tar.gz ] || { echo "✗ rootfs tar is empty"; exit 1; }
          gzip -t /tmp/profile_rootfs.tar.gz || { echo "✗ corrupt gzip"; exit 1; }
          $ADB push /tmp/profile_rootfs.tar.gz /sdcard/Download/ 2>&1 | tail -1

          # ── Preload into the app's private profile dir via run-as ────
          # The app must have RUN ONCE for its data dir to exist with the
          # right SELinux context. Launch + stop it once.
          $ADB shell monkey -p io.twoyi.debug -c android.intent.category.LAUNCHER 1
          sleep 8
          $ADB shell am force-stop io.twoyi.debug
          sleep 2

          $ADB shell "run-as io.twoyi.debug mkdir -p profiles/default/rootfs"
          # Scoped storage: the app uid cannot READ /sdcard/Download
          # (owned by shell). Pipe through the SHELL uid — cat runs as
          # shell (allowed), run-as tar reads STDIN.
          $ADB shell "cat /sdcard/Download/profile_rootfs.tar.gz | run-as io.twoyi.debug tar -xz -C profiles/default/rootfs"
          $ADB shell "rm /sdcard/Download/profile_rootfs.tar.gz"

          # Honest verification: the guest init must exist.
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/ | head -20"
          if ! $ADB shell "run-as io.twoyi.debug test -f profiles/default/rootfs/init"; then
              echo "✗ guest init NOT found after extraction"; exit 1
          fi
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/bin/linker64" || \
              echo "  (no linker64 — checking x86 linker)"
          echo "  ✓ AOSP x86_64 rootfs preloaded from the AVD system image"

      - name: UI navigation — boot AOSP container
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '600' }}
          AOSP_PACKAGE: io.twoyi.debug
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          python3 scripts/ui-navigate-aosp.py

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ \
            || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-aosp-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Kill emulator
        if: always()
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb -s emulator-5554 emu kill 2>/dev/null || true
          kill $(cat /tmp/emulator.pid 2>/dev/null) 2>/dev/null || true
