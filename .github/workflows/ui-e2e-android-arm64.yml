          sleep 5
          timeout 45 sudo docker exec redroid /system/bin/sh -c \
            "/system/bin/screencap -p /data/local/tmp/final-2.png 2>/dev/null && cat /data/local/tmp/final-2.png" \
            > /tmp/ui-e2e-artifacts/screencap-dockerexec-5s-later.png 2>&1 || true
          timeout 20 sudo docker inspect redroid --format \
            'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' \
            > /tmp/ui-e2e-artifacts/container-state.txt 2>&1 || true
          exit $RC

      - name: Classify boot ladder (machine-readable)
        if: always()
        run: |
          python3 scripts/android-boot-classify.py \
            /tmp/ui-e2e-artifacts \
            /tmp/ui-e2e-artifacts/result.json \
            > /tmp/ui-e2e-artifacts/result-pretty.json 2>&1 || true
          echo "════════ ANDROID BOOT LADDER VERDICT ════════"
          cat /tmp/ui-e2e-artifacts/result.json || true
          # The boot-ladder gate: only fail the job when a minimum rung was
          # requested (expect_rung > 0) AND the harness produced a verdict.
          EXPECT=${{ github.event.inputs.expect_rung || '0' }}
          if [ "$EXPECT" != "0" ] && [ -f /tmp/ui-e2e-artifacts/result.json ]; then
            RUNG=$(python3 -c "import json; print(json.load(open('/tmp/ui-e2e-artifacts/result.json'))['rung'])")
            if [ "$RUNG" -lt "$EXPECT" ]; then
              echo "✗ ladder rung $RUNG < expected $EXPECT"
              exit 1
            fi
            echo "✓ ladder rung $RUNG ≥ expected $EXPECT"
          fi

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot-ladder-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Stop redroid
        if: always()
        run: |
          sudo docker stop redroid 2>/dev/null || true
          sudo docker rm   redroid 2>/dev/null || true
