# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# FULL-ANDROID boot-ladder E2E (arm64, redroid) — Mission 6-Z305.
#
# The primary objective is BOOTING A REAL ARM64 ANDROID SYSTEM inside
# twoyi — pure unmodified stock Android 11 (user directive: the old
# twoyi Android 8.1 rootfs is a heavily modified from-source build that
# "bypasses everything to just boot"; it is retired from boot testing).
#
# The ROM under test is the vendored PURE STOCK Android 11 rootfs
# (release tag android11-aosp-arm64-rsr1): assembled byte-verbatim from
# Google's OFFICIAL AOSP SDK system image arm64-v8a-30_r02.zip by
# scripts/assemble-android11-rootfs.py — zero ROM modifications, only
# mount topology. Provenance: ROOTFS_MANIFEST.json in the same release.
#
# Boot path exercised (boot_recovery=false — GL renderer):
#   import (.tar.gz via the 6-Z305 intent-filter + tar symlink arm)
#     → isFullAndroidLayout() structural detection (6-Z305)
#     → kr64 normal path exec /init (6-Z88)
#     → real init → property service → daemons → zygote → system_server
#     → SurfaceFlinger → SystemUI → Launcher → sys.boot_completed=1
#     → the 6-Z305 honest BOOT_COMPLETED bridge → app boot gate.
#
# HONEST LADDER SEMANTICS: the first rung "init started" is NOT "Android
# booted". This workflow is a DIAGNOSTIC INSTRUMENT: it classifies the
# HIGHEST boot-ladder rung reached (scripts/android-boot-classify.py)
# and uploads the full evidence bundle. A run "succeeds" only when the
# harness itself worked; the boot verdict is the reported rung —
# BOOT_COMPLETED fires ONLY on a REAL sys.boot_completed=1 property
# write observed on the emulated property wire (never synthesized).
#
# FAST-FAIL (6-Z305n, user directive: full test cycle ≤ ~10 min):
# the boot watch is STALL-ADAPTIVE — ui-navigate.py samples the guest
# (kr64 klog size + guest-process count, docker-exec side) every 10s
# and ends the watch as soon as BOTH freeze for stall_seconds (default
# 90s, 60s startup grace). A stalled guest therefore fails in minutes
# with a full decode payload instead of burning the whole watch. The
# defaults below cap the ladder job at 15 min hard; a genuinely
# progressing boot is never cut early (any klog growth resets the
# stall budget) and every knob stays overridable via workflow inputs.
---
name: Android Boot Ladder (ARM64 via redroid on ubuntu-24.04-arm)

'on':
  workflow_dispatch:
    inputs:
      confirm_dispatch:
        description: 'Anti-runaway gate: dispatches MUST pass the literal string "yes" (no default)'
        required: true
      boot_wait_seconds:
        description: 'HARD CAP (wall-clock) on the boot watch (seconds). Stall-adaptive: exits early once the guest freezes for stall_seconds — default 180 keeps the whole cycle ≈10 min'
        required: false
        default: '180'
      stall_seconds:
        description: 'FAST-FAIL: end the boot watch after this many seconds with NO guest progress (klog+procs frozen; 60s grace). Default 90; 0 disables fast-fail'
        required: false
        default: '90'
      import_wait_seconds:
        description: 'Budget for the rootfs import (494MB tar.gz → ~1.7GB tree). Default 300s (import self-terminates early when the progress dialog clears)'
        required: false
        default: '300'
      redroid_tag:
        description: 'redroid Docker image tag (arm64) — the HOST android inside which twoyi runs'
        required: false
        default: '14.0.0-latest'
      redroid_resolution:
        description: 'Native resolution for the redroid display as WxH'
        required: false
        default: '720x1600'
      redroid_dpi:
        description: 'Native density for the redroid display'
        required: false
        default: '320'
      rootfs_release_tag:
        description: 'Release tag holding the vendored pure-stock Android 11 rootfs'
        required: false
        default: 'android11-aosp-arm64-rsr2'
      rootfs_asset_name:
        description: 'Asset name of the vendored rootfs tar.gz'
        required: false
        default: 'twoyi-android11-aosp-arm64-rsr2.tar.gz'
      expect_rung:
        description: 'Minimum ladder rung the run must reach for the job to exit 0 (0 = never fail on the ladder; diagnostic mode). Rungs: 1 ROOTFS_READY, 2 INIT, 3 PROPS, 4 DAEMONS, 5 ZYGOTE, 6 SYSTEM_SERVER, 7 SURFACEFLINGER, 8 SYSTEMUI, 9 BOOT_COMPLETED'
        required: false
        default: '0'

concurrency:
  group: ui-e2e-android-arm64-${{ github.ref }}-${{ github.event.inputs.rootfs_release_tag || 'android11-aosp-arm64-rsr2' }}
  cancel-in-progress: true

env:
  # The OFFICIAL Google SDK zip the vendored rootfs must have been built
  # from (provenance gate — the run refuses an unverified rootfs).
  OFFICIAL_SDK_ZIP_SHA256: cb50112cf2dd234a71e2a29b0241c23dbb37dd5fc3156c68cc9c49d0f58ad304
  TWOYI_PACKAGE: io.twoyi.debug

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1: Build the arm64-v8a APK on an x86_64 runner
  # (NDK r27c only ships x86_64 Linux host binaries — same split as
  # ui-e2e-test-arm64.yml)
  # ════════════════════════════════════════════════════════════════
  build-apk:
    name: Build arm64-v8a APK (x86_64 runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (debuggable variant, arm64-v8a only)
        run: ./gradlew assembleDebuggable -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: app/build/outputs/apk/debuggable/*.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # ════════════════════════════════════════════════════════════════
  # JOB 2: Import + boot the pure-stock Android 11 rootfs on redroid
  # ════════════════════════════════════════════════════════════════
  android-boot-ladder:
    name: Android 11 boot ladder E2E (arm64 runner)
    needs: build-apk
    runs-on: ubuntu-24.04-arm
    # 30 min headroom: the stall-adaptive watch is the PRIMARY control (it ends
    # a frozen guest in ~90s), so a raised job cap only ever buys runway for a
    # GENUINELY-PROGRESSING boot (klog growth resets the stall budget). At the
    # 15-min cap, #199 was cut mid-SystemServer.startBootstrapServices (AMS in
    # flight) while the guest was still actively progressing. At the 30-min
    # cap, rn279 was cut mid-PMS dexopt-churn (61 successful dex2oats, the
    # package_native waitForService poll alive, zero era deaths) — the
    # 6-Z329-honest boot is dexopt-BOUND, not stuck; give it 55 minutes.
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built arm64-v8a APK
        uses: actions/download-artifact@v4
        with:
          name: arm64-v8a-apk
          path: app/build/outputs/apk/debuggable/

      - name: Provision redroid prerequisites (binderfs + adb)
        run: |
          set -e
          echo "── Runner architecture ──"
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
              echo "  ✗ Runner is $(uname -m), expected aarch64. ubuntu-24.04-arm required."
              exit 1
          fi
          echo "── Provision 6 GB swap (rn310/311/312 decode) ──"
          # The boot now reaches the SF/RenderEngine era (SwiftShader/ANGLE
          # GL + the zygote preloads) — the deepest guest work yet — and the
          # HOST redroid Android thrashed into direct reclaim at exactly
          # that phase on a 16 GB runner with ~300 MB of swap
          # ('device is low on swap (88kB < 314572kB) and thrashing (206%)'
          # killed the app tree in rn310; rn311/312 died the same way in
          # mass uid kill-waves). A swapfile does NOT change any boot
          # semantics — it removes the runner's resource ceiling so the
          # ladder can observe the guest's real progress. Idempotent.
          if ! swapon --show=NAME | grep -q '/mnt/twoyi-swap'; then
              sudo fallocate -l 6G /mnt/twoyi-swap || sudo dd if=/dev/zero of=/mnt/twoyi-swap bs=1M count=6144 status=none
              sudo chmod 600 /mnt/twoyi-swap
              sudo mkswap /mnt/twoyi-swap
              sudo swapon /mnt/twoyi-swap
          fi
          free -h
          echo "── Install kernel modules + native arm64 adb ──"
          # binder_linux.ko lives in linux-modules-extra for the RUNNING
          # kernel — install it ALWAYS (a preinstalled adb must not skip
          # this: run 33986239077 failed on exactly that).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              linux-modules-extra-$(uname -r) \
              android-tools-adb
          adb version | head -2
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs/
          command -v docker >/dev/null || sudo apt-get install -y docker.io
          docker --version

      - name: Download vendored PURE STOCK Android 11 rootfs (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.rootfs_release_tag || 'android11-aosp-arm64-rsr1' }}
          ASSET_NAME: ${{ github.event.inputs.rootfs_asset_name || 'twoyi-android11-aosp-arm64-rsr1.tar.gz' }}
        run: |
          set -e
          mkdir -p /tmp/android11-rootfs
          cd /tmp/android11-rootfs
          echo "── downloading $ASSET_NAME from release $RELEASE_TAG ──"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG"
          URL=$(curl -sf -H "Authorization: token $GH_TOKEN" "$API" \
                | python3 -c "import json,sys,os; d=json.load(sys.stdin); print(next(a['url'] for a in d['assets'] if a['name']==os.environ['ASSET_NAME']))")
          # Accept: application/octet-stream is REQUIRED on the asset API
          # URL — without it GitHub returns the asset METADATA JSON
          # (~1.7KB) and every later step silently corrupts (run
          # 33986501536 died on KeyError sdk_zip_sha256 from the
          # metadata-JSON masquerading as the manifest).
          curl -fL --retry 3 -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" -o "$ASSET_NAME" "$URL"
          # provenance gate: fetch the manifest and require the official
          # SDK zip sha256 — refuse to boot an unverified rootfs.
          MAN_URL=$(curl -sf -H "Authorization: token $GH_TOKEN" "$API" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['url'] for a in d['assets'] if a['name']=='ROOTFS_MANIFEST.json'))")
          curl -sfL -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" -o ROOTFS_MANIFEST.json "$MAN_URL"
          ZSHA=$(python3 -c "import json; print(json.load(open('ROOTFS_MANIFEST.json'))['sdk_zip_sha256'])")
          if [ "$ZSHA" != "$OFFICIAL_SDK_ZIP_SHA256" ]; then
              echo "✗ rootfs provenance mismatch: manifest sdk_zip_sha256=$ZSHA expected=$OFFICIAL_SDK_ZIP_SHA256"
              exit 1
          fi
          # binary sanity gate: must be a real gzip stream of ~494MB
          MAGIC=$(head -c 2 "$ASSET_NAME" | od -A n -t x1 | tr -d ' ')
          if [ "$MAGIC" != "1f8b" ]; then
              echo "✗ downloaded asset is not gzip (magic $MAGIC) — asset download broken"
              exit 1
          fi
          SZ=$(stat -c%s "$ASSET_NAME")
          if [ "$SZ" -lt 400000000 ]; then
              echo "✗ rootfs asset too small ($SZ bytes) — truncated download"
              exit 1
          fi
          echo "  ✓ provenance verified: built from OFFICIAL arm64-v8a-30_r02.zip ($ZSHA)"
          FP=$(python3 -c "import json; print(json.load(open('ROOTFS_MANIFEST.json'))['fingerprint'])")
          echo "  fingerprint: $FP"
          mv "$ASSET_NAME" rootfs.tar.gz
          ls -lh rootfs.tar.gz

      - name: Pull + launch redroid
        env:
          REDROID_TAG: ${{ github.event.inputs.redroid_tag || '14.0.0-latest' }}
          REDROID_RESOLUTION: ${{ github.event.inputs.redroid_resolution || '720x1600' }}
          REDROID_DPI: ${{ github.event.inputs.redroid_dpi || '320' }}
        run: |
          set -e
          mkdir -p /tmp/ui-e2e-artifacts
          sudo docker pull "redroid/redroid:$REDROID_TAG"
          sudo docker run -itd --rm --privileged \
              --name redroid \
              -v /dev/binderfs:/dev/binderfs:rw \
              -v $HOME/redroid-data:/data \
              -p 5555:5555 \
              "redroid/redroid:$REDROID_TAG" \
              androidboot.use_memfd=1 \
              androidboot.redroid_gpu_mode=guest \
              androidboot.redroid_width=720 androidboot.redroid_height=1600 \
              androidboot.redroid_dpi=$REDROID_DPI
          sudo docker logs -f redroid > /tmp/ui-e2e-artifacts/redroid.log 2>&1 &
          BOOT_TIMEOUT=120
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              adb connect localhost:5555 >/dev/null 2>&1 || true
              BOOTED=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              [ "$BOOTED" = "1" ] && { echo "  ✓ redroid booted after ${WAITED}s"; break; }
              sleep 5; WAITED=$((WAITED+5))
          done
          [ "$BOOTED" = "1" ] || { sudo docker logs redroid | tail -100; exit 1; }
          ABI=$(adb -s localhost:5555 shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
          [ "$ABI" = "arm64-v8a" ] || { echo "✗ ABI $ABI"; exit 1; }
          echo "  ✓ redroid arm64-v8a ready (the twoyi HOST)"

      - name: Install APK + push pure Android 11 rootfs
        run: |
          set -e
          ADB="adb -s localhost:5555"
          $ADB shell settings put global immersive_mode_confirmations confirmed || true
          # ── 6-Z305t-71: neutralize the HOST's phantom process killer ──
          # Ladder #133 decode: from +134s the redroid HOST's ActivityManager
          # "Trimming phantom processes" SIGKILLed the GUEST fleet (init,
          # logd, lmkd, servicemanager, hwservicemanager, keymaster, … are
          # all "phantom" children of io.twoyi.debug to the HOST's AMS),
          # capping the rung at 3 post-mortem. The guest fleet only got
          # ALIVE enough to cross the 32-phantom watermark THIS run (the
          # -71 fixes: honest trap deaths → init restart waves churn more
          # live children; in #131 the fleet was deader and never trimmed).
          # This is HOST TESTBENCH policy, not guest/ROM logic — the same
          # class as the immersive_mode line above. Verify, don't trust:
          # the get must print 2147483647.
          $ADB shell settings put global settings_enable_monitor_phantom_procs false || true
          $ADB shell device_config set_sync_disabled_for_tests persistent || true
          $ADB shell device_config put activity_manager max_phantom_processes 2147483647 || true
          echo "  phantom-killer: max_phantom_processes=$($ADB shell device_config get activity_manager max_phantom_processes 2>/dev/null | tr -d '\r')"
          $ADB shell settings put global settings_enable_monitor_phantom_procs false || true
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"
          echo "── Pushing pure-stock Android 11 rootfs (~494MB) ──"
          PUSH_OK=0
          for ATTEMPT in 1 2 3 4 5; do
            if $ADB push /tmp/android11-rootfs/rootfs.tar.gz /sdcard/Download/rootfs.tar.gz; then
              PUSH_OK=1; echo "  ✓ push succeeded on attempt $ATTEMPT"; break
            fi
            echo "  ⚠ push attempt $ATTEMPT failed — retrying in 10s"; sleep 10
          done
          [ "$PUSH_OK" = "1" ] || { echo "✗ rootfs push failed after 5 attempts"; exit 1; }
          $ADB shell ls -la /sdcard/Download/rootfs.tar.gz

      - name: UI navigation — import rootfs + boot Android
        env:
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '180' }}
          TWOYI_STALL_SECONDS: ${{ github.event.inputs.stall_seconds || '90' }}
          TWOYI_IMPORT_WAIT_SECONDS: ${{ github.event.inputs.import_wait_seconds || '300' }}
          TWOYI_ROM_FILE: rootfs.tar.gz
          ADB_SERIAL: localhost:5555
        run: |
          mkdir -p /tmp/ui-e2e-artifacts
          # 6-Z360: runner-kernel memory/kill recorder — the rn310-313 kill
          # wave was invisible to the container (the runner's dmesg carries
          # the oom-killer records). Sample free -m + the top RSS processes
          # + memory PSI every 5s, and capture the runner's oom traces.
          (
            while [ ! -f /tmp/ui-e2e-artifacts/nav-done ]; do
              {
                date -u '+===== mem @%H:%M:%S ====='
                free -m | head -3
                echo '-- top RSS (whole container):'
                ps -eo rss,pid,comm --sort=-rss 2>/dev/null | head -9
                echo '-- mem PSI:'
                cat /proc/pressure/memory 2>/dev/null || true
              } >> /tmp/ui-e2e-artifacts/mem-watch.log 2>&1
              sleep 5
            done
          ) &
          MEMWATCH=$!
          # adb-independent liveness watcher (light — same as the TWRP suite)
          rm -f /tmp/ui-e2e-artifacts/nav-done
          (
            I=0
            while [ ! -f /tmp/ui-e2e-artifacts/nav-done ]; do
              sleep 30; I=$((I+30))
              {
                echo "===== liveness @${I}s $(date -u +%H:%M:%S) ====="
                if sudo docker ps --filter name=redroid --filter status=running -q | grep -q .; then
                  echo "-- container: RUNNING"
                  echo "-- host-ps sample (RAW HOST redroid view — the HOST runs its own"
                  echo "-- init/zygote/system_server/surfaceflinger; these are NOT guest"
                  echo "-- evidence. Guest = subtree of io.twoyi.debug, see LOG-SOURCES.txt):"
                  # 6-Z374 verifier gap: the classifier unions these samples into
                  # the guest subtree — the filter MUST keep the guest chain
                  # complete down to SystemUI/launcher (zygote->system_server->
                  # systemui), and head -12 truncated deep guest subtrees once the
                  # host's own 7 rows were counted first (rn328 samples sat at
                  # exactly 12 rows).
                  sudo docker exec redroid sh -c \
                    "ps -A -o PID,PPID,NAME 2>/dev/null | grep -E 'twoyi|kr64|init|zygote|system_server|surfaceflinger|systemui|launcher'" 2>&1 | head -48
                else
                  echo "-- container: NOT RUNNING"
                  sudo docker logs redroid 2>&1 | tail -n 30
                fi
              } >> /tmp/ui-e2e-artifacts/docker-exec-watch.log 2>&1
            done
          ) &
          WATCHER=$!
          # ── 6-Z367: HOST-survival CPU policy ──────────────────────
          # rn318 death chain: the guest fleet (app + libkr64 + the
          # ptrace'd guest init/zygote/SF fleet) were the TOP CPU
          # consumers of the whole system (the HOST AMS watchdog dump
          # named them one by one as "not a java proc"), HOST
          # system_server starved → Watchdog killed it → runtime restart
          # → the restart SIGKILLed every app process → the ENTIRE guest
          # subtree died ~111s into the guest boot. The policy below
          # renices the whole io.twoyi.debug subtree to +15 so the HOST's
          # watchdog checkers keep their slice; the guest fleet still
          # gets all idle CPU. Testbench policy — NOT guest semantics.
          (
            while [ ! -f /tmp/ui-e2e-artifacts/nav-done ]; do
              timeout 20 sudo docker exec -i redroid /system/bin/sh \
                < scripts/twoyi-cpu-policy.sh \
                >> /tmp/ui-e2e-artifacts/cpu-policy.log 2>&1 || true
              sleep 10
            done
          ) &
          CPUPOLICY=$!
          RC=0
          python3 -u scripts/ui-navigate.py || RC=$?
          touch /tmp/ui-e2e-artifacts/nav-done
          kill $WATCHER $MEMWATCH $CPUPOLICY 2>/dev/null || true

          # 6-Z360: the runner kernel's oom-killer/kill records — invisible
          # to the container, decisive for the rn310-313 death class.
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|out of memory|killed process|memory cgroup' \
            > /tmp/ui-e2e-artifacts/runner-dmesg-oom.txt 2>&1 || true

          # ── final evidence dumps (docker exec — survives adb death) ──
          # 6-Z305n iter-4: EVERY dump is `timeout`-wrapped and size-bounded.
          # Run 34035121808 burned 8 minutes here: a guest pushing a 7.5MB
          # klog starved the host enough that unbounded `logcat -d` and
          # friends crawled. Logs are truncated to the LAST N lines — the
          # classifier needs the tail, not the whole history.
          timeout 60 sudo docker exec redroid /system/bin/logcat -d -t 20000 \
            > /tmp/ui-e2e-artifacts/logcat-dockerexec.txt 2>&1 || true
          # 6-Z412 (rn368 decode): the CRASH BUFFER as a first-class
          # artifact. The main buffer ROTATES under a restart storm (the
          # rn368 68-generation SF/zygote cascade pushed SF's own abort
          # message out of the visible logcat while 17 other service
          # generations' "Failed HIDL return status not checked ...
          # DEAD_OBJECT" aborts survived) — the dedicated crash buffer
          # retains EVERY Fatal signal + Abort message for the WHOLE run,
          # which is exactly the evidence the abort-reason decodes need.
          timeout 60 sudo docker exec redroid /system/bin/logcat -d -b crash \
            > /tmp/ui-e2e-artifacts/logcat-crash.txt 2>&1 || true
          # 6-Z362 (rn315 decode): the HOST redroid's lowmemorykiller kill
          # records as a FIRST-CLASS artifact. rn315's death chain
          # (guest SF 14 GB balloon → lmkd watermark breach → mass kill
          # → app tree SIGKILL at oom_score_adj 0) was fully attributable
          # ONLY after hand-grepping logcat-dockerexec.txt — and the
          # runner-dmesg-oom.txt capture legitimately stays EMPTY because
          # lmkd kills are userspace SIGKILLs inside the container, not
          # kernel OOM records.
          # 6-Z363 (rn316 lesson): rn316's HOST lmkd CRASHED under the
          # pressure peak ("Lost connection to lmkd" + endless
          # "epoll_wait failed (errno=22)" spam — 20000 lines flooded the
          # rn316 artifact and drowned the zero actual kills). The
          # artifact now bounds to actual Kill/reason lines (tail 400)
          # plus the lmkd crash/liveness markers that ARE the evidence.
          {
            grep -E "lowmemorykiller: Kill |reason: " /tmp/ui-e2e-artifacts/logcat-dockerexec.txt | tail -400;
            grep -cE "lowmemorykiller: epoll_wait failed" /tmp/ui-e2e-artifacts/logcat-dockerexec.txt | sed 's/^/epoll-wait-failed-count=/';
            grep -E "Lost connection to lmkd|Connection with lmkd established" /tmp/ui-e2e-artifacts/logcat-dockerexec.txt | head -8;
          } > /tmp/ui-e2e-artifacts/host-lmkd-kills.txt 2>&1 || true
          # ── 6-Z367: HOST watchdog/restart forensics ───────────────
