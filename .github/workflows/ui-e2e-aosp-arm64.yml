# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# ARM64 UI-only end-to-end test for twoyi (AOSP boot).
#
# Sibling of ui-e2e-test-arm64.yml (TWRP). Boots a full Android AOSP
# container via twoyi, exercising the arm64-v8a build of twoyi's native
# libraries (libtwoyi.so, libOpenglRender.so, libloader.so, kr64).
#
# Architecture (v3 — switched to a real arm64 runner; v2's x86_64 runner
#               couldn't boot arm64 system images):
#   - ubuntu-24.04-arm runner (arm64 Ampere hardware, free public
#     preview since Jan 2025). No nested KVM (no /dev/kvm), but the
#     arm64 Android emulator binary boots arm64-v8a system images via
#     QEMU TCG — arm64-to-arm64 TCG is essentially native execution
#     with a JIT, so boot is ~5-10 min (not 30 min).
#   - twoyi APK built for arm64-v8a ONLY — runs NATIVELY on the arm64
#     emulator (no translation layer, no native bridge).
#   - AOSP rootfs extracted from the running arm64 emulator via
#     `adb root` (the `default` image accepts it) + `tar cf - system/
#     vendor/ init default.prop`. The guest binaries (init, zygote,
#     system_server, etc.) are arm64-native — they run with no
#     translation. The twoyi arm64 tracer ptraces them; the syscalls it
#     sees are arm64 syscall numbers (matches the tracer's expectations).
#
# Why v3 replaced v2 (x86_64 runner + arm64-v8a system image):
#   The Android emulator binary shipped with the Linux x86_64 Android
#   SDK does NOT include an arm64 TCG backend. v2's run 32891455624
#   failed in 10s with `FATAL: Avd's CPU Architecture 'arm64' is not
#   supported by the QEMU2 emulator on x86_64 host. System image
#   must match the host architecture.` The -no-accel flag only
#   disables hardware acceleration; it does NOT enable cross-arch
#   TCG system-image emulation. The x86_64 emulator binary is
#   hard-coded to x86/x86_64 guests only.
#
# Why v2 replaced v1 (native bridge on x86_64 Play Store image):
#   The native bridge (libndk_translation.so on google_apis_playstore
#   x86_64 image) translates the twoyi app's arm64 .so to x86_64 at
#   runtime. When twoyi's arm64 Rust kernel calls ptrace() on a forked
#   child, the kernel returns x86_64 register layout (struct
#   user_regs_struct), but the arm64-translated code expects arm64
#   layout (struct user_pt_regs — different field offsets, different
#   register count). This mismatch corrupts the register state and
#   the twoyi app crashes immediately on "Launch Container" tap →
#   run 32886902337 (TWRP sibling): every screenshot from 5s..180s
#   showed the launcher. Same fate would have hit the AOSP test even
#   if step 17 had succeeded (it never did because Play Store image
#   also rejects adb root, blocking /init extraction).
#
# What this tests that ui-e2e-aosp.yml (x86_64) does NOT:
#   - The arm64-v8a build of twoyi's Rust + C++ code actually links and
#     loads on a real arm64 Android runtime.
#   - twoyi's PLT hooks / LD_PRELOAD libtwoyi_loader_shlib.so work
#     when the loader AND the guest binaries are both real arm64 ELF.
#   - The ptrace tracer's aarch64 register-access paths (PTRACE_PEEKUSER
#     offsets, struct user_pt_regs layouts, arm64 syscall numbers)
#     get exercised end-to-end.
#
# Differences from ui-e2e-aosp.yml (x86_64):
#   - System image: default;arm64-v8a (NOT google_apis;x86_64).
#     Pure AOSP arm64 — supports `adb root` (no more debugfs
#     extraction workaround for /init).
#   - Runner: ubuntu-24.04-arm (arm64 Ampere hardware, no nested KVM
#     but arm64-to-arm64 TCG works at near-native speed).
#   - Emulator flags: NO `-qemu -enable-kvm` (no /dev/kvm on the
#     arm64 runner); NO `-no-accel` either — let the Android emulator
#     auto-detect TCG mode for arm64-v8a system image on arm64 host.
#   - Boot timeout: 1200s (20 min) — arm64 TCG boot on arm64 HW is
#     ~5-10 min, allow extra slack.
#   - Job timeout: 120 min (vs 55 min) — arm64 TCG is slow.
#   - default boot_wait_seconds: 900s (vs 600s) — arm64 guest AOSP
#     boots slower than x86_64.
#   - AVD name: twoyi_test_arm64 (avoids colliding with the cached
#     twoyi_test AVD used by the x86_64 workflows).
#   - Step 17 (preload rootfs): RESTORED the original x86_64 flow
#     (`adb root` → `tar cf - system/ vendor/ init default.prop` →
#     `adb unroot`). The `default` arm64 image accepts `adb root`
#     just like the `google_apis` x86_64 image does — no more
#     debugfs / simg2img / system.img extraction hacks.
#   - ui-navigate-aosp.py's new post-Launch-Container + final
#     assertions abort the script (exit 1) if the app crashed back
#     to launcher (the bug that produced false-green runs).
---
name: UI E2E Test (ARM64 AOSP via real arm64 runner)

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for the guest Android to boot (seconds)'
        required: false
        default: '900'

concurrency:
  group: ui-e2e-aosp-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e-aosp-arm64:
    name: UI-only ARM64 AOSP E2E on arm64-v8a emulator (arm64 runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: ubuntu-24.04-arm runners do NOT have nested KVM (no
      # /dev/kvm). The arm64 Android emulator boots arm64-v8a system
      # images via QEMU TCG (arm64-to-arm64 JIT — near-native speed,
      # NOT cross-architecture translation).
      - name: Check runner architecture (arm64 expected)
        run: |
          set -u
          echo "── Runner architecture ──"
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
              echo "  ✗ Runner is $(uname -m), expected aarch64. ubuntu-24.04-arm required."
              exit 1
          fi
          echo "  ✓ Running on aarch64 hardware — arm64 Android emulator will work"
          echo "── /dev/kvm (informational — expected missing on hosted arm64 runners) ──"
          if [ -e /dev/kvm ]; then
              echo "  /dev/kvm exists (KVM would speed up the boot, but TCG is fine)"
          else
              echo "  /dev/kvm not present — Android emulator will use QEMU TCG software emulation (arm64-on-arm64, ~5-10 min boot)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-{{ runner.arch }}-cargo-arm64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-{{ runner.arch }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-{{ runner.arch }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK (direct sdkmanager — works on arm64 hosts)
        # The nttld/setup-ndk@v1 action hardcodes its supported-host list
        # to linux (x86_64)/darwin/win32 and rejects linux-arm64 with
        # "Error: Unsupported host 'linux-arm64'" (run 32892478844 / 32892481714).
        # Direct sdkmanager install works because the NDK package itself
        # is host-agnostic (ships binaries for x86_64 + arm64 Linux, plus
        # darwin/win). The ubuntu-24.04-arm runner image does NOT
        # Android SDK at /home/runner/android-sdk (user-writable; not pre-installed).
        id: setup-ndk
        run: |
          set -e
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # Ensure cmdline-tools exists (NOT pre-installed on arm64 runner;
          # always download fresh on first run; cached on subsequent runs).
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              cd /tmp
              curl -sL -o cmdline-tools.zip 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
              unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm cmdline-tools.zip
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # NDK r27c (LTS, late 2024). Package version is the numeric ID
          # 27.3.13750724; the install path is
          # $ANDROID_HOME/ndk/27.3.13750724.
          sdkmanager "ndk;27.3.13750724"
          NDK_PATH="$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$NDK_PATH" || { echo "✗ NDK r27c install failed"; exit 1; }
          echo "ndk-path=$NDK_PATH" >> "$GITHUB_OUTPUT"
          echo "  ✓ NDK r27c installed at $NDK_PATH"

      - name: Cache Android SDK (arm64-v8a default system image)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-sdk
          key: ${{ runner.os }}-{{ runner.arch }}-sdk-android30-default-arm64-v8a-v1

      - name: Install Android SDK + emulator + arm64-v8a system image
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          export ANDROID_HOME=/home/runner/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd /tmp
              CMDLINE_TOOLS_URL='https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
              curl -sL -o cmdline-tools.zip "$CMDLINE_TOOLS_URL"
              unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --update
          # default;arm64-v8a is pure AOSP, no Google services — smaller and
          # faster to boot than google_apis;arm64-v8a. Supports adb root
          # (used below to tar /init out of the running emulator).
          sdkmanager \
              "platform-tools" \
              "platforms;android-30" \
              "build-tools;30.0.3" \
              "emulator" \
              "system-images;android-30;default;arm64-v8a"
          echo "✓ SDK + emulator + arm64-v8a (default) system image installed"

      - name: Create arm64-v8a AVD
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          set -ex
          export ANDROID_HOME=/home/runner/android-sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME=/home/runner/.android/avd
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMGR="$(command -v avdmanager 2>/dev/null || true)"
          if [ -z "$AVDMGR" ] || [ ! -x "$AVDMGR" ]; then
            for d in "$ANDROID_HOME"/cmdline-tools/*/; do
              if [ -x "${d}bin/avdmanager" ]; then
                AVDMGR="${d}bin/avdmanager"
                break
              fi
            done
          fi
          echo "" | "$AVDMGR" create avd \
              -n twoyi_test_arm64 \
              -k "system-images;android-30;default;arm64-v8a" \
              --force
          AVD_CONFIG="$ANDROID_AVD_HOME/twoyi_test_arm64.avd/config.ini"
          {
              echo "hw.keyboard=yes"
              echo "hw.gpu.enabled=yes"
              echo "hw.gpu.mode=swiftshader_indirect"
              echo "hw.ramSize=4096"
              echo "disk.dataPartition.size=8192"
              echo "vm.heapSize=256"
              # Pin ABI + tag explicitly (see comment in TWRP sibling).
              echo "abi.type=arm64-v8a"
              echo "tag.id=default"
              echo "image.sysdir.1=system-images/android-30/default/arm64-v8a/"
          } >> "$AVD_CONFIG"
          echo "✓ AVD created (arm64-v8a, default tag)"

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (debuggable variant, arm64-v8a only)
        # CRITICAL: this is the entire point of this workflow. The twoyi
        # native libs (libtwoyi.so, libOpenglRender.so, libloader.so,
        # kr64) are built for aarch64-linux-android ONLY — not x86_64.
        # They run NATIVELY on the arm64-v8a emulator (no native bridge).
        run: ./gradlew assembleDebuggable -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /home/runner/android-sdk

      - name: Boot arm64-v8a emulator (headless, TCG)
        # On arm64 hardware (ubuntu-24.04-arm runner), the Android
        # emulator binary boots arm64-v8a system images via QEMU TCG
        # (arm64-to-arm64 JIT — near-native speed, no cross-arch
        # translation). No `-qemu -enable-kvm` (no /dev/kvm); no
        # `-no-accel` either — let the emulator auto-pick TCG.
        # Boot time: ~5-10 min on hosted arm64 runners.
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p /tmp/ui-e2e-artifacts
          "$ANDROID_HOME/emulator/emulator" -avd twoyi_test_arm64 \
              -no-window -no-audio -no-snapshot -no-boot-anim \
              -gpu swiftshader_indirect \
              -partition-size 4096 \
              -ports 5554,5555 \
              > /tmp/ui-e2e-artifacts/emulator-stdout.log \
              2> /tmp/ui-e2e-artifacts/emulator-stderr.log &
          EMULATOR_PID=$!
          echo $EMULATOR_PID > /tmp/emulator.pid
          echo "  emulator PID: $EMULATOR_PID"

          BOOT_TIMEOUT=1200
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
                  echo "  ✗ emulator died after ${WAITED}s"
                  tail -50 /tmp/ui-e2e-artifacts/emulator-stderr.log >&2 || true
                  tail -50 /tmp/ui-e2e-artifacts/emulator-stdout.log >&2 || true
                  exit 1
              fi
              BOOTED=$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                  echo "  ✓ boot_completed after ${WAITED}s"
                  break
              fi
              sleep 10
              WAITED=$((WAITED + 10))
              if [ $((WAITED % 60)) -eq 0 ]; then
                  echo "  still booting... ${WAITED}s elapsed"
              fi
          done
          if [ "$WAITED" -ge "$BOOT_TIMEOUT" ]; then
              echo "  ✗ emulator did not boot in ${BOOT_TIMEOUT}s"
              echo "  emulator-stderr.log (last 30 lines):"
              tail -30 /tmp/ui-e2e-artifacts/emulator-stderr.log || true
              echo "  emulator-stdout.log (last 30 lines):"
              tail -30 /tmp/ui-e2e-artifacts/emulator-stdout.log || true
              exit 1
          fi

          # Defensive: verify the running emulator is actually arm64-v8a.
          ABI=$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
          echo "  ro.product.cpu.abi = $ABI"
          if [ "$ABI" != "arm64-v8a" ]; then
              echo "  ✗ Emulator ABI is '$ABI' — expected arm64-v8a. Aborting."
              exit 1
          fi
          echo "  ✓ Emulator is arm64-v8a (no native bridge, no translation)"

      - name: Install APK + preload AOSP rootfs from the AVD system image
        # v2: with the default arm64-v8a image we can finally restore the
        # ORIGINAL x86_64 flow — `adb root` works on the default image
        # (unlike google_apis_playstore x86_64 which rejects it), so we
        # can `tar cf - system/ vendor/ init default.prop` directly.
        # No more debugfs / simg2img / system.img extraction hacks.
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          set -ex
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ADB="adb -s emulator-5554"

          # Install the arm64-v8a DEBUGGABLE variant (io.twoyi.debug).
          # arm64-v8a APK on arm64-v8a emulator → ABI matches natively.
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "── Installing APK: $APK ──"
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"

          # ════════════════════════════════════════════════════════════
          # EXTRACT AOSP ROOTFS FROM THE RUNNING arm64-v8a EMULATOR
          # (same flow as ui-e2e-aosp.yml x86_64 — restored v2)
          # ════════════════════════════════════════════════════════════
          # The default;arm64-v8a image accepts `adb root` (it's pure
          # AOSP, not a production build). /init is root-owned 0750 —
          # shell-user tar skips it. `adb root` lets tar see it.
          # apex/ is EXCLUDED (host-APEX passthrough handles /apex).
          adb -s emulator-5554 wait-for-device
          echo "── Switching adbd to root (default image allows it) ──"
          adb -s emulator-5554 root
          sleep 3
          adb -s emulator-5554 wait-for-device
          # Sanity-check: adbd is now uid 0.
          ADB_UID=$(adb -s emulator-5554 shell id -u 2>/dev/null | tr -d '\r' || true)
          echo "  adbd uid after `adb root`: $ADB_UID"
          if [ "$ADB_UID" != "0" ]; then
              echo "  ✗ adb root failed — default;arm64-v8a image rejected it"
              echo "    (this should not happen; if it does, the image has changed)"
              exit 1
          fi

          echo "── Tarring the rootfs out of the booted emulator (system+vendor+init+default.prop — apex excluded) ──"
          adb -s emulator-5554 exec-out \
              "cd / && tar cf - system/ vendor/ init default.prop 2>/dev/null" \
              | gzip -1 > /tmp/profile_rootfs.tar.gz
          adb -s emulator-5554 unroot || true
          sleep 2
          adb -s emulator-5554 wait-for-device
          ls -la /tmp/profile_rootfs.tar.gz
          [ -s /tmp/profile_rootfs.tar.gz ] || { echo "✗ rootfs tar is empty"; exit 1; }
          gzip -t /tmp/profile_rootfs.tar.gz || { echo "✗ corrupt gzip"; exit 1; }
          $ADB push /tmp/profile_rootfs.tar.gz /sdcard/Download/ 2>&1 | tail -1

          # ── Preload into the app's private profile dir via run-as ────
          $ADB shell monkey -p io.twoyi.debug -c android.intent.category.LAUNCHER 1
          sleep 8
          $ADB shell am force-stop io.twoyi.debug
          sleep 2

          $ADB shell "run-as io.twoyi.debug mkdir -p profiles/default/rootfs"
          # Scoped storage: the app uid cannot READ /sdcard/Download
          # (owned by shell). Pipe through the SHELL uid — cat runs as
          # shell (allowed), run-as tar reads STDIN.
          $ADB shell "cat /sdcard/Download/profile_rootfs.tar.gz | run-as io.twoyi.debug tar -xz -C profiles/default/rootfs"
          $ADB shell "rm /sdcard/Download/profile_rootfs.tar.gz"

          # Normalize ownership + modes (root-owned 0700/0750 → app-owned 0755/0644).
          $ADB shell "run-as io.twoyi.debug sh -c 'cd profiles/default/rootfs && chmod -R u+rwX,go+rX,go-w . 2>/dev/null; chmod -R u+x system/bin 2>/dev/null; chmod 0755 init system/bin/init 2>/dev/null; true'"
          echo "  ✓ normalized rootfs ownership/modes (dirs 755, files 644, exec bits on init + system/bin)"

          # Honest verification: the guest init must exist and be non-empty.
          # init is an ABSOLUTE symlink (init -> /system/bin/init) on the
          # default image. test -L matches the link itself; we also
          # verify the target inside the rootfs tree.
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/ | head -20"
          $ADB shell "run-as io.twoyi.debug sh -c 'test -L profiles/default/rootfs/init || test -f profiles/default/rootfs/init'" || {
              echo "✗ guest init (link or file) not found in rootfs"
              exit 1
          }
          $ADB shell "run-as io.twoyi.debug sh -c 'test -s profiles/default/rootfs/system/bin/init'" || {
              # On AOSP default image, /init may be a symlink to /system/bin/init
              # which is itself a real ELF. If the symlink resolved during tar
              # extraction, system/bin/init should be present.
              echo "  (warn) system/bin/init is missing or empty — checking if /init is a real file"
              $ADB shell "run-as io.twoyi.debug sh -c 'test -s profiles/default/rootfs/init'" || {
                  echo "✗ both /init and /system/bin/init are empty/missing"
                  exit 1
              }
          }
          echo "  ✓ init verified in rootfs"
          # Rewrite absolute /system|/apex|/vendor symlinks to relative.
          $ADB shell "run-as io.twoyi.debug sh -c 'cd profiles/default/rootfs && find . -type l | while read l; do t=\$(readlink "\$l"); case "\$t" in /system/*|/apex/*|/vendor/*) d=\$(dirname "\$l"); r=\$(realpath --relative-to="\$d" ".\$t" 2>/dev/null); [ -n "\$r" ] && ln -sfn "\$r" "\$l" 2>/dev/null;; esac; done; true'"
          echo "  ✓ rewrote absolute /system|/apex|/vendor symlinks to relative"
          # Free the stale rootfs/apex tree (host-APEX passthrough makes it dead weight).
          $ADB shell "run-as io.twoyi.debug sh -c 'rm -rf profiles/default/rootfs/apex; du -sh profiles/default/rootfs; df -h /data | tail -1'"
          echo "  ✓ freed the stale rootfs/apex tree"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/bin/linker64" || \
              echo "  (no linker64 in rootfs — this is FATAL for arm64 guest boot)"
          echo "  ✓ AOSP arm64 rootfs preloaded from the running arm64-v8a emulator"

          # SELinux compile input ground truth (same diagnostic block as x86_64 AOSP E2E).
          echo "── rootfs SELinux inputs ──"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/etc/selinux/ 2>&1 | head -25"
          echo "── rootfs SELinux mapping dir ──"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/etc/selinux/mapping/ 2>&1 | head -12"
          echo "── rootfs vendor selinux (CIL + vers + fstab) ──"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/vendor/etc/selinux/ 2>&1 | head -15"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/vendor/etc/fstab.ranchu 2>&1"
          echo "── emulator-side source files (shell-user view) ──"
          $ADB shell "ls -la /system/etc/selinux/plat_sepolicy.cil /vendor/etc/selinux/plat_sepolicy_vers.txt 2>&1"
          echo "── rootfs size + disk space ──"
          $ADB shell "run-as io.twoyi.debug du -sh profiles/default/rootfs 2>&1"
          $ADB shell "df -h /data 2>&1 | tail -2"

      - name: UI navigation — boot AOSP container
        env:
          ANDROID_HOME: /home/runner/android-sdk
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '900' }}
          AOSP_PACKAGE: io.twoyi.debug
        run: |
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          python3 scripts/ui-navigate-aosp.py

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ \
            || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-aosp-arm64-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Kill emulator
        if: always()
        env:
          ANDROID_HOME: /home/runner/android-sdk
        run: |
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb -s emulator-5554 emu kill 2>/dev/null || true
