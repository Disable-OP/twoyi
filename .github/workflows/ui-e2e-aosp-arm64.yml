# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# ARM64 UI-only end-to-end test for twoyi's NORMAL (AOSP) boot path.
#
# Sibling of ui-e2e-test-arm64.yml (TWRP). Boots a full Android AOSP
# container via twoyi, exercising the arm64-v8a build of twoyi's native
# libraries (libtwoyi.so, libOpenglRender.so, libloader.so, kr64).
#
# Architecture (v4 — switched to redroid after v1/v2/v3 all failed):
#   - redroid is a containerised REAL Android user space. It runs
#     Android as native arm64 Linux processes on the host kernel — NO
#     QEMU, NO KVM, NO TCG translation, NO native bridge. The Android
#     processes are regular Linux tasks visible to the host kernel.
#     This means:
#       * Real ARM64 ptrace ABI (struct user_pt_regs, iov_len == 272)
#         — the WHOLE POINT of this workflow.
#       * Near-native speed (no JIT translation overhead).
#       * ADB over TCP port 5555.
#       * Standard Android screencap (no custom framebuffer plumbing).
#   - The runner is GitHub's `ubuntu-24.04-arm` (aarch64 Ampere
#     hardware, Ubuntu 24.04 LTS). Its kernel (linux-azure 6.17) ships
#     `binder_linux.ko` as a loadable module in the
#     `linux-modules-extra-$(uname -r)` apt package — NOT preinstalled
#     but installable in ~5 seconds. Modern redroid uses `memfd`
#     instead of the removed `ashmem` Linux 5.18+ module.
#   - twoyi APK built for arm64-v8a ONLY — runs NATIVELY on redroid
#     (no translation layer, no native bridge).
#   - AOSP rootfs extracted from the running redroid container via
#     `adb root` (redroid 16.0.0-latest accepts it) + `tar cf -
#     system/ vendor/ init default.prop`. The guest binaries (init,
#     zygote, system_server, etc.) are arm64-native — they run with
#     no translation. The twoyi arm64 tracer ptraces them; the syscalls
#     it sees are arm64 syscall numbers (matches the tracer's
#     expectations).
#
# Why v4 (redroid) replaced v3 (ubuntu-24.04-arm + sdkmanager emulator):
#   v3 tried `sdkmanager "emulator"` on ubuntu-24.04-arm to install an
#   arm64 Android emulator binary. This permanently fails because Google
#   does NOT publish an aarch64 Linux binary for the `emulator` package
#   via sdkmanager — only `emulator-linux_x64-*.zip` exists in the
#   repository2-3.xml. See runs 32901106471 (v1) + 32901574547 (v2) +
#   the blocker report at download/arm64-emulator-blocker-report.md.
#
# Why v4 splits the workflow into TWO JOBS (build on x86_64, test on arm64):
#   The Android NDK r27c ships ONLY x86_64 Linux host binaries — there
#   is NO aarch64 Linux NDK host variant. On the arm64 runner, clang
#   /clang++/ld.lld/llvm-ar from the NDK are x86_64 ELF binaries that
#   the kernel cannot execute (no binfmt_misc registered for x86_64
#   on ubuntu-24.04-arm). The first run (32939635687) failed with:
#     /home/runner/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/clang: 1: Syntax error: "(" unexpected
#   Workarounds considered:
#     (a) `apt install qemu-user-static binfmt-support` + register the
#         x86_64 ELF binfmt_misc handler — would work but with a 5-10x
#         slowdown on every clang invocation; the Rust+C++ Twoyi build
#         takes ~10 min on native x86_64 → ~50-100 min via qemu, blowing
#         past the 90-min job timeout.
#     (b) Build the APK on an x86_64 runner (where the NDK is native)
#         and download it on the arm64 runner. This is the chosen
#         approach — it's also how Google's own android emulator images
#         are built for CI (cross-compile on x86_64, deploy on arm64).
#
# What this tests that ui-e2e-aosp.yml (x86_64) does NOT:
#   - The arm64-v8a build of twoyi's Rust + C++ code actually links and
#     loads under a real arm64 Android runtime.
#   - twoyi's PLT hooks / LD_PRELOAD libtwoyi_loader_shlib.so work
#     when the loader AND the guest binaries are both real arm64 ELF.
#   - The ptrace tracer's aarch64 register-access paths (PTRACE_PEEKUSER
#     offsets, struct user_pt_regs layouts, arm64 syscall numbers)
#     get exercised end-to-end.
#
# Differences from ui-e2e-aosp.yml (x86_64):
#   - TWO JOBS: build-apk (ubuntu-latest/x86_64) → e2e (ubuntu-24.04-arm).
#     The x86_64 sibling is a single job because it can build + test
#     natively on the same runner.
#   - Android runtime: redroid Docker container (NOT the sdk emulator).
#     Image: redroid/redroid:16.0.0-latest (Android 16 = API 36, the
#     same version as the x86_64 sibling for apples-to-apples parity).
#   - Runner: ubuntu-24.04-arm (arm64 Ampere hardware, NO /dev/kvm
#     but redroid doesn't need it — Android runs as host processes).
#   - Boot accelerator: NONE needed — redroid boots in ~30-60s as
#     native processes on the host CPU.
#   - ADB serial: `localhost:5555` (TCP) instead of `emulator-5554`
#     (qemud). ui-navigate-aosp.py picks this up from the ADB_SERIAL
#     env var; the x86_64 default `emulator-5554` is preserved.
#   - Setup: install `linux-modules-extra-$(uname -r)` apt package
#     (provides binder_linux.ko) + modprobe + mount binderfs + start
#     the redroid container with `docker run`.
#   - Cleanup: `docker stop redroid` (instead of `adb emu kill`).
#   - Job timeout: 90 min for the e2e job (vs 50 min — extra slack
#     for first-run docker pull + AOSP rootfs extraction + slow arm64
#     AOSP boot via redroid).
#   - default boot_wait_seconds: 600s (vs 600s — matches x86_64).
#   - Step 17 (preload rootfs): RESTORED the original x86_64 flow
#     (`adb root` → `tar cf - system/ vendor/ init default.prop` →
#     `adb unroot`). redroid 16.0.0-latest accepts `adb root` — no
#     more debugfs / simg2img / system.img extraction hacks.
#   - ui-navigate-aosp.py's post-Launch-Container + final assertions
#     abort the script (exit 1) if the app crashed back to launcher
#     (the bug that produced false-green runs).
#
# v5 (native-adb fix): v4.x installed the SDK platform-tools via
# sdkmanager — but that adb is an x86_64 ELF. Every later step exported
# PATH="$ANDROID_HOME/platform-tools:$PATH", shadowing the NATIVE
# arm64 adb from android-tools-adb. Result (run 32942686027, TWRP
# sibling): ALL adb calls died with "cannot execute binary file: Exec
# format error" — the 600s boot wait polled a dead adb while Android
# inside redroid was actually booting. v5 DELETES the sdkmanager
# platform-tools step entirely: the ONLY adb on PATH is Ubuntu's native
# arm64 android-tools-adb, enforced by an adb-version sanity gate.
# v5 also parameterizes the redroid tag (input redroid_tag, default
# 14.0.0-latest — the research-verified actively-pulled arm64 image)
# and streams `docker logs -f` into the artifacts from container start.
---
name: UI E2E Test (ARM64 AOSP via redroid on ubuntu-24.04-arm)

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for the guest Android to boot (seconds)'
        required: false
        default: '600'
      redroid_tag:
        description: 'redroid Docker image tag (arm64): 14.0.0-latest, 16.0.0-latest, 13.0.0-latest, 11.0.0-latest ...'
        required: false
        default: '14.0.0-latest'

concurrency:
  group: ui-e2e-aosp-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1: Build the arm64-v8a APK on an x86_64 runner
  # (NDK r27c only ships x86_64 Linux binaries; running clang on
  # arm64 host without binfmt_misc fails with "Syntax error: (")
  # ════════════════════════════════════════════════════════════════
  build-apk:
    name: Build arm64-v8a APK (x86_64 runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (debuggable variant, arm64-v8a only)
        run: ./gradlew assembleDebuggable -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk-aosp
          path: app/build/outputs/apk/debuggable/*.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # ════════════════════════════════════════════════════════════════
  # JOB 2: Run the redroid-based E2E on the arm64 runner
  # ════════════════════════════════════════════════════════════════
  ui-e2e-aosp-arm64:
    name: UI-only ARM64 AOSP E2E on redroid (arm64 runner)
    needs: build-apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built arm64-v8a APK
        uses: actions/download-artifact@v4
        with:
          name: arm64-v8a-apk-aosp
          path: app/build/outputs/apk/debuggable/

      - name: Verify APK architecture (arm64-v8a present)
        # Defensive: confirm the APK actually contains arm64-v8a libs.
        # NOTE: the APK may ALSO contain x86_64 libs because the C++
        # build.gradle hardcodes abiFilters "arm64-v8a", "x86_64" for
        # the CMake side. That's fine — redroid is arm64-v8a and will
        # pick up the arm64-v8a side.
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/.*\.so" || { echo "✗ no native libs in APK"; exit 1; }
          echo "── arm64-v8a libs in APK ──"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/" || { echo "✗ APK has no arm64-v8a libs — build step is broken"; exit 1; }
          ARM64_COUNT=$(unzip -l "$APK" | grep -cE "lib/arm64-v8a/" || true)
          echo "  ✓ APK contains $ARM64_COUNT arm64-v8a libs (redroid will use this ABI)"

      # ───────────────────────────────────────────────────────────────
      # Step: Provision redroid prerequisites
      # ───────────────────────────────────────────────────────────────
      - name: Provision redroid prerequisites (binderfs + adb)
        run: |
          set -e
          echo "── Runner architecture ──"
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
              echo "  ✗ Runner is $(uname -m), expected aarch64. ubuntu-24.04-arm required."
              exit 1
          fi
          echo "  ✓ Running on aarch64 hardware"

          echo "── Install kernel modules + native arm64 adb ──"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              linux-modules-extra-$(uname -r) \
              android-tools-adb

          echo "── adb sanity gate (v5) ──"
          # The ONLY adb on PATH must be Ubuntu's NATIVE arm64 build.
          # The v4.x failure mode (sdkmanager's x86_64 adb shadowing it)
          # surfaces here as 'Exec format error' — fail fast, not 600s later.
          command -v adb || { echo "✗ adb not found on PATH"; exit 1; }
          adb version || { echo "✗ adb is not executable on aarch64 (Exec format error?)"; exit 1; }
          adb version | head -2
          echo "  ✓ native adb executes on $(uname -m)"

          echo "── Load binderfs + mount at /dev/binderfs ──"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs/
          # NOTE: redroid 16.0.0-latest auto-detects binderfs at /dev/binderfs
          # (issue redroid-doc #859). The /dev/binder char-device symlinks
          # we used in v4.0-v4.2 were a workaround for older tags (10-15)
          # that hard-coded /dev/binder; they're not needed for 16.0.0-latest.
          echo "  ✓ binderfs mounted"

          command -v docker >/dev/null || sudo apt-get install -y docker.io
          docker --version

      # ───────────────────────────────────────────────────────────────
      # Step: Pull + launch redroid (arm64-v8a, tag from input)
      # ───────────────────────────────────────────────────────────────
      - name: Pull + launch redroid
        env:
          REDROID_TAG: ${{ github.event.inputs.redroid_tag || '14.0.0-latest' }}
        run: |
          set -e
          mkdir -p /tmp/ui-e2e-artifacts
          echo "── Pulling redroid/redroid:$REDROID_TAG (arm64) ──"
          sudo docker pull "redroid/redroid:$REDROID_TAG"
          sudo docker run -itd --rm --privileged \
              --name redroid \
              -v /dev/binderfs:/dev/binderfs:rw \
              -v $HOME/redroid-data:/data \
              -p 5555:5555 \
              "redroid/redroid:$REDROID_TAG" \
              androidboot.use_memfd=1 \
              androidboot.redroid_gpu_mode=guest
          REDROID_PID=$(sudo docker inspect -f '{{.State.Pid}}' redroid)
          echo "  redroid container PID: $REDROID_PID"
          echo $REDROID_PID > /tmp/redroid.pid

          # Stream the container's full log from birth into the artifacts
          # (evidence for EVERY failure — v4.x only dumped logs on timeout).
          sudo docker logs -f redroid > /tmp/ui-e2e-artifacts/redroid.log 2>&1 &
          echo $! > /tmp/redroid-log.pid

          # Wait for boot_completed (up to 600s). adb = NATIVE arm64 build.
          BOOT_TIMEOUT=600
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              adb connect localhost:5555 >/dev/null 2>&1 || true
              BOOTED=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                  echo "  ✓ boot_completed after ${WAITED}s"
                  break
              fi
              if ! sudo docker ps --filter name=redroid --filter status=running | grep -q redroid; then
                  echo "  ✗ redroid container died after ${WAITED}s"
                  sudo docker logs redroid 2>&1 | tail -200
                  exit 1
              fi
              sleep 5
              WAITED=$((WAITED + 5))
              if [ $((WAITED % 60)) -eq 0 ]; then
                  echo "  still booting... ${WAITED}s elapsed"
                  # adb-independent progress (docker exec): framework state
                  SVC=$(sudo docker exec redroid getprop init.svc.zygote 2>/dev/null | tr -d '\r' || true)
                  PROC=$(sudo docker exec redroid sh -c "ps -A 2>/dev/null | grep -cE 'zygote|system_server|surfaceflinger'" 2>/dev/null || true)
                  PROP=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
                  echo "    boot_completed=$PROP  init.svc.zygote=$SVC  framework_procs=$PROC"
              fi
          done
          if [ "$WAITED" -ge "$BOOT_TIMEOUT" ]; then
              echo "  ✗ redroid did not boot in ${BOOT_TIMEOUT}s"
              echo "── redroid getprop (docker exec — adb-independent) ──"
              sudo docker exec redroid getprop 2>&1 | grep -E "boot_completed|init.svc|build.version|cpu.abi" | head -30 || true
              echo "── redroid processes (docker exec ps) ──"
              sudo docker exec redroid sh -c "ps -A 2>/dev/null" 2>&1 | head -40 || true
              echo "── redroid logcat tail (docker exec) ──"
              sudo docker exec redroid sh -c "logcat -d 2>/dev/null" 2>&1 | tail -300 || true
              echo "── docker logs tail ──"
              sudo docker logs redroid 2>&1 | tail -300
              exit 1
          fi

          # Defensive: verify the running redroid is actually arm64-v8a.
          ABI=$(adb -s localhost:5555 shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
          echo "  ro.product.cpu.abi = $ABI"
          if [ "$ABI" != "arm64-v8a" ]; then
              echo "  ✗ redroid ABI is '$ABI' — expected arm64-v8a. Aborting."
              exit 1
          fi
          SDK=$(adb -s localhost:5555 shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)
          echo "  ro.build.version.sdk = $SDK"
          echo "  ✓ redroid is arm64-v8a Android (no native bridge, no translation)"

      - name: Install APK + preload AOSP rootfs from redroid
        # Same flow as the x86_64 sibling — `adb root` works on redroid
        # (pure AOSP developer image), so we can `tar cf - system/ vendor/
        # init default.prop` directly.
        run: |
          set -ex
          ADB="adb -s localhost:5555"

          # Install the arm64-v8a DEBUGGABLE variant (io.twoyi.debug).
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "── Installing APK: $APK ──"
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"

          # ════════════════════════════════════════════════════════════
          # EXTRACT AOSP ROOTFS FROM THE RUNNING redroid CONTAINER
          # (same flow as ui-e2e-aosp.yml x86_64 — restored v2)
          # ════════════════════════════════════════════════════════════
          # redroid images accept `adb root` (pure AOSP developer
          # builds). /init is root-owned 0750 — shell-user tar skips
          # it. `adb root` lets tar see it. apex/ is EXCLUDED
          # (host-APEX passthrough handles /apex).
          adb -s localhost:5555 wait-for-device
          echo "── Switching adbd to root (redroid accepts it) ──"
          adb -s localhost:5555 root
          sleep 3
          adb -s localhost:5555 wait-for-device
          ADB_UID=$(adb -s localhost:5555 shell id -u 2>/dev/null | tr -d '\r' || true)
          echo "  adbd uid after adb root: $ADB_UID"
          if [ "$ADB_UID" != "0" ]; then
              echo "  ✗ adb root failed — redroid rejected it"
              exit 1
          fi

          echo "── Tarring the rootfs out of the booted redroid (system+vendor+init+default.prop — apex excluded) ──"
          adb -s localhost:5555 exec-out \
              "cd / && tar cf - system/ vendor/ init default.prop 2>/dev/null" \
              | gzip -1 > /tmp/profile_rootfs.tar.gz
          adb -s localhost:5555 unroot || true
          sleep 2
          adb -s localhost:5555 wait-for-device
          ls -la /tmp/profile_rootfs.tar.gz
          [ -s /tmp/profile_rootfs.tar.gz ] || { echo "✗ rootfs tar is empty"; exit 1; }
          gzip -t /tmp/profile_rootfs.tar.gz || { echo "✗ corrupt gzip"; exit 1; }
          $ADB push /tmp/profile_rootfs.tar.gz /sdcard/Download/ 2>&1 | tail -1

          # ── Preload into the app's private profile dir via run-as ────
          # The app only needs to have RUN ONCE for its data dir to exist.
          # monkey is flaky on redroid (run 32951496349: cold-launch exited
          # 251 and killed this step under set -e; the TWRP sibling saw
          # monkey fail to foreground the app entirely). Tolerate monkey
          # failing: retry via explicit am start, then VERIFY the data dir
          # exists via run-as — only that matters for the preload below.
          $ADB shell monkey -p io.twoyi.debug -c android.intent.category.LAUNCHER 1 || \
              echo "  (monkey exited nonzero — tolerated; retrying via am start)"
          sleep 4
          if ! $ADB shell "run-as io.twoyi.debug ls files >/dev/null 2>&1"; then
              echo "  data dir not created yet — am start fallback"
              $ADB shell am start -n io.twoyi.debug/io.twoyi.ui.SettingsActivity || true
              sleep 8
          fi
          if ! $ADB shell "run-as io.twoyi.debug ls files >/dev/null 2>&1"; then
              echo "  ✗ app data dir still missing after monkey + am start"
              exit 1
          fi
          echo "  ✓ app data dir exists (run-as works)"
          $ADB shell am force-stop io.twoyi.debug
          sleep 2

          $ADB shell "run-as io.twoyi.debug mkdir -p profiles/default/rootfs"
          $ADB shell "cat /sdcard/Download/profile_rootfs.tar.gz | run-as io.twoyi.debug tar -xz -C profiles/default/rootfs"
          $ADB shell "rm /sdcard/Download/profile_rootfs.tar.gz"

          # Normalize ownership + modes.
          $ADB shell "run-as io.twoyi.debug sh -c 'cd profiles/default/rootfs && chmod -R u+rwX,go+rX,go-w . 2>/dev/null; chmod -R u+x system/bin 2>/dev/null; chmod 0755 init system/bin/init 2>/dev/null; true'"
          echo "  ✓ normalized rootfs ownership/modes (dirs 755, files 644, exec bits on init + system/bin)"

          # Honest verification: the guest init must exist and be non-empty.
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/ | head -20"
          $ADB shell "run-as io.twoyi.debug sh -c 'test -L profiles/default/rootfs/init || test -f profiles/default/rootfs/init'" || {
              echo "✗ guest init (link or file) not found in rootfs"
              exit 1
          }
          $ADB shell "run-as io.twoyi.debug sh -c 'test -s profiles/default/rootfs/system/bin/init'" || {
              echo "  (warn) system/bin/init is missing or empty — checking if /init is a real file"
              $ADB shell "run-as io.twoyi.debug sh -c 'test -s profiles/default/rootfs/init'" || {
                  echo "✗ both /init and /system/bin/init are empty/missing"
                  exit 1
              }
          }
          echo "  ✓ init verified in rootfs"
          # Rewrite absolute /system|/apex|/vendor symlinks to relative.
          $ADB shell "run-as io.twoyi.debug sh -c 'cd profiles/default/rootfs && find . -type l | while read l; do t=\$(readlink "\$l"); case "\$t" in /system/*|/apex/*|/vendor/*) d=\$(dirname "\$l"); r=\$(realpath --relative-to="\$d" ".\$t" 2>/dev/null); [ -n "\$r" ] && ln -sfn "\$r" "\$l" 2>/dev/null;; esac; done; true'"
          echo "  ✓ rewrote absolute /system|/apex|/vendor symlinks to relative"
          # Free the stale rootfs/apex tree (host-APEX passthrough makes it dead weight).
          $ADB shell "run-as io.twoyi.debug sh -c 'rm -rf profiles/default/rootfs/apex; du -sh profiles/default/rootfs; df -h /data | tail -1'"
          echo "  ✓ freed the stale rootfs/apex tree"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/bin/linker64" || \
              echo "  (no linker64 in rootfs — this is FATAL for arm64 guest boot)"
          echo "  ✓ AOSP arm64 rootfs preloaded from the running redroid container"

          # SELinux compile input ground truth (same diagnostic block as x86_64 AOSP E2E).
          echo "── rootfs SELinux inputs ──"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/etc/selinux/ 2>&1 | head -25"
          echo "── rootfs SELinux mapping dir ──"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/system/etc/selinux/mapping/ 2>&1 | head -12"
          echo "── rootfs vendor selinux (CIL + vers + fstab) ──"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/vendor/etc/selinux/ 2>&1 | head -15"
          $ADB shell "run-as io.twoyi.debug ls -la profiles/default/rootfs/vendor/etc/fstab.ranchu 2>&1"
          echo "── redroid-side source files (shell-user view) ──"
          $ADB shell "ls -la /system/etc/selinux/plat_sepolicy.cil /vendor/etc/selinux/plat_sepolicy_vers.txt 2>&1"
          echo "── rootfs size + disk space ──"
          $ADB shell "run-as io.twoyi.debug du -sh profiles/default/rootfs 2>&1"
          $ADB shell "df -h /data 2>&1 | tail -2"

      - name: UI navigation — boot AOSP container
        env:
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '600' }}
          AOSP_PACKAGE: io.twoyi.debug
          ADB_SERIAL: localhost:5555
        run: |
          python3 scripts/ui-navigate-aosp.py

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ \
            || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-aosp-arm64-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Stop redroid
        if: always()
        run: |
          sudo docker stop redroid 2>/dev/null || true
          sudo docker rm   redroid 2>/dev/null || true
