#
# Runs `cargo fmt --check`, `cargo clippy -D warnings`, and the kr64 crate's
# unit tests on the host (linux/x86_64) so that formatting drift, clippy
# regressions, and test failures in the kernel-replacement daemon skeleton
# are all caught before they land on `main`. The crate is host-testable
# because its only dependency is `libc` and its `build.rs` (which compiles
# `interp.c`) works on any platform with a C compiler.
#
# The toolchain (channel + `rustfmt`/`clippy` components + Android targets)
# is pinned in `rust-toolchain.toml` at the repo root, so the CI toolchain
# matches every developer's local toolchain byte-for-byte.
---
name: kr64 lint + test

on:
  push:
    branches:
      - main
      - 'improvements/**'
  pull_request:
  # Allow manual runs for debugging without opening a PR.
  workflow_dispatch:

# Cancel any superseded run on the same ref.
concurrency:
  group: kr64-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # 6-Z462 (rn429, Task 197): the dispatch shim — the agent-side API
  # token rotates between sessions and the current one lacks
  # actions:write, so workflow-dispatch API calls 403 ("Must have admin
  # rights to Repository"). A push to main carrying the literal marker
  # `[boot-ladder]` in the HEAD commit message IS the dispatch: this
  # shim fires on that push (GITHUB_TOKEN here HAS actions:write) and
  # forwards the boot-ladder dispatch with confirm_dispatch=yes. The
  # anti-runaway gate stays explicit — the marker commit is the audit
  # trail (git history records exactly which push ordered the boot),
  # and the gated workflow's own input validation survives verbatim.
  # ════════════════════════════════════════════════════════════════
  dispatch-boot-ladder:
    name: forward boot-ladder dispatch (6-Z462)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[boot-ladder]')
    permissions:
      actions: write
      contents: read
    steps:
      - name: Forward workflow_dispatch to the boot ladder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "dispatch on behalf of head commit: ${GITHUB_SHA::7}"
          gh api "repos/${{ github.repository }}/actions/workflows/ui-e2e-android-arm64.yml/dispatches" \
            --input - <<'JSON'
          {"ref": "main", "inputs": {"confirm_dispatch": "yes", "expect_rung": "0", "boot_wait_seconds": "1800", "stall_seconds": "90", "import_wait_seconds": "300"}}
          JSON
          echo "boot ladder dispatched on main"

  test:
    name: fmt + clippy + test (kr64)
    runs-on: ubuntu-latest
    # 6-Z499 (rn472/473 era): the suite outgrew the 10-minute cap — the
    # unit-test step was cancelled mid-flight on 98bc2048 (#2113) and
    # 2d1c3fef (#2115) after fmt+clippy had already passed, so every
    # marker-commit validation since the ~1028-test mark silently lost
    # its test leg (the run verdict reads "cancelled", easy to misread
    # as the same-group dispatch race — it is the JOB TIMEOUT). 20
    # minutes gives the deterministic suite room; the shim job keeps
    # its own 2-minute cap.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The toolchain (channel, components, targets) is pinned in
          # `rust-toolchain.toml` at the repo root; this `toolchain: stable`
          # is just a fallback for forks that haven't pulled the file yet.
          toolchain: stable
          # Run on the host (linux/x86_64); no Android targets needed.
          cache: true
          # 6-Z419: point the vendored Swatinem/rust-cache at the REAL
          # workspace. A floating v1 bump (observed 2026-09-17: runs
          # 35216637144/35216720179 turned red between two pushes with
          # no workflow edit) made rust-cache probe `cargo metadata` at
          # the repo ROOT — which has no Cargo.toml (the workspace lives
          # at app/rs/kr64) — and the hard failure killed the job before
          # fmt/clippy/test ran. Forwarding `cache-workspaces` pins the
          # probe to the actual workspace directory.
          cache-workspaces: app/rs/kr64
          # Make CI failures easier to read.
          args: --component rustfmt --component clippy

      - name: Cache cargo registry & kr64 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/kr64/target
          key: ${{ runner.os }}-kr64-cargo-${{ hashFiles('app/rs/kr64/Cargo.toml', 'app/rs/kr64/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-kr64-cargo-

      - name: Verify formatting (rustfmt)
        # Fails the build if any file isn't `rustfmt`-clean. The setup step
        # above already installed the rustfmt component, so this is free.
        # `--check` writes nothing on success and a unified diff on failure.
        # `working-directory` points cargo at app/rs/kr64/Cargo.toml so it
        # doesn't abort with "could not find Cargo.toml" at the repo root.
        shell: bash
        working-directory: app/rs/kr64
        run: cargo fmt --check

      - name: Lint with clippy
        # Gate CI on the "0 clippy warnings" state that was painstakingly
        # reached in rounds 13–18. `-D warnings` turns every clippy warning
        # into a hard error so regressions can't sneak in through a PR.
        # `--all-targets` covers tests/benches/build-scripts too, not just
        # the lib/bin.
        shell: bash
        working-directory: app/rs/kr64
        run: cargo clippy --all-targets -- -D warnings

      - name: Run kr64 unit tests
        # `--no-fail-fast` so we see *every* failing test, not just the first.
        # `tee` mirrors the output to the GHA log *and* to a file we upload
        # as the test-results artifact. The default GHA bash shell already
        # has `set -eo pipefail`, so a non-zero `cargo test` exit code
        # propagates through the pipe and fails the step. `tee` writes
        # `cargo-test.log` into app/rs/kr64/ (the working-directory), which
        # is exactly the path the Pack-test-results step globs below.
        shell: bash
        working-directory: app/rs/kr64
        run: cargo test --no-fail-fast 2>&1 | tee cargo-test.log

      - name: Run loader mount-table C tests (6-Z214)
        # Host-compiled regression test for the loader's virtual mount
        # table — the SetupMountNamespaces /apex EBUSY blocker (OrangeFox
        # R12.1 lavender / Lineage 22.2 init, rounds r14-r25). mount_table.c
        # is portable C, so the host gcc is enough; no NDK required.
        shell: bash
        working-directory: app/cpp/twoyi_loader
        run: |
          gcc -D_GNU_SOURCE -I include -o /tmp/test_mount_table \
            test_mount_table.c src/mount_table.c
          /tmp/test_mount_table

      - name: Pack test results
        # Logs-only, xz-compressed, 7-day retention. See build.yml for
        # the storage-budget rationale (deleted 1217 old artifacts to
        # recover from 4.61 GB / 0.5 GB free tier).
        if: always()
        run: |
          # shellcheck disable=SC2086  # we WANT the glob to expand here
          ./scripts/pack-logs.sh /tmp/kr64-test-results.tar.xz \
            app/rs/kr64/cargo-test.log \
            app/rs/kr64/target/debug/.fingerprint/ \
            app/rs/kr64/target/debug/kr64*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr64-test-results
          path: /tmp/kr64-test-results.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
