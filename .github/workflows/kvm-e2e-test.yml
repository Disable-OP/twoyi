#
# End-to-end KVM test for twoyi on x86_64.
#
# Boots a real Android x86_64 emulator WITH hardware KVM acceleration
# on a GitHub-hosted ubuntu-latest runner (nested virtualization is
# supported), installs the twoyi APK, imports an x86_64 rootfs, then
# launches the container and captures logcat + screenshots as artifacts.
#
# This workflow is the project's only end-to-end functional test. The
# kr64 unit tests (kr64-tests.yml) verify the Rust skeleton in isolation;
# build.yml verifies the APK compiles. Only THIS workflow can answer
# "does the container actually boot?" — and as of the qemu_pipe proxy
# landing (commit 8dc63f4) it's the workflow that will catch the first
# successful boot whenever Phase 0 (full AOSP emugl renderer) ships.
#
# IMPORTANT: trigger is `workflow_dispatch` ONLY. There is NO `on: push`
# or `on: pull_request` trigger, by explicit user request, to preserve
# GitHub Actions usage minutes (each run takes ~20 min: ~10 min for
# cargo-xdk + APK build, ~5 min for emulator boot, ~5 min for the
# container launch + 60 s boot wait). Run it manually from the Actions
# tab when you want to verify a boot-related change.
#
# See scripts/kvm-e2e-test.sh for the actual test logic.
# See scripts/extract-rootfs.sh for the SDK-image rootfs extractor.
# See TESTING_GUIDE.md §3-5 for the manual version of this flow.
# See download/QEMU_PIPE_DISPATCHER_PLAN.md for the renderer roadmap
# (Phase 0 = full AOSP emugl; this test will go green when it lands).
---
name: KVM E2E Test

'on':
  workflow_dispatch:
    inputs:
      rootfs_source:
        description: 'Where to get the x86_64 rootfs'
        type: choice
        required: false
        default: 'emulator'
        options:
          - emulator
          - sdk_image
          - cyanmint
      boot_wait_seconds:
        description: 'How long to wait for the container to boot (seconds) before capturing the final screenshot + logcat'
        required: false
        default: '60'
      abis:
        description: 'Comma-separated ABIs to build the APK for (x86_64 is required for this test; arm64-v8a is ignored)'
        required: false
        default: 'x86_64'

# Cancel any superseded manual run on the same ref. Manual dispatches
# are rare (you'd typically only run this when investigating a boot
# regression), so cancellation matters less than for push-triggered
# workflows — but it's still cheap insurance against double-clicks.
concurrency:
  group: kvm-e2e-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvm-e2e-test:
    name: Boot emulator + launch twoyi
    runs-on: ubuntu-latest
    # The whole flow: cargo-xdk install (~3 min) + APK build (~7 min)
    # + emulator boot (~3 min) + rootfs extract (~2 min) + container
    # launch + boot_wait_seconds + artifact upload (~2 min) =
    # ~20 min on a quiet runner. 30 min leaves headroom for a slow
    # first run (no caches).
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub-hosted ubuntu-latest runners DO have nested virtualization
      # enabled (the kvm group exists and /dev/kvm is created by the
      # kernel). This step just makes /dev/kvm world-read-write so the
      # emulator (running as the runner user, not root) can access it.
      # If /dev/kvm doesn't exist at all, we attempt to modprobe kvm +
      # kvm_intel and mknod the device node manually — that's the same
      # recovery flow .devcontainer/scripts/setup.sh uses for codespaces.
      - name: Enable KVM access
        run: |
          set -u
          echo "── KVM availability ──"
          if [ -e /dev/kvm ]; then
              echo "  /dev/kvm exists"
          else
              echo "  /dev/kvm does NOT exist — trying modprobe + mknod"
              sudo modprobe kvm 2>/dev/null || true
              sudo modprobe kvm_intel 2>/dev/null || true
              sudo modprobe kvm_amd 2>/dev/null || true
              sudo mknod /dev/kvm c 10 232 2>/dev/null || true
          fi
          # udev rule so the perms stick even if udev re-triggers
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
          # Quick functional check: if we can read the KVM API version,
          # KVM actually works (not just that the device node exists).
          if [ -r /dev/kvm ]; then
              # A tiny C probe would be more thorough, but the emulator
              # itself does the real KVM_RUN probe. Just verify the
              # device is openable.
              if sudo dd if=/dev/kvm of=/dev/null bs=1 count=0 2>/dev/null; then
                  echo "  ✓ /dev/kvm is openable"
              fi
          else
              echo "  ✗ /dev/kvm is NOT readable — emulator will fall back to TCG (slow)"
              echo "    The test will still run, but emulator boot may time out."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        # Same setup as build.yml — see that file for the cache: false
        # rationale (cargo metadata fails because there's no Cargo.toml
        # at the repo root). We only need the x86_64 Android target
        # here, not arm64, because this workflow only builds x86_64.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        # Same action + version pin as build.yml — see the long comment
        # in build.yml for why nttld/setup-ndk@v1 (NOT @v2, which doesn't
        # exist) is the right choice.
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      # We install the Android SDK manually with sdkmanager rather than
      # via android-actions/setup-android@v3 because the emulator +
      # system-image packages are large (~1.5 GB combined) and the
      # android-actions action doesn't expose a way to pre-install them
      # in the same step that installs cmdline-tools. Doing it manually
      # also means the cache key can be specific to the system-image
      # version, so we don't re-download 600 MB on every run.
      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: ${{ runner.os }}-sdk-android30-google_apis-x86_64-v2

      - name: Install Android SDK + emulator + system image
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd /tmp
              CMDLINE_TOOLS_URL='https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
              curl -sL -o cmdline-tools.zip "$CMDLINE_TOOLS_URL"
              unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --update
          sdkmanager \
              "platform-tools" \
              "platforms;android-30" \
              "build-tools;30.0.3" \
              "emulator" \
              "system-images;android-30;google_apis;x86_64"
          echo "✓ SDK + emulator + system image installed"

      - name: Create x86_64 AVD with KVM + swiftshader GPU
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -ex
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          # Make sure the AVD directory exists — avdmanager won't create
          # ~/.android/avd/ itself in some SDK versions, which causes the
          # subsequent config.ini append to fail with "No such file or
          # directory".
          mkdir -p ~/.android/avd

          # Find the avdmanager binary. The cmdline-tools install step
          # above puts it at cmdline-tools/latest/bin/avdmanager, but the
          # pre-installed GitHub runner SDK might also have one at
          # cmdline-tools/<version>/bin/avdmanager. Prefer the latest.
          AVDMGR="$(command -v avdmanager 2>/dev/null || true)"
          if [ -z "$AVDMGR" ] || [ ! -x "$AVDMGR" ]; then
            # Walk cmdline-tools/* to find avdmanager
            for d in "$ANDROID_HOME"/cmdline-tools/*/; do
              if [ -x "${d}bin/avdmanager" ]; then
                AVDMGR="${d}bin/avdmanager"
                break
              fi
            done
          fi
          if [ -z "$AVDMGR" ] || [ ! -x "$AVDMGR" ]; then
            echo "✗ avdmanager not found"
            ls -la "$ANDROID_HOME/cmdline-tools/" 2>&1 || true
            exit 1
          fi
          echo "avdmanager: $AVDMGR"

          # Create the AVD. We use `printf "no\n"` to answer "no" to the
          # "Do you wish to create a custom hardware profile?" prompt.
          # We omit -d (device) because the pixel_5 device profile isn't
          # always available; avdmanager will use a generic profile by
          # default, which is fine for our headless testing.
          printf "no\n" | "$AVDMGR" create avd \
              -n twoyi_test \
              -k "system-images;android-30;google_apis;x86_64" \
              --force

          # Verify the AVD was actually created.
          AVD_CONFIG=~/.android/avd/twoyi_test.avd/config.ini
          if [ ! -f "$AVD_CONFIG" ]; then
            echo "✗ AVD config.ini not found at $AVD_CONFIG"
            echo "  avdmanager output above. Listing ~/.android/avd/:"
            ls -laR ~/.android/avd/ 2>&1 || true
            exit 1
          fi
          echo "✓ AVD created at $AVD_CONFIG"

          # AVD config tweaks:
          #  - hw.keyboard=yes      : allow `adb shell input text` to work
          #  - hw.gpu.enabled=yes   : enable GPU emulation (required for
          #                          twoyi's renderer to get a Surface)
          #  - hw.gpu.mode=host     : use host GPU emulation; combined
          #                          with -gpu swiftshader_indirect on
          #                          the emulator CLI this gives us
          #                          software rendering that works headless
          #  - hw.ramSize=2048      : 2 GB is enough for Android 11
          #                          system-image boot + twoyi
          #  - disk.dataPartition.size=4096 : room for the rootfs extract
          {
              echo "hw.keyboard=yes"
              echo "hw.gpu.enabled=yes"
              echo "hw.gpu.mode=host"
              echo "hw.ramSize=2048"
              echo "disk.dataPartition.size=4096"
              echo "vm.heapSize=256"
          } >> "$AVD_CONFIG"
          echo "── AVD config.ini ──"
          cat "$AVD_CONFIG"

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true
          chmod +x scripts/kvm-e2e-test.sh
          chmod +x scripts/extract-rootfs.sh 2>/dev/null || true

      - name: Build APK (x86_64 only)
        # Same build invocation as build.yml, restricted to x86_64 since
        # this workflow only tests on an x86_64 emulator. Skipping
        # arm64-v8a saves ~5 min of cargo-xdk build time.
        run: ./gradlew assembleRelease -Pabis=x86_64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      # Run the actual E2E test. The script handles:
      #   - booting the emulator (headless, KVM, swiftshader)
      #   - waiting for boot_completed
      #   - installing the APK
      #   - extracting an x86_64 rootfs (default: from the running
      #     emulator per X86_64_BREAKTHROUGH.md; alternatives: SDK
      #     system.img, or cyanmint's arm64 rootfs as a smoke test)
      #   - pushing the rootfs into twoyi's data dir
      #   - launching the container + capturing logcat + screenshots
      # The script never returns non-zero on a twoyi boot failure — it
      # always returns 0 so artifacts get uploaded. Boot verdict is
      # written to /tmp/ci-artifacts/boot-verdict.txt for the next
      # step to grep.
      - name: Run E2E test
        run: |
          ./scripts/kvm-e2e-test.sh \
              --rootfs-source "${{ github.event.inputs.rootfs_source || 'emulator' }}" \
              --boot-wait "${{ github.event.inputs.boot_wait_seconds || '60' }}" \
              --artifact-dir /tmp/ci-artifacts
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Print boot verdict
        # The script writes a verdict file. We surface it in the GHA
        # log so a glance at the run tells you whether twoyi booted
        # without having to download the artifacts. We DON'T fail
        # the workflow on boot failure (yet) — see the note in the
        # script header about Phase 0 not being done.
        run: |
          echo "── twoyi boot verdict ──"
          if [ -f /tmp/ci-artifacts/boot-verdict.txt ]; then
              cat /tmp/ci-artifacts/boot-verdict.txt
          else
              echo "  (no verdict file — script may have crashed early; see logs above)"
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-apk-x86_64
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-logcat
          path: |
            /tmp/ci-artifacts/logcat.txt
            /tmp/ci-artifacts/logcat-*.txt
            /tmp/ci-artifacts/boot-verdict.txt
            /tmp/ci-artifacts/emulator-stdout.log
            /tmp/ci-artifacts/emulator-stderr.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-screenshots
          path: /tmp/ci-artifacts/screenshot-*.png
          retention-days: 30
          if-no-files-found: warn

      - name: Upload crash logs / tombstones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-crash-logs
          path: |
            /tmp/ci-artifacts/tombstones/
            /tmp/ci-artifacts/dropbox/
            /tmp/ci-artifacts/anr/
            /tmp/ci-artifacts/rootfs-extract.log
          retention-days: 30
          if-no-files-found: ignore
