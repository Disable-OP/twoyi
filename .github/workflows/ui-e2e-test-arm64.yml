# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# ARM64 UI-only end-to-end test for twoyi (TWRP boot).
#
# Goal: reach parity with ui-e2e-test.yml (x86_64), but exercising the
# arm64-v8a build of twoyi's native libraries (libtwoyi.so,
# libOpenglRender.so, libloader.so, kr64) so that arm64-specific code
# paths in the Rust tracer and C++ loader get CI coverage.
#
# Architecture (v4 — switched to redroid after v1/v2/v3 all failed):
#   - redroid is a containerised REAL Android user space. It runs
#     Android as native arm64 Linux processes on the host kernel — NO
#     QEMU, NO KVM, NO TCG translation, NO native bridge. The Android
#     processes (init, zygote, system_server, surfaceflinger, app
#     processes) are regular Linux tasks visible to the host kernel.
#     This means:
#       * Real ARM64 ptrace ABI (struct user_pt_regs, iov_len == 272)
#         — the WHOLE POINT of this workflow.
#       * Near-native speed (no JIT translation overhead).
#       * ADB over TCP port 5555.
#       * Standard Android screencap (no custom framebuffer plumbing).
#   - The runner is GitHub's `ubuntu-24.04-arm` (aarch64 Ampere
#     hardware, Ubuntu 24.04 LTS). Its kernel (linux-azure 6.17) ships
#     `binder_linux.ko` as a loadable module in the
#     `linux-modules-extra-$(uname -r)` apt package — NOT preinstalled
#     but installable in ~5 seconds. Modern redroid uses `memfd`
#     instead of the removed `ashmem` Linux 5.18+ module.
#   - The twoyi APK is built for arm64-v8a ONLY and runs NATIVELY on
#     redroid (no translation layer, no native bridge).
#   - The TWRP recovery image is the arm64 `angler` (Nexus 6P) image
#     downloaded fresh each run from dl.twrp.me — its ramdisk's init
#     binary is a real aarch64 ELF, ptrace'd natively by twoyi's
#     arm64-v8a tracer.
#
# Why v4 (redroid) replaced v3 (x86_64 runner + arm64-v8a system image):
#   v3 tried `sdkmanager "emulator"` on ubuntu-24.04-arm to install an
#   arm64 Android emulator binary. This permanently fails because Google
#   does NOT publish an aarch64 Linux binary for the `emulator` package
#   via sdkmanager — only `emulator-linux_x64-*.zip` exists in the
#   repository2-3.xml. See runs 32901106471 (v1) + 32901574547 (v2) +
#   the blocker report at download/arm64-emulator-blocker-report.md.
#
# Why v4 splits the workflow into TWO JOBS (build on x86_64, test on arm64):
#   The Android NDK r27c ships ONLY x86_64 Linux host binaries — there
#   is NO aarch64 Linux NDK host variant. On the arm64 runner, clang
#   /clang++/ld.lld/llvm-ar from the NDK are x86_64 ELF binaries that
#   the kernel cannot execute (no binfmt_misc registered for x86_64
#   on ubuntu-24.04-arm). The first run (32939627038) failed with:
#     /home/runner/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/clang: 1: Syntax error: "(" unexpected
#   Workarounds considered:
#     (a) `apt install qemu-user-static binfmt-support` + register the
#         x86_64 ELF binfmt_misc handler — would work but with a 5-10x
#         slowdown on every clang invocation; the Rust+C++ Twoyi build
#         takes ~10 min on native x86_64 → ~50-100 min via qemu, blowing
#         past the 60-min job timeout.
#     (b) Build the APK on an x86_64 runner (where the NDK is native)
#         and download it on the arm64 runner. This is the chosen
#         approach — it's also how Google's own android emulator images
#         are built for CI (cross-compile on x86_64, deploy on arm64).
#
# What this tests that ui-e2e-test.yml (x86_64) does NOT:
#   - The arm64-v8a build of twoyi's Rust + C++ code actually links and
#     loads under a real arm64 Android runtime.
#   - The ptrace tracer's aarch64 struct layouts, syscall numbers, and
#     register handling get exercised end-to-end with a real arm64 guest.
#   - The fork+exec path in libtwoyi_loader_shlib.so works when the
#     guest ELF is a real arm64 binary (not native-bridge-translated).
#
# Differences from ui-e2e-test.yml (x86_64):
#   - TWO JOBS: build-apk (ubuntu-latest/x86_64) → e2e (ubuntu-24.04-arm).
#     The x86_64 sibling is a single job because it can build + test
#     natively on the same runner.
#   - Android runtime: redroid Docker container (NOT the sdk emulator).
#     Image: redroid/redroid:16.0.0-latest (Android 16 = API 36, the
#     same version as the x86_64 sibling for apples-to-apples parity).
#   - Runner: ubuntu-24.04-arm (arm64 Ampere hardware, NO /dev/kvm
#     but redroid doesn't need it — Android runs as host processes).
#   - Boot accelerator: NONE needed — redroid boots in ~30-60s as
#     native processes on the host CPU.
#   - ADB serial: `localhost:5555` (TCP) instead of `emulator-5554`
#     (qemud). ui-navigate.py picks this up from the ADB_SERIAL env
#     var; the x86_64 default `emulator-5554` is preserved.
#   - Setup: install `linux-modules-extra-$(uname -r)` apt package
#     (provides binder_linux.ko) + modprobe + mount binderfs + start
#     the redroid container with `docker run`.
#   - Cleanup: `docker stop redroid` (instead of `adb emu kill`).
#   - Job timeout: 60 min for the e2e job (vs 30 min — extra slack
#     for first-run docker pull of the ~800MB redroid image).
#   - TWRP image: arm64 `angler` image downloaded at runtime (NOT the
#     committed x86 byt_t_crv2 image in assets/twrp/).
#   - ui-navigate.py's post-Launch-Container + final assertions abort
#     the script (exit 1) if the app crashed back to launcher (the
#     bug that produced the false-green v1 run 32886902337).
#
# v5 (native-adb fix): v4.x installed the SDK platform-tools via
# sdkmanager — but that adb is an x86_64 ELF. Every later step exported
# PATH="$ANDROID_HOME/platform-tools:$PATH", shadowing the NATIVE
# arm64 adb from android-tools-adb. Result (run 32942686027): ALL adb
# calls died with "cannot execute binary file: Exec format error" —
# the 600s boot wait polled a dead adb while Android inside redroid
# was actually booting (all HAL services up, zygote preloading).
# v5 DELETES the sdkmanager platform-tools step entirely: the ONLY adb
# on PATH is Ubuntu's native arm64 android-tools-adb, enforced by an
# adb-version sanity gate before the container starts.
# v5 also parameterizes the redroid tag (input redroid_tag, default
# 14.0.0-latest — the research-verified actively-pulled arm64 image;
# 16.0.0-latest showed a zygote restart loop and can be A/B-tested via
# the input without a commit), streams `docker logs -f` into the
# artifacts from container start, and adds adb-independent container
# diagnostics (docker exec getprop/ps/logcat) on every progress tick.
---
name: UI E2E Test (ARM64 via redroid on ubuntu-24.04-arm)

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for the TWRP container to boot before capturing the final screenshot (seconds)'
        required: false
        default: '30'
      redroid_tag:
        description: 'redroid Docker image tag (arm64): 14.0.0-latest, 16.0.0-latest, 13.0.0-latest, 11.0.0-latest ...'
        required: false
        default: '14.0.0-latest'
      recovery_name:
        description: 'Label for the recovery image under test (used in logs). Default: TWRP 3.7.0_9-0 angler'
        required: false
        default: 'twrp-3.7.0_9-0-angler'
      recovery_url:
        description: 'Direct URL of an arm64 recovery .img (Android boot image). Empty = built-in TWRP angler download. Works for OrangeFox / PitchBlack / SHRP / other TWRP builds'
        required: false
        default: ''
      recovery_referer:
        description: 'Optional Referer header for the download (dl.twrp.me anti-leech needs it; SourceForge/GitHub do not)'
        required: false
        default: ''
      recovery_md5:
        description: 'Optional md5 to verify the downloaded image. Empty = skip verification'
        required: false
        default: ''
      redroid_resolution:
        description: 'Native resolution for the redroid Android display as WxH (e.g. 720x1600). auto = redroid default. The TWRP container auto-matches this via the app detection + TWOYI_FB_* env — no hardcoded dims'
        required: false
        default: '720x1600'
      redroid_dpi:
        description: 'Native density for the redroid Android display (dpi). Only used when redroid_resolution is set'
        required: false
        default: '320'

concurrency:
  # Per-recovery group: different recovery images (recovery_name input)
  # run IN PARALLEL — dispatching the OrangeFox matrix run must NOT
  # cancel an in-progress TWRP-angler run. Re-dispatching the SAME
  # recovery still cancels its previous run (same as before).
  group: ui-e2e-test-arm64-${{ github.ref }}-${{ github.event.inputs.recovery_name || 'twrp-3.7.0_9-0-angler' }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1: Build the arm64-v8a APK on an x86_64 runner
  # (NDK r27c only ships x86_64 Linux binaries; running clang on
  # arm64 host without binfmt_misc fails with "Syntax error: (")
  # ════════════════════════════════════════════════════════════════
  build-apk:
    name: Build arm64-v8a APK (x86_64 runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (debuggable variant, arm64-v8a only)
        run: ./gradlew assembleDebuggable -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: app/build/outputs/apk/debuggable/*.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # ════════════════════════════════════════════════════════════════
  # JOB 2: Run the redroid-based E2E on the arm64 runner
  # ════════════════════════════════════════════════════════════════
  ui-e2e-test-arm64:
    name: UI-only ARM64 (TWRP) E2E on redroid (arm64 runner)
    needs: build-apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built arm64-v8a APK
        uses: actions/download-artifact@v4
        with:
          name: arm64-v8a-apk
          path: app/build/outputs/apk/debuggable/

      - name: Verify APK architecture (arm64-v8a present)
        # Defensive: confirm the APK actually contains arm64-v8a libs.
        # If the build step silently produced an x86_64-only APK (e.g.,
        # the -Pabis flag was ignored), redroid would fail to install
        # with INSTALL_FAILED_NO_MATCHING_ABIS.
        # NOTE: the APK may ALSO contain x86_64 libs because the C++
        # build.gradle hardcodes abiFilters "arm64-v8a", "x86_64" for
        # the CMake side. That's fine — redroid is arm64-v8a and will
        # pick up the arm64-v8a side. Only the Rust build (cargo-xdk
        # with -Pabis=arm64-v8a) restricts the ABI; the C++ side keeps
        # both. We just verify arm64-v8a exists.
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/.*\.so" || { echo "✗ no native libs in APK"; exit 1; }
          echo "── arm64-v8a libs in APK ──"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/" || { echo "✗ APK has no arm64-v8a libs — build step is broken"; exit 1; }
          ARM64_COUNT=$(unzip -l "$APK" | grep -cE "lib/arm64-v8a/" || true)
          echo "  ✓ APK contains $ARM64_COUNT arm64-v8a libs (redroid will use this ABI)"

      # ───────────────────────────────────────────────────────────────
      # Step: Provision redroid prerequisites
      # ───────────────────────────────────────────────────────────────
      - name: Provision redroid prerequisites (binderfs + adb)
        run: |
          set -e
          echo "── Runner architecture ──"
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
              echo "  ✗ Runner is $(uname -m), expected aarch64. ubuntu-24.04-arm required."
              exit 1
          fi
          echo "  ✓ Running on aarch64 hardware"

          echo "── Install kernel modules + native arm64 adb ──"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              linux-modules-extra-$(uname -r) \
              android-tools-adb

          echo "── adb sanity gate (v5) ──"
          # The ONLY adb on PATH must be Ubuntu's NATIVE arm64 build.
          # The v4.x failure mode (sdkmanager's x86_64 adb shadowing it)
          # surfaces here as 'Exec format error' — fail fast, not 600s later.
          command -v adb || { echo "✗ adb not found on PATH"; exit 1; }
          adb version || { echo "✗ adb is not executable on aarch64 (Exec format error?)"; exit 1; }
          adb version | head -2
          echo "  ✓ native adb executes on $(uname -m)"

          echo "── Load binderfs + mount at /dev/binderfs ──"
          # modprobe binderfs (provides binderfs + the binder,hwbinder,vndbinder
          # char devices — these auto-appear inside the binderfs mount).
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs/
          # NOTE: redroid 16.0.0-latest auto-detects binderfs at /dev/binderfs
          # (issue redroid-doc #859). The /dev/binder char-device symlinks
          # we used in v4.0-v4.2 were a workaround for older tags (10-15)
          # that hard-coded /dev/binder; they're not needed for 16.0.0-latest.
          echo "  ✓ binderfs mounted"

          command -v docker >/dev/null || sudo apt-get install -y docker.io
          docker --version

      - name: "Download arm64 recovery image (default: TWRP 3.7.0_9-0 angler)"
        # Default path: dl.twrp.me serves the .img with a referer-based
        # anti-leech check; without `-e` (Referer) the response is the
        # HTML landing page (~6.8KB) instead of the ~17MB binary image.
        # The angler image is the smallest verified-arm64 bootable TWRP
        # in TWRP 3.7.0_9-0 (same version as the existing x86 byt_t_crv2).
        # sha256: 21e41c0607b150f8dc5e5a4b0975a64d1eb62c4aff34920231d027e0793e8028
        # md5:    cf9a9067d18f64ed6992514826e1f9df
        # Multi-recovery matrix: recovery_url/recovery_referer/recovery_md5
        # inputs override the default — any arm64 Android-boot-image
        # recovery (other TWRP devices, OrangeFox, PitchBlack, SHRP ...)
        # can be A/B-tested without commits. Everything is normalised to
        # /tmp/twrp-arm64/recovery.img for the later steps.
        env:
          RECOVERY_NAME: ${{ github.event.inputs.recovery_name || 'twrp-3.7.0_9-0-angler' }}
          RECOVERY_URL: ${{ github.event.inputs.recovery_url }}
          RECOVERY_REFERER: ${{ github.event.inputs.recovery_referer }}
          RECOVERY_MD5: ${{ github.event.inputs.recovery_md5 }}
        run: |
          set -e
          mkdir -p /tmp/twrp-arm64
          cd /tmp/twrp-arm64
          if [ -n "$RECOVERY_URL" ]; then
            echo "── Downloading recovery image: $RECOVERY_NAME from $RECOVERY_URL ──"
            REFERER_ARGS=""
            if [ -n "$RECOVERY_REFERER" ]; then
              REFERER_ARGS="-e $RECOVERY_REFERER"
            fi
            # -L follows mirrors (SourceForge redirects); --retry for CDN flakes.
            curl -fL --retry 3 -A "Mozilla/5.0" $REFERER_ARGS \
                -o download.img \
                "$RECOVERY_URL"
          else
            echo "── Downloading default recovery image: TWRP 3.7.0_9-0 angler ──"
            curl -fL --retry 3 -A "Mozilla/5.0" \
                -e "https://dl.twrp.me/angler/twrp-3.7.0_9-0-angler.img.html" \
                -o download.img \
                "https://dl.twrp.me/angler/twrp-3.7.0_9-0-angler.img"
          fi
          if [ -n "$RECOVERY_MD5" ]; then
            echo "$RECOVERY_MD5  download.img" | md5sum -c -
          else
            echo "  (md5 verification skipped — no recovery_md5 input)"
          fi
          # Sanity: must be an Android boot image (magic "ANDROID!"), a
          # sparse/ext4 image, or a zip containing one. Fail fast here —
          # NOT 10 minutes later inside the guest.
          MAGIC=$(head -c 8 download.img)
          if [ "$MAGIC" = "ANDROID!" ]; then
            echo "  ✓ Android boot image magic (ANDROID!)"
          elif head -c 4 download.img | grep -q "PK"; then
            echo "  ⚠ zip file — extracting recovery.img if present"
            # PBRP zips nest it at TWRP/recovery.img; OrangeFox/SHRP
            # installer zips keep it at the top level or in a subdir.
            # -j flattens; try top-level first, then any subdir.
            unzip -o -j download.img 'recovery.img' -d . \
              || unzip -o -j download.img '*/recovery.img' -d . \
              || { echo "✗ zip contains no recovery.img"; exit 1; }
            MAGIC2=$(head -c 8 recovery.img)
            [ "$MAGIC2" = "ANDROID!" ] || { echo "✗ extracted file is not an Android boot image"; exit 1; }
            mv recovery.img download.img
            echo "  ✓ extracted Android boot image from zip"
          else
            echo "✗ not an Android boot image and not a zip (magic: $MAGIC)"; exit 1
          fi
          mv download.img recovery.img
          ls -lh recovery.img
          file recovery.img || true

      # ───────────────────────────────────────────────────────────────
      # Step: Pull + launch redroid (arm64-v8a, tag from input)
      # ───────────────────────────────────────────────────────────────
      - name: Pull + launch redroid
        env:
          REDROID_TAG: ${{ github.event.inputs.redroid_tag || '14.0.0-latest' }}
          REDROID_RESOLUTION: ${{ github.event.inputs.redroid_resolution || '720x1600' }}
          REDROID_DPI: ${{ github.event.inputs.redroid_dpi || '320' }}
        run: |
          set -e
          mkdir -p /tmp/ui-e2e-artifacts

          # ── Native resolution (6-Z171b) ──────────────────────────────
          # The user-facing goal: BOTH the Android (redroid) display and
          # the TWRP container run at ONE resolution — the native one —
          # instead of independent hardcodes. Here we CONFIGURE the
          # Android side (androidboot.redroid_width/height/dpi). The TWRP
          # side needs no configuration at all: the app auto-detects the
          # display via DisplayMetrics, passes it through renderer_init ->
          # core.rs --width/--height -> kr64, which sizes the fb0 file AND
          # exports TWOYI_FB_WIDTH/TWOYI_FB_HEIGHT to the TWRP child, whose
          # hook synthesizes matching FBIOGET_VSCREENINFO/FSCREENINFO.
          RES_ARGS=""
          if [ "$REDROID_RESOLUTION" != "auto" ] && echo "$REDROID_RESOLUTION" | grep -qE '^[0-9]+x[0-9]+$'; then
              W=$(echo "$REDROID_RESOLUTION" | cut -dx -f1)
              H=$(echo "$REDROID_RESOLUTION" | cut -dx -f2)
              RES_ARGS="androidboot.redroid_width=$W androidboot.redroid_height=$H androidboot.redroid_dpi=$REDROID_DPI"
              echo "  native resolution requested: ${W}x${H}@${REDROID_DPI}dpi"
          else
              echo "  native resolution: auto (redroid default 320x640)"
          fi
          echo "$REDROID_RESOLUTION" > /tmp/ui-e2e-artifacts/requested-resolution.txt

          echo "── Pulling redroid/redroid:$REDROID_TAG (arm64) ──"
          sudo docker pull "redroid/redroid:$REDROID_TAG"
          sudo docker run -itd --rm --privileged \
              --name redroid \
              -v /dev/binderfs:/dev/binderfs:rw \
              -v $HOME/redroid-data:/data \
              -p 5555:5555 \
              "redroid/redroid:$REDROID_TAG" \
              androidboot.use_memfd=1 \
              androidboot.redroid_gpu_mode=guest \
              $RES_ARGS
          REDROID_PID=$(sudo docker inspect -f '{{.State.Pid}}' redroid)
          echo "  redroid container PID: $REDROID_PID"
          echo $REDROID_PID > /tmp/redroid.pid

          # Stream the container's full log from birth into the artifacts
          # (evidence for EVERY failure — v4.x only dumped logs on timeout).
          sudo docker logs -f redroid > /tmp/ui-e2e-artifacts/redroid.log 2>&1 &
          echo $! > /tmp/redroid-log.pid

          # Wait for boot_completed (up to 120s — redroid 14 boots in
          # ~5s on arm64; 120 is a generous cap, loop exits early).
          # adb = NATIVE arm64 build.
          BOOT_TIMEOUT=120
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              adb connect localhost:5555 >/dev/null 2>&1 || true
              BOOTED=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                  echo "  ✓ boot_completed after ${WAITED}s"
                  break
              fi
              if ! sudo docker ps --filter name=redroid --filter status=running | grep -q redroid; then
                  echo "  ✗ redroid container died after ${WAITED}s"
                  sudo docker logs redroid 2>&1 | tail -200
                  exit 1
              fi
              sleep 5
              WAITED=$((WAITED + 5))
              if [ $((WAITED % 60)) -eq 0 ]; then
                  echo "  still booting... ${WAITED}s elapsed"
                  # adb-independent progress (docker exec): framework state
                  SVC=$(sudo docker exec redroid getprop init.svc.zygote 2>/dev/null | tr -d '\r' || true)
                  PROC=$(sudo docker exec redroid sh -c "ps -A 2>/dev/null | grep -cE 'zygote|system_server|surfaceflinger'" 2>/dev/null || true)
                  PROP=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
                  echo "    boot_completed=$PROP  init.svc.zygote=$SVC  framework_procs=$PROC"
              fi
          done
          if [ "$WAITED" -ge "$BOOT_TIMEOUT" ]; then
              echo "  ✗ redroid did not boot in ${BOOT_TIMEOUT}s"
              echo "── redroid getprop (docker exec — adb-independent) ──"
              sudo docker exec redroid getprop 2>&1 | grep -E "boot_completed|init.svc|build.version|cpu.abi" | head -30 || true
              echo "── redroid processes (docker exec ps) ──"
              sudo docker exec redroid sh -c "ps -A 2>/dev/null" 2>&1 | head -40 || true
              echo "── redroid logcat tail (docker exec) ──"
              sudo docker exec redroid sh -c "logcat -d 2>/dev/null" 2>&1 | tail -300 || true
              echo "── docker logs tail ──"
              sudo docker logs redroid 2>&1 | tail -300
              exit 1
          fi

          # Defensive: verify the running redroid is actually arm64-v8a.
          ABI=$(adb -s localhost:5555 shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
          echo "  ro.product.cpu.abi = $ABI"
          if [ "$ABI" != "arm64-v8a" ]; then
              echo "  ✗ redroid ABI is '$ABI' — expected arm64-v8a. Aborting."
              exit 1
          fi
          SDK=$(adb -s localhost:5555 shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)
          echo "  ro.build.version.sdk = $SDK"
          echo "  ✓ redroid is arm64-v8a Android (no native bridge, no translation)"

          # ── Ground truth: the ACTUAL native display resolution ──────
          # This is the single source of truth the whole chain must match:
          # app auto-detect (DisplayMetrics) == wm size; TWRP container
          # (fb0 size + TWOYI_FB_* env) follows the app. Recorded to the
          # artifacts so every run's analysis starts from measured truth.
          WM_SIZE=$(adb -s localhost:5555 shell wm size 2>/dev/null | tr -d '\r' || true)
          WM_DENSITY=$(adb -s localhost:5555 shell wm density 2>/dev/null | tr -d '\r' || true)
          echo "── Native display ground truth ──"
          echo "$WM_SIZE"; echo "$WM_DENSITY"
          {
              echo "$WM_SIZE"
              echo "$WM_DENSITY"
              adb -s localhost:5555 shell dumpsys window displays 2>/dev/null | grep -E "init|cur|app" | head -6 || true
          } > /tmp/ui-e2e-artifacts/native-display.txt
          if [ "$REDROID_RESOLUTION" != "auto" ]; then
              W=$(echo "$REDROID_RESOLUTION" | cut -dx -f1)
              H=$(echo "$REDROID_RESOLUTION" | cut -dx -f2)
              if ! echo "$WM_SIZE" | grep -q "${W}x${H}"; then
                  echo "  ⚠ wm size does not contain the requested ${W}x${H} — continuing, but the TWRP container will follow whatever Android reports"
              else
                  echo "  ✓ native resolution confirmed: ${W}x${H}"
              fi
          fi

      - name: Install APK + push arm64 TWRP recovery.img
        run: |
          set -e
          ADB="adb -s localhost:5555"

          # v5.3: kill the SystemUI immersive-mode confirmation popup
          # ("Viewing full screen / To exit, swipe down from the top /
          # GOT IT"). Run 32952695067: this popup + the app's Android-12
          # dialog blocked bootSystem() for the ENTIRE 600s wait. The
          # app-side dialog is removed at the source; this settings put
          # prevents SystemUI from ever showing the confirmation.
          $ADB shell settings put global immersive_mode_confirmations confirmed
          echo "  ✓ immersive_mode_confirmations=confirmed"

          # arm64-v8a APK on arm64-v8a redroid → ABI matches natively.
          # If this fails with INSTALL_FAILED_NO_MATCHING_ABIS, redroid
          # isn't actually arm64-v8a (check the verify step above) or
          # the APK was built for the wrong ABI.
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "── Installing APK: $APK ──"
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"

          # Push the recovery image to /sdcard/Download/recovery.img.
          # 6-Z163d: retry loop — run 32994082069 hit "remote couldn't
          # create file: Operation not permitted" on the FIRST push
          # (redroid's sdcard/fuse daemon races the boot; the push step
          # runs seconds after sys.boot_completed). 5 attempts with a
          # 10s gap — every earlier run succeeded on attempt 1, so this
          # only catches the rare slow-fuse case.
          echo "── Pushing arm64 recovery image to /sdcard/Download/recovery.img ──"
          PUSH_OK=0
          for ATTEMPT in 1 2 3 4 5; do
            if $ADB push /tmp/twrp-arm64/recovery.img /sdcard/Download/recovery.img; then
              PUSH_OK=1
              echo "  ✓ push succeeded on attempt $ATTEMPT"
              break
            fi
            echo "  ⚠ push attempt $ATTEMPT failed (sdcard daemon racing?) — retrying in 10s"
            sleep 10
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "✗ recovery.img push failed after 5 attempts"
            $ADB shell ls -la /sdcard/ /sdcard/Download/ || true
            exit 1
          fi
          echo "  ✓ recovery.img pushed ($(stat -c%s /tmp/twrp-arm64/recovery.img) bytes)"
          $ADB shell ls -la /sdcard/Download/recovery.img

      - name: UI navigation — import ROM + boot container
        # ADB_SERIAL=localhost:5555 overrides the default emulator-5554
        # so ui-navigate.py talks to redroid instead of the AVD.
        env:
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '30' }}
          TWOYI_PACKAGE: io.twoyi.debug
          ADB_SERIAL: localhost:5555
        run: |
          mkdir -p /tmp/ui-e2e-artifacts
          python3 scripts/ui-navigate.py

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ \
            || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-arm64-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Stop redroid
        if: always()
        run: |
          sudo docker stop redroid 2>/dev/null || true
          sudo docker rm   redroid 2>/dev/null || true
