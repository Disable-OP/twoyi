#
# ARM64 UI-only end-to-end test for twoyi (TWRP boot).
#
# Goal: reach parity with ui-e2e-test.yml, but exercising the arm64-v8a
# build of twoyi's native libraries (libtwoyi.so, libOpenglRender.so,
# libloader.so, kr64) so that arm64-specific code paths in the Rust
# tracer and C++ loader get CI coverage.
#
# Architecture (v2 — switched from native bridge to real arm64 QEMU TCG):
#   - GitHub's free ubuntu-24.04-arm runners have NO nested virtualization
#     (no /dev/kvm), so an arm64-v8a Android system image would run in
#     TCG mode — too slow on a real arm64 host.
#   - ubuntu-latest (x86_64) runner WITH KVM for the host, but the Android
#     emulator itself runs an arm64-v8a system image (system-images;
#     android-30;default;arm64-v8a) under QEMU TCG software emulation
#     (NO hardware KVM accel — KVM can't virtualize arm64 on x86_64 HW).
#   - twoyi's APK is built for arm64-v8a ONLY — it runs NATIVELY on the
#     arm64 emulator (no translation layer, no native bridge).
#   - The TWRP recovery image is the arm64 `angler` (Nexus 6P) image
#     downloaded fresh each run from dl.twrp.me — its ramdisk's init
#     binary is a real aarch64 ELF, runs natively on the arm64 emulator.
#
# Why this replaced the native bridge approach (v1):
#   The native bridge (libndk_translation.so on google_apis_playstore
#   x86_64 image) translates the twoyi app's arm64 .so to x86_64 at
#   runtime. When twoyi's arm64 Rust kernel calls ptrace() on a forked
#   child, the kernel returns x86_64 register layout (struct
#   user_regs_struct), but the arm64-translated code expects arm64
#   layout (struct user_pt_regs — different field offsets, different
#   register count). This mismatch corrupts the register state and
#   the twoyi app crashes immediately on "Launch Container" tap →
#   run 32886902337: every screenshot from 5s..180s showed the launcher.
#
# What this tests that ui-e2e-test.yml does NOT:
#   - The arm64-v8a build of twoyi's Rust + C++ code actually links and
#     loads under a real arm64 Android runtime.
#   - The ptrace tracer's aarch64 struct layouts, syscall numbers, and
#     register handling get exercised end-to-end with a real arm64 guest.
#   - The fork+exec path in libtwoyi_loader_shlib.so works when the
#     guest ELF is a real arm64 binary (not native-bridge-translated).
#
# Differences from ui-e2e-test.yml (x86_64):
#   - System image: default;arm64-v8a (NOT google_apis;x86_64).
#     Pure AOSP, no Google services, smaller + faster than google_apis
#     arm64-v8a; supports `adb root` (used by sibling AOSP workflow).
#   - ABI: -Pabis=arm64-v8a (NOT x86_64).
#   - TWRP image: arm64 `angler` image downloaded at runtime (NOT the
#     committed x86 byt_t_crv2 image in assets/twrp/).
#   - Emulator flags: NO `-qemu -enable-kvm` (KVM can't do arm64 on
#     x86_64 HW); `-no-accel` forces QEMU TCG software emulation.
#   - Boot timeout: 1500s (25 min) — arm64 TCG boot is 10-20× slower
#     than x86_64 KVM.
#   - Job timeout: 90 min (vs 30 min) for slow arm64 boot + 10-min
#     TWRP container boot wait.
#   - default boot_wait_seconds: 600s (vs 60s) — arm64 TCG boots slow.
#   - ui-navigate.py's new post-Launch-Container + final assertions
#     abort the script (exit 1) if the app crashed back to launcher
#     (the bug that produced the false "TWRP works!" run 32886902337).
---
name: UI E2E Test (ARM64 via QEMU TCG)

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for the TWRP container to boot before capturing the final screenshot (seconds)'
        required: false
        default: '600'

concurrency:
  group: ui-e2e-test-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e-test-arm64:
    name: UI-only ARM64 (TWRP) E2E on arm64-v8a emulator (QEMU TCG)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: KVM is irrelevant for arm64-v8a system images — KVM can only
      # accelerate x86_64-on-x86_64, not arm64-on-x86_64. We keep this
      # step for symmetry with the x86_64 workflow (it's a no-op here
      # and takes <2s); the emulator below uses `-no-accel` to force
      # QEMU TCG software emulation.
      - name: Enable KVM access
        run: |
          set -u
          echo "── KVM availability (informational only — arm64 TCG does NOT use KVM) ──"
          if [ -e /dev/kvm ]; then
              echo "  /dev/kvm exists (would be used by x86_64 system images; ignored for arm64)"
          else
              echo "  /dev/kvm not present (expected on this runner; arm64 TCG does not need it)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cache Android SDK (arm64-v8a default system image)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: ${{ runner.os }}-sdk-android30-default-arm64-v8a-v1

      - name: Install Android SDK + emulator + arm64-v8a system image
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              cd /tmp
              CMDLINE_TOOLS_URL='https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
              curl -sL -o cmdline-tools.zip "$CMDLINE_TOOLS_URL"
              unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --update
          # default;arm64-v8a is pure AOSP, no Google services — smaller and
          # faster to boot than google_apis;arm64-v8a. The Android emulator
          # runs it via QEMU TCG (qemu-system-aarch64) on x86_64 host HW.
          sdkmanager \
              "platform-tools" \
              "platforms;android-30" \
              "build-tools;30.0.3" \
              "emulator" \
              "system-images;android-30;default;arm64-v8a"
          echo "✓ SDK + emulator + arm64-v8a (default) system image installed"

      - name: Create arm64-v8a AVD
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          set -ex
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME=/home/runner/.android/avd
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMGR="$(command -v avdmanager 2>/dev/null || true)"
          if [ -z "$AVDMGR" ] || [ ! -x "$AVDMGR" ]; then
            for d in "$ANDROID_HOME"/cmdline-tools/*/; do
              if [ -x "${d}bin/avdmanager" ]; then
                AVDMGR="${d}bin/avdmanager"
                break
              fi
            done
          fi
          echo "" | "$AVDMGR" create avd \
              -n twoyi_test_arm64 \
              -k "system-images;android-30;default;arm64-v8a" \
              --force
          AVD_CONFIG="$ANDROID_AVD_HOME/twoyi_test_arm64.avd/config.ini"
          {
              echo "hw.keyboard=yes"
              echo "hw.gpu.enabled=yes"
              echo "hw.gpu.mode=swiftshader_indirect"
              echo "hw.ramSize=4096"
              echo "disk.dataPartition.size=6144"
              echo "vm.heapSize=256"
              # Explicit ABI + tag (avdmanager usually sets these auto-
              # matically from the -k argument, but pinning them in the
              # config.ini protects against an upstream avdmanager
              # regression that picks the wrong ABI on a host that has
              # BOTH x86_64 and arm64-v8a system images installed).
              echo "abi.type=arm64-v8a"
              echo "tag.id=default"
              echo "image.sysdir.1=system-images/android-30/default/arm64-v8a/"
          } >> "$AVD_CONFIG"
          echo "✓ AVD created (arm64-v8a, default tag)"

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (arm64-v8a only)
        # CRITICAL: this is the entire point of this workflow. The twoyi
        # native libs (libtwoyi.so, libOpenglRender.so, libloader.so,
        # kr64) are built for aarch64-linux-android ONLY — not x86_64.
        # They run NATIVELY on the arm64-v8a emulator (no native bridge).
        # If the build fails here, it means the arm64 Rust/C++ code has
        # a compile-time issue — fix that before proceeding.
        run: ./gradlew assembleDebuggable -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Boot arm64-v8a emulator (headless, QEMU TCG)
        # CRITICAL difference from x86_64 workflow: NO -qemu -enable-kvm.
        # KVM on x86_64 hardware CANNOT emulate arm64 — it can only
        # virtualize x86_64 guests. The Android emulator auto-detects
        # that the AVD's system image is arm64-v8a and launches
        # qemu-system-aarch64 under the hood with TCG (software
        # translation). `-no-accel` makes this explicit and fails fast
        # if the host mistakenly thinks it can use KVM.
        # Boot time is 10-20 min (vs ~30s for x86_64 KVM) — budget
        # 1500s in the loop below; job timeout-minutes is 90 to give
        # the entire workflow plenty of room.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p /tmp/ui-e2e-artifacts
          "$ANDROID_HOME/emulator/emulator" -avd twoyi_test_arm64 \
              -no-window -no-audio -no-snapshot -no-boot-anim \
              -no-accel \
              -gpu swiftshader_indirect \
              -partition-size 4096 -read-only \
              -ports 5554,5555 \
              > /tmp/ui-e2e-artifacts/emulator-stdout.log \
              2> /tmp/ui-e2e-artifacts/emulator-stderr.log &
          EMULATOR_PID=$!
          echo $EMULATOR_PID > /tmp/emulator.pid
          echo "  emulator PID: $EMULATOR_PID"

          # arm64 TCG boot is slow (10-20 min). Poll sys.boot_completed
          # every 10s for up to 1500s (25 min). Die early if the emulator
          # process exits (qemu crash, bad system image, etc.).
          BOOT_TIMEOUT=1500
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
                  echo "  ✗ emulator died after ${WAITED}s"
                  tail -50 /tmp/ui-e2e-artifacts/emulator-stderr.log >&2 || true
                  tail -50 /tmp/ui-e2e-artifacts/emulator-stdout.log >&2 || true
                  exit 1
              fi
              BOOTED=$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                  echo "  ✓ boot_completed after ${WAITED}s"
                  break
              fi
              sleep 10
              WAITED=$((WAITED + 10))
              if [ $((WAITED % 60)) -eq 0 ]; then
                  echo "  still booting... ${WAITED}s elapsed"
              fi
          done
          if [ "$WAITED" -ge "$BOOT_TIMEOUT" ]; then
              echo "  ✗ emulator did not boot in ${BOOT_TIMEOUT}s"
              echo "  emulator-stderr.log (last 30 lines):"
              tail -30 /tmp/ui-e2e-artifacts/emulator-stderr.log || true
              echo "  emulator-stdout.log (last 30 lines):"
              tail -30 /tmp/ui-e2e-artifacts/emulator-stdout.log || true
              exit 1
          fi

          # Verify the running emulator is arm64-v8a (defensive —
          # catches a stale x86_64 AVD or a misconfigured system image).
          ABI=$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
          echo "  ro.product.cpu.abi = $ABI"
          if [ "$ABI" != "arm64-v8a" ]; then
              echo "  ✗ Emulator ABI is '$ABI' — expected arm64-v8a. Aborting."
              exit 1
          fi
          echo "  ✓ Emulator is arm64-v8a (no native bridge, no translation)"

      - name: Download arm64 TWRP image (Nexus 6P angler)
        # dl.twrp.me serves the .img with a referer-based anti-leech
        # check; without `-e` (Referer) the response is the HTML landing
        # page (~6.8KB) instead of the ~17MB binary image.
        # The angler image is the smallest verified-arm64 bootable TWRP
        # in TWRP 3.7.0_9-0 (same version as the existing x86 byt_t_crv2).
        # sha256: 21e41c0607b150f8dc5e5a4b0975a64d1eb62c4aff34920231d027e0793e8028
        # md5:    cf9a9067d18f64ed6992514826e1f9df
        run: |
          set -e
          mkdir -p /tmp/twrp-arm64
          cd /tmp/twrp-arm64
          # 3 retries; the dl.twrp.me CDN occasionally 503s under load.
          curl -fL --retry 3 -A "Mozilla/5.0" \
              -e "https://dl.twrp.me/angler/twrp-3.7.0_9-0-angler.img.html" \
              -o twrp-3.7.0_9-0-angler.img \
              "https://dl.twrp.me/angler/twrp-3.7.0_9-0-angler.img"
          echo "cf9a9067d18f64ed6992514826e1f9df  twrp-3.7.0_9-0-angler.img" | md5sum -c -
          ls -lh twrp-3.7.0_9-0-angler.img
          file twrp-3.7.0_9-0-angler.img || true

      - name: Install APK + push arm64 TWRP recovery.img
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ADB="adb -s emulator-5554"

          # arm64-v8a APK on arm64-v8a emulator → ABI matches natively.
          # If this fails with INSTALL_FAILED_NO_MATCHING_ABIS, the
          # emulator isn't actually arm64-v8a (check the verify step
          # above) or the APK was built for the wrong ABI.
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "── Installing APK: $APK ──"
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"

          # Push the arm64 TWRP image to /sdcard/Download/recovery.img.
          # The user said: "I already used an weird x86 TWRP image from
          # an x86_64 device, and TWRP still fully work" — TWRP's
          # recovery init is robust to arch mismatches, but for the
          # arm64 path test we use a real arm64 image (angler).
          echo "── Pushing arm64 TWRP image to /sdcard/Download/recovery.img ──"
          $ADB push /tmp/twrp-arm64/twrp-3.7.0_9-0-angler.img /sdcard/Download/recovery.img
          echo "  ✓ recovery.img pushed ($(stat -c%s /tmp/twrp-arm64/twrp-3.7.0_9-0-angler.img) bytes)"
          $ADB shell ls -la /sdcard/Download/recovery.img

      - name: UI navigation — import ROM + boot container
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '600' }}
          TWOYI_PACKAGE: io.twoyi.debug
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p /tmp/ui-e2e-artifacts
          python3 scripts/ui-navigate.py

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ \
            || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-arm64-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Kill emulator
        if: always()
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb -s emulator-5554 emu kill 2>/dev/null || true
