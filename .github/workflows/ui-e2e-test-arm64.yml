#
# ARM64 UI-only end-to-end test for twoyi (TWRP boot).
#
# Goal: reach parity with ui-e2e-test.yml (x86_64), but exercising the
# arm64-v8a build of twoyi's native libraries (libtwoyi.so,
# libOpenglRender.so, libloader.so, kr64) so that arm64-specific code
# paths in the Rust tracer and C++ loader get CI coverage.
#
# Architecture (v4 — switched to redroid after v1/v2/v3 all failed):
#   - redroid is a containerised REAL Android user space. It runs
#     Android as native arm64 Linux processes on the host kernel — NO
#     QEMU, NO KVM, NO TCG translation, NO native bridge. The Android
#     processes (init, zygote, system_server, surfaceflinger, app
#     processes) are regular Linux tasks visible to the host kernel.
#     This means:
#       * Real ARM64 ptrace ABI (struct user_pt_regs, iov_len == 272)
#         — the WHOLE POINT of this workflow.
#       * Near-native speed (no JIT translation overhead).
#       * ADB over TCP port 5555.
#       * Standard Android screencap (no custom framebuffer plumbing).
#   - The runner is GitHub's `ubuntu-24.04-arm` (aarch64 Ampere
#     hardware, Ubuntu 24.04 LTS). Its kernel (linux-azure 6.17) ships
#     `binder_linux.ko` as a loadable module in the
#     `linux-modules-extra-$(uname -r)` apt package — NOT preinstalled
#     but installable in ~5 seconds. Modern redroid uses `memfd`
#     instead of the removed `ashmem` Linux 5.18+ module.
#   - The twoyi APK is built for arm64-v8a ONLY and runs NATIVELY on
#     redroid (no translation layer, no native bridge).
#   - The TWRP recovery image is the arm64 `angler` (Nexus 6P) image
#     downloaded fresh each run from dl.twrp.me — its ramdisk's init
#     binary is a real aarch64 ELF, ptrace'd natively by twoyi's
#     arm64-v8a tracer.
#
# Why v4 (redroid) replaced v3 (x86_64 runner + arm64-v8a system image):
#   v3 tried `sdkmanager "emulator"` on ubuntu-24.04-arm to install an
#   arm64 Android emulator binary. This permanently fails because Google
#   does NOT publish an aarch64 Linux binary for the `emulator` package
#   via sdkmanager — only `emulator-linux_x64-*.zip` exists in the
#   repository2-3.xml. See runs 32901106471 (v1) + 32901574547 (v2) +
#   the blocker report at download/arm64-emulator-blocker-report.md.
#
# Why v3 replaced v2 (x86_64 runner + arm64-v8a system image):
#   The Android emulator binary shipped with the Linux x86_64 Android
#   SDK does NOT include an arm64 TCG backend. v2's run 32891455624
#   failed in 10s with `FATAL: Avd's CPU Architecture 'arm64' is not
#   supported by the QEMU2 emulator on x86_64 host. System image
#   must match the host architecture.`
#
# Why v2 replaced v1 (native bridge on x86_64 Play Store image):
#   The native bridge (libndk_translation.so on google_apis_playstore
#   x86_64 image) translates the twoyi app's arm64 .so to x86_64 at
#   runtime. When twoyi's arm64 Rust kernel calls ptrace() on a forked
#   child, the kernel returns x86_64 register layout (struct
#   user_regs_struct), but the arm64-translated code expects arm64
#   layout (struct user_pt_regs — different field offsets, different
#   register count). This mismatch corrupts the register state and
#   the twoyi app crashes immediately on "Launch Container" tap →
#   run 32886902337: every screenshot from 5s..180s showed the launcher.
#   This was the "false-green TWRP" run that prompted this v4 rewrite.
#
# What this tests that ui-e2e-test.yml (x86_64) does NOT:
#   - The arm64-v8a build of twoyi's Rust + C++ code actually links and
#     loads under a real arm64 Android runtime.
#   - The ptrace tracer's aarch64 struct layouts, syscall numbers, and
#     register handling get exercised end-to-end with a real arm64 guest.
#   - The fork+exec path in libtwoyi_loader_shlib.so works when the
#     guest ELF is a real arm64 binary (not native-bridge-translated).
#
# Differences from ui-e2e-test.yml (x86_64):
#   - Android runtime: redroid Docker container (NOT the sdk emulator).
#     Image: redroid/redroid:11.0.0-latest (Android 11 = API 30, the
#     same version as the x86_64 sibling for apples-to-apples parity).
#   - Runner: ubuntu-24.04-arm (arm64 Ampere hardware, NO /dev/kvm
#     but redroid doesn't need it — Android runs as host processes).
#   - Boot accelerator: NONE needed — redroid boots in ~30-60s as
#     native processes on the host CPU.
#   - ADB serial: `localhost:5555` (TCP) instead of `emulator-5554`
#     (qemud). ui-navigate.py picks this up from the ADB_SERIAL env
#     var; the x86_64 default `emulator-5554` is preserved.
#   - Setup: install `linux-modules-extra-$(uname -r)` apt package
#     (provides binder_linux.ko) + modprobe + mount binderfs + start
#     the redroid container with `docker run`.
#   - Cleanup: `docker stop redroid` (instead of `adb emu kill`).
#   - Job timeout: 60 min (vs 30 min — extra slack for first-run
#     docker pull of the ~800MB redroid image).
#   - TWRP image: arm64 `angler` image downloaded at runtime (NOT the
#     committed x86 byt_t_crv2 image in assets/twrp/).
#   - ui-navigate.py's post-Launch-Container + final assertions abort
#     the script (exit 1) if the app crashed back to launcher (the
#     bug that produced the false-green v1 run 32886902337).
---
name: UI E2E Test (ARM64 via redroid on ubuntu-24.04-arm)

'on':
  workflow_dispatch:
    inputs:
      boot_wait_seconds:
        description: 'How long to wait for the TWRP container to boot before capturing the final screenshot (seconds)'
        required: false
        default: '600'

concurrency:
  group: ui-e2e-test-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e-test-arm64:
    name: UI-only ARM64 (TWRP) E2E on redroid (arm64 runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────
      # Step: Provision redroid prerequisites
      #
      # ubuntu-24.04-arm runner image does NOT preinstall:
      #   - linux-modules-extra-$(uname -r) — needed for binder_linux.ko
      #   - android-tools-adb                — needed for ADB client
      #   - docker.io                        — Docker is preinstalled but
      #                                       apt-install is a no-op if so
      #
      # Kernel config (verified from linux-buildinfo-6.17.0-1022-azure
      # deb): CONFIG_ANDROID_BINDER_IPC=m, CONFIG_ANDROID_BINDERFS=m,
      # CONFIG_ANDROID_BINDER_DEVICES="" (binderfs-only mode — must
      # mount -t binder to materialise /dev/binderfs/{binder,hwbinder,vndbinder}).
      # ───────────────────────────────────────────────────────────────
      - name: Provision redroid prerequisites (binderfs + adb)
        run: |
          set -e
          echo "── Runner architecture ──"
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
              echo "  ✗ Runner is $(uname -m), expected aarch64. ubuntu-24.04-arm required."
              exit 1
          fi
          echo "  ✓ Running on aarch64 hardware"

          echo "── Install kernel modules + adb ──"
          # linux-modules-extra ships binder_linux.ko (verified).
          # android-tools-adb provides the `adb` CLI.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              linux-modules-extra-$(uname -r) \
              android-tools-adb

          echo "── Load binderfs + mount at /dev/binderfs ──"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs/
          # redroid 11.0.0-latest still hard-codes /dev/binder (not
          # binderfs). Symlinks let the old tag work.
          sudo ln -sf /dev/binderfs/binder     /dev/binder
          sudo ln -sf /dev/binderfs/hwbinder   /dev/hwbinder
          sudo ln -sf /dev/binderfs/vndbinder  /dev/vndbinder
          ls -la /dev/binder /dev/hwbinder /dev/vndbinder
          echo "  ✓ binderfs mounted + /dev/binder symlinks created"

          # Docker is preinstalled on ubuntu-24.04-arm but double-check.
          command -v docker >/dev/null || sudo apt-get install -y docker.io
          docker --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rs/target
            app/rs/loader/target
          key: ${{ runner.os }}-{{ runner.arch }}-cargo-arm64-${{ hashFiles('app/rs/Cargo.lock', 'app/rs/Cargo.toml', 'app/rs/loader/Cargo.lock', 'app/rs/loader/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-{{ runner.arch }}-cargo-

      - name: Cache cargo-xdk
        id: cache-cargo-xdk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xdk
          key: ${{ runner.os }}-{{ runner.arch }}-cargo-xdk-2.12.6

      - name: Install cargo-xdk
        if: steps.cache-cargo-xdk.outputs.cache-hit != 'true'
        run: cargo install cargo-xdk

      - name: Setup Android NDK (direct sdkmanager — works on arm64 hosts)
        # The nttld/setup-ndk@v1 action rejects linux-arm64 with
        # "Error: Unsupported host 'linux-arm64'" (run 32892478844).
        # Direct sdkmanager install works because the NDK package is
        # host-agnostic (ships binaries for x86_64 + arm64 Linux).
        id: setup-ndk
        run: |
          set -e
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              cd /tmp
              curl -sL -o cmdline-tools.zip 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
              unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm cmdline-tools.zip
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # NDK r27c (LTS, late 2024). Numeric ID 27.3.13750724.
          sdkmanager "ndk;27.3.13750724"
          NDK_PATH="$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$NDK_PATH" || { echo "✗ NDK r27c install failed"; exit 1; }
          echo "ndk-path=$NDK_PATH" >> "$GITHUB_OUTPUT"
          echo "  ✓ NDK r27c installed at $NDK_PATH"

      - name: Grant execute permission for gradlew and build scripts
        run: |
          chmod +x gradlew
          chmod +x app/rs/build_rs.sh
          chmod +x app/rs/loader/build.sh || true

      - name: Build APK (arm64-v8a only)
        # CRITICAL: this is the entire point of this workflow. The twoyi
        # native libs (libtwoyi.so, libOpenglRender.so, libloader.so,
        # kr64) are built for aarch64-linux-android ONLY.
        # On redroid they run NATIVELY (no native bridge, no
        # translation). If the build fails here, it means the arm64
        # Rust/C++ code has a compile-time issue — fix that first.
        run: ./gradlew assembleDebuggable -Pabis=arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /home/runner/android-sdk

      # ───────────────────────────────────────────────────────────────
      # Step: Pull + launch redroid (arm64-v8a Android 11)
      #
      # Image: redroid/redroid:11.0.0-latest (Android 11 = API 30, the
      # same version as the x86_64 sibling for apples-to-apples parity).
      # 800MB arm64 layer on Docker Hub; first-run pull takes ~30s on
      # GitHub's network. Subsequent runs hit Docker layer cache.
      #
      # Redroid boots in ~30-60s on the arm64 Ampere CPU — Android is
      # running as native processes, not as a VM. Poll sys.boot_completed
      # every 5s; die early if `docker logs` shows a binder/ashmem error.
      # ───────────────────────────────────────────────────────────────
      - name: Pull + launch redroid (arm64-v8a Android 11)
        run: |
          set -e
          mkdir -p /tmp/ui-e2e-artifacts
          # Pull first (separate from `run` so failure is visible)
          sudo docker pull redroid/redroid:11.0.0-latest
          # Launch — bind-mount binderfs, use memfd (no ashmem on 6.17),
          # software GPU (no /dev/dri on hosted arm runners).
          sudo docker run -itd --rm --privileged \
              --name redroid \
              -v /dev/binderfs:/dev/binderfs:rw \
              -v $HOME/redroid-data:/data \
              -p 5555:5555 \
              redroid/redroid:11.0.0-latest \
              androidboot.use_memfd=1 \
              androidboot.redroid_gpu_mode=guest
          REDROID_PID=$(sudo docker inspect -f '{{.State.Pid}}' redroid)
          echo "  redroid container PID: $REDROID_PID"
          echo $REDROID_PID > /tmp/redroid.pid

          # Wait for boot_completed (up to 300s — usually 30-60s)
          BOOT_TIMEOUT=300
          WAITED=0
          while [ "$WAITED" -lt "$BOOT_TIMEOUT" ]; do
              # `adb connect localhost:5555` may fail for the first ~10s
              # while redroid's adbd is starting; retry every loop iter.
              adb connect localhost:5555 >/dev/null 2>&1 || true
              BOOTED=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                  echo "  ✓ boot_completed after ${WAITED}s"
                  break
              fi
              # Die early if redroid crashed
              if ! sudo docker ps --filter name=redroid --filter status=running | grep -q redroid; then
                  echo "  ✗ redroid container died after ${WAITED}s"
                  sudo docker logs redroid 2>&1 | tail -50
                  exit 1
              fi
              sleep 5
              WAITED=$((WAITED + 5))
              if [ $((WAITED % 30)) -eq 0 ]; then
                  echo "  still booting... ${WAITED}s elapsed"
              fi
          done
          if [ "$WAITED" -ge "$BOOT_TIMEOUT" ]; then
              echo "  ✗ redroid did not boot in ${BOOT_TIMEOUT}s"
              sudo docker logs redroid 2>&1 | tail -100
              exit 1
          fi

          # Defensive: verify the running redroid is actually arm64-v8a.
          ABI=$(adb -s localhost:5555 shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
          echo "  ro.product.cpu.abi = $ABI"
          if [ "$ABI" != "arm64-v8a" ]; then
              echo "  ✗ redroid ABI is '$ABI' — expected arm64-v8a. Aborting."
              exit 1
          fi
          SDK=$(adb -s localhost:5555 shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)
          echo "  ro.build.version.sdk = $SDK (expect 30 for Android 11)"
          echo "  ✓ redroid is arm64-v8a Android 11 (no native bridge, no translation)"

      - name: Download arm64 TWRP image (Nexus 6P angler)
        # dl.twrp.me serves the .img with a referer-based anti-leech
        # check; without `-e` (Referer) the response is the HTML landing
        # page (~6.8KB) instead of the ~17MB binary image.
        # The angler image is the smallest verified-arm64 bootable TWRP
        # in TWRP 3.7.0_9-0 (same version as the existing x86 byt_t_crv2).
        # sha256: 21e41c0607b150f8dc5e5a4b0975a64d1eb62c4aff34920231d027e0793e8028
        # md5:    cf9a9067d18f64ed6992514826e1f9df
        run: |
          set -e
          mkdir -p /tmp/twrp-arm64
          cd /tmp/twrp-arm64
          # 3 retries; the dl.twrp.me CDN occasionally 503s under load.
          curl -fL --retry 3 -A "Mozilla/5.0" \
              -e "https://dl.twrp.me/angler/twrp-3.7.0_9-0-angler.img.html" \
              -o twrp-3.7.0_9-0-angler.img \
              "https://dl.twrp.me/angler/twrp-3.7.0_9-0-angler.img"
          echo "cf9a9067d18f64ed6992514826e1f9df  twrp-3.7.0_9-0-angler.img" | md5sum -c -
          ls -lh twrp-3.7.0_9-0-angler.img
          file twrp-3.7.0_9-0-angler.img || true

      - name: Install APK + push arm64 TWRP recovery.img
        run: |
          set -e
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          ADB="adb -s localhost:5555"

          # arm64-v8a APK on arm64-v8a redroid → ABI matches natively.
          # If this fails with INSTALL_FAILED_NO_MATCHING_ABIS, redroid
          # isn't actually arm64-v8a (check the verify step above) or
          # the APK was built for the wrong ABI.
          APK=$(ls app/build/outputs/apk/debuggable/*.apk | head -1)
          echo "── Installing APK: $APK ──"
          $ADB install -t -g "$APK" || { echo "✗ install failed"; exit 1; }
          echo "  ✓ APK installed"

          # Push the arm64 TWRP image to /sdcard/Download/recovery.img.
          echo "── Pushing arm64 TWRP image to /sdcard/Download/recovery.img ──"
          $ADB push /tmp/twrp-arm64/twrp-3.7.0_9-0-angler.img /sdcard/Download/recovery.img
          echo "  ✓ recovery.img pushed ($(stat -c%s /tmp/twrp-arm64/twrp-3.7.0_9-0-angler.img) bytes)"
          $ADB shell ls -la /sdcard/Download/recovery.img

      - name: UI navigation — import ROM + boot container
        # ADB_SERIAL=localhost:5555 overrides the default emulator-5554
        # so ui-navigate.py talks to redroid instead of the AVD.
        env:
          ANDROID_HOME: /home/runner/android-sdk
          BOOT_WAIT_SECONDS: ${{ github.event.inputs.boot_wait_seconds || '600' }}
          TWOYI_PACKAGE: io.twoyi.debug
          ADB_SERIAL: localhost:5555
        run: |
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p /tmp/ui-e2e-artifacts
          python3 scripts/ui-navigate.py

      - name: Pack artifacts
        if: always()
        run: |
          ./scripts/pack-logs.sh /tmp/ui-e2e-logs.tar.xz \
            /tmp/ui-e2e-artifacts/ \
            || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-arm64-logs
          path: /tmp/ui-e2e-logs.tar.xz
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Stop redroid
        if: always()
        run: |
          sudo docker stop redroid 2>/dev/null || true
          sudo docker rm   redroid 2>/dev/null || true
