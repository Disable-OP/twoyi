# Twoyi Universal Recovery Corpus Manifest (§23–§25)
#
# Every entry is a recovery image Twoyi should boot. CI dedupes by sha256
# after download; md5 (when known) is verified pre-boot. The manifest is
# data, not code: adding a recovery = adding an entry, never editing the
# workflow (§32).
#
# Fields:
#   name        unique label (also the CI concurrency group)
#   family      TWRP | OrangeFox | SHRP | Lineage | AOSP | OEM | custom
#   device      codename
#   arch        arm64 | arm | x86_64 | x86
#   generation  android generation this recovery was built for
#   tier        pr   → runs on every PR CI (small representative set)
#               nightly → runs in the nightly full corpus
#   url         direct URL of the image (.img, or .zip containing recovery.img)
#   referer     optional Referer header (dl.twrp.me anti-leech)
#   md5         optional md5 verification
#   sha256      known sha256 (filled by the inspector; empty = computed at CI)
#   notes       free-form context (known behaviors, upstream status…)
#
# Ground truth rule (§24): "official" ≠ known-good. Results come only from
# actually booting the artifact.

